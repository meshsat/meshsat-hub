# NATS Server configuration for MeshSat Hub — base config (no mTLS).
#
# For production with mTLS bridge auth, use nats-mtls.conf instead.
# This config is for standalone/dev mode.
#
# All MQTT clients authenticate with shared password.

# Client connections
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

server_name: meshsat-nats

# JetStream
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# Authorization — shared password for all MQTT clients.
authorization {
  users = [
    { user: meshsat, password: "$NATS_MQTT_PASSWORD" }
  ]
}

# MQTT adapter
mqtt {
  listen: 0.0.0.0:1883
  ack_wait: "30s"
  max_ack_pending: 100
}

# WebSocket — no mTLS in standalone mode.
websocket {
  port: 9443
  no_tls: true
}

# Leaf nodes
leafnodes {
  port: 7422
  authorization {
    user: leafnode
    password: "$NATS_LEAFNODE_TOKEN"
  }
}

debug: false
trace: false
logtime: true
