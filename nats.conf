# NATS Server configuration for MeshSat Hub — base config (no mTLS).
#
# For production with mTLS bridge auth, use nats-mtls.conf instead.
# This config is for standalone/dev mode where bridges connect via
# plain TCP or where mTLS is terminated by an external proxy.
#
# Uses NATS accounts to separate Hub (password) and bridge (open) auth.

# Client connections
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# Server name (override per instance via env: NATS_SERVER_NAME)
server_name: meshsat-nats

# JetStream — persistent message streams
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# ===========================================================================
# ACCOUNTS
# ===========================================================================
accounts {
  HUB {
    users = [
      { user: meshsat, password: "$NATS_MQTT_PASSWORD" }
    ]
    exports = [
      { stream: ">" }
      { service: ">" }
    ]
    imports = [
      { stream: { account: BRIDGE, subject: ">" } }
      { service: { account: BRIDGE, subject: ">" } }
    ]
    jetstream: enabled
  }

  BRIDGE {
    users = [
      { user: bridge }
    ]
    exports = [
      { stream: ">" }
      { service: ">" }
    ]
    imports = [
      { stream: { account: HUB, subject: ">" } }
      { service: { account: HUB, subject: ">" } }
    ]
    jetstream: enabled
  }
}

# MQTT adapter — Hub connects with password auth (HUB account).
mqtt {
  listen: 0.0.0.0:1883
  no_auth_user: meshsat

  ack_wait: "30s"
  max_ack_pending: 100
}

# WebSocket — bridges connect without mTLS in standalone mode.
websocket {
  port: 9443
  no_auth_user: bridge
  no_tls: true
}

# Leaf nodes — cross-site message routing.
leafnodes {
  port: 7422
  authorization {
    token: "$NATS_LEAFNODE_TOKEN"
    account: HUB
  }
}

# Logging
debug: false
trace: false
logtime: true
