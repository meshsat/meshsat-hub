# NATS Server configuration for MeshSat Hub cluster mode.
# NATS replaces Mosquitto as the message bus and adds JetStream for persistence.
# The MQTT adapter allows field devices and legacy MQTT clients to connect natively.

# Client connections
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# Server name (override per instance via env: NATS_SERVER_NAME)
server_name: meshsat-nats

# JetStream — persistent message streams
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# MQTT adapter — field devices connect here instead of Mosquitto
mqtt {
  listen: 0.0.0.0:1883

  # Allow anonymous MQTT connections (same as standalone Mosquitto config).
  # In production, set authorization via NATS accounts or use Hub-level auth.
  no_auth_user: meshsat

  # Retain messages via JetStream
  ack_wait: "30s"
  max_ack_pending: 100
}

# Authorization — single user for MQTT adapter
authorization {
  users = [
    { user: meshsat, password: "" }
  ]
}

# WebSocket + mTLS — bridges connect via wss://mqtt.hub.meshsat.net/mqtt (MESHSAT-383).
# HAProxy does SNI-based TCP passthrough (no TLS termination) → NATS handles TLS directly.
# Client certificates signed by the Hub CA are required (mutual TLS).
# Server cert: wildcard *.meshsat.net mounted from /srv/certs on DMZ host.
# Client CA: Hub bridge CA cert exported to shared nats-certs volume.
websocket {
  port: 9443
  tls {
    cert_file: /etc/nats/certs/server.crt
    key_file: /etc/nats/certs/server.key
    ca_file: /etc/nats/certs/bridge-ca.crt
    verify: true
  }
}

# Leaf nodes — cross-site message routing (MESHSAT-382).
# Each site listens on 7422 and connects to the peer site as a leaf.
# All pub/sub messages (including MQTT) are forwarded bidirectionally.
# Set NATS_LEAF_REMOTE_URL per site (e.g. in docker-compose environment).
# Default: no remotes (standalone mode).
leafnodes {
  port: 7422
}

# Logging
debug: false
trace: false
logtime: true
