# NATS Server configuration for MeshSat Hub — mTLS mode with accounts.
#
# Two NATS accounts isolate authentication domains:
#
#   HUB account   — Hub service connects via plain TCP on :1883 with password.
#   BRIDGE account — Field bridges connect via WSS on :9443 with mTLS client certs.
#
# Both accounts share all MQTT subjects via account imports/exports, so
# messages flow freely between Hub and bridges. Authentication is separate:
# adding a password to the Hub account doesn't break certificate-only bridges.
#
# Certificate paths (mounted via docker-compose volumes):
#   /etc/nats/certs/server.crt      — server certificate (meshsat.net wildcard)
#   /etc/nats/certs/server.key      — server private key
#   /etc/nats/certs/bridge-ca.crt   — bridge CA certificate (verifies client certs)

# Client connections (NATS native protocol — internal only)
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# Server name (override per instance via env or --name flag)
server_name: meshsat-nats

# JetStream — persistent message streams
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# ===========================================================================
# ACCOUNTS — separate auth domains for Hub (password) and bridges (mTLS)
# ===========================================================================
accounts {
  # HUB account: Hub service authenticates with username/password on :1883.
  HUB {
    users = [
      { user: meshsat, password: "$NATS_MQTT_PASSWORD" }
    ]

    # Export all subjects so BRIDGE account can import them.
    exports = [
      { stream: ">" }
      { service: ">" }
    ]

    # Import everything from BRIDGE so Hub sees bridge messages.
    imports = [
      { stream: { account: BRIDGE, subject: ">" } }
      { service: { account: BRIDGE, subject: ">" } }
    ]

    jetstream: enabled
  }

  # BRIDGE account: bridges authenticate with mTLS client certificates on :9443.
  # The "bridge" user has no password — authentication is via TLS client cert.
  # The certificate CN (bridge ID) is used for MQTT client identification.
  BRIDGE {
    users = [
      { user: bridge }
    ]

    # Export all subjects so HUB account can import them.
    exports = [
      { stream: ">" }
      { service: ">" }
    ]

    # Import everything from HUB so bridges see Hub-published messages (commands, MT).
    imports = [
      { stream: { account: HUB, subject: ">" } }
      { service: { account: HUB, subject: ">" } }
    ]

    jetstream: enabled
  }
}

# ===========================================================================
# MQTT adapter — Hub connects here via plain TCP (internal Docker bridge).
# Mapped to the HUB account via no_auth_user.
# ===========================================================================
mqtt {
  listen: 0.0.0.0:1883

  # Route unauthenticated MQTT connections to the HUB account.
  # Since HUB account requires password, this enforces password auth.
  no_auth_user: meshsat

  ack_wait: "30s"
  max_ack_pending: 100
}

# ===========================================================================
# WebSocket with mTLS — bridges connect via wss:// (SNI passthrough).
#
# Architecture:
#   Bridge → wss://mqtt-hub.meshsat.net:443
#     → HAProxy (SNI passthrough, no TLS termination)
#       → NATS :9443 (TLS + client cert verification)
#
# Client certificates are issued via POST /api/bridges/{id}/certificate.
# Each cert has CN=bridge_id, ExtKeyUsage=ClientAuth, signed by bridge CA.
#
# Bridges connecting via mTLS are mapped to the BRIDGE account.
# No password required — the certificate IS the authentication.
# ===========================================================================
websocket {
  port: 9443

  # Map all mTLS-authenticated connections to the BRIDGE account.
  # The "bridge" user in the BRIDGE account has no password — the client
  # certificate is the authentication. NATS still requires a user mapping.
  no_auth_user: bridge

  tls {
    cert_file: /etc/nats/certs/server.crt
    key_file: /etc/nats/certs/server.key
    ca_file: /etc/nats/certs/bridge-ca.crt
    verify: true
    timeout: 5
  }
}

# ===========================================================================
# Leaf nodes — cross-site message routing.
# Token-authenticated to prevent unauthorized cluster peering.
# ===========================================================================
leafnodes {
  port: 7422
  authorization {
    token: "$NATS_LEAFNODE_TOKEN"
    account: HUB
  }
}

# Logging
debug: false
trace: false
logtime: true
