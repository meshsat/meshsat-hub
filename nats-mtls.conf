# NATS Server configuration for MeshSat Hub — mTLS mode.
#
# All MQTT clients (Hub + bridges) authenticate with the shared password.
# Hub connects via TCP :1883, bridges via WSS :9443 (mTLS + password).
#
# Bridge identity is preserved via:
#   - MQTT client ID: meshsat-bridge-<name> (visible in NATS logs)
#   - mTLS certificate CN: bridge-specific (verified by NATS)
#
# Certificate paths (mounted via docker-compose volumes):
#   /etc/nats/certs/server.crt      — server certificate (meshsat.net wildcard)
#   /etc/nats/certs/server.key      — server private key
#   /etc/nats/certs/bridge-ca.crt   — bridge CA certificate (verifies client certs)

# Client connections (NATS native protocol — internal only)
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# Server name (override per instance via env or --name flag)
server_name: meshsat-nats

# JetStream — persistent message streams
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# ===========================================================================
# AUTHORIZATION — shared password for all MQTT clients.
#
# Hub connects as meshsat:$NATS_MQTT_PASSWORD via TCP :1883.
# Bridges connect as meshsat:$NATS_MQTT_PASSWORD via WSS :9443 (+ mTLS cert).
# MQTT client ID provides per-bridge identity (meshsat-bridge-<name>).
#
# no_auth_user is NOT set — all clients MUST provide credentials.
# ===========================================================================
authorization {
  users = [
    { user: meshsat, password: "$NATS_MQTT_PASSWORD" }
  ]
}

# MQTT adapter — Hub and bridges both connect here.
# Hub via plain TCP (internal Docker bridge), bridges via WSS (external mTLS).
mqtt {
  listen: 0.0.0.0:1883
  ack_wait: "30s"
  max_ack_pending: 100
}

# WebSocket with mTLS — field bridges connect via wss:// (SNI passthrough).
#
# Architecture:
#   Bridge → wss://mqtt-hub.meshsat.net:443
#     → HAProxy (SNI passthrough, no TLS termination)
#       → NATS :9443 (TLS handshake + client cert verification)
#
# Bridges MUST:
#   1. Present a valid client certificate (signed by bridge CA)
#   2. Authenticate with MQTT username=meshsat, password=$NATS_MQTT_PASSWORD
#
# The mTLS cert verifies the bridge is authorized.
# The password verifies the bridge knows the shared secret.
# Double authentication — both required.
websocket {
  port: 9443

  tls {
    cert_file: /etc/nats/certs/server.crt
    key_file: /etc/nats/certs/server.key
    ca_file: /etc/nats/certs/bridge-ca.crt
    verify: true
    timeout: 5
  }
}

# Leaf nodes — cross-site message routing.
# Token-authenticated to prevent unauthorized cluster peering.
leafnodes {
  port: 7422
  authorization {
    user: leafnode
    password: "$NATS_LEAFNODE_TOKEN"
  }
}

# Logging
debug: false
trace: false
logtime: true
