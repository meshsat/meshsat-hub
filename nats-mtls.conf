# NATS Server configuration for MeshSat Hub — mTLS mode.
#
# Extends the base NATS config with TLS on the WebSocket listener.
# Bridges connect via wss:// with client certificates issued by the
# Hub bridge CA. HAProxy/nginx does SNI passthrough so NATS handles
# TLS termination and client cert verification directly.
#
# Internal MQTT (Hub ↔ NATS on hubnet) stays plain TCP on port 1883.
#
# Certificate paths (mounted via docker-compose volumes):
#   /etc/nats/certs/server.crt      — server certificate (meshsat.net wildcard)
#   /etc/nats/certs/server.key      — server private key
#   /etc/nats/certs/bridge-ca.crt   — bridge CA certificate (verifies client certs)

# Client connections (NATS native protocol — internal only)
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# Server name (override per instance via env or --name flag)
server_name: meshsat-nats

# JetStream — persistent message streams
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# MQTT adapter — Hub service connects here via plain TCP (internal hubnet).
# No TLS on this listener — traffic never leaves the Docker bridge network.
# Authentication required: password set via NATS_MQTT_PASSWORD env var.
mqtt {
  listen: 0.0.0.0:1883
  no_auth_user: meshsat

  ack_wait: "30s"
  max_ack_pending: 100
}

# Authorization — MQTT and NATS client auth.
authorization {
  users = [
    { user: meshsat, password: "$NATS_MQTT_PASSWORD" }
  ]
}

# WebSocket with mTLS — field bridges connect via wss:// (SNI passthrough).
#
# Architecture:
#   Bridge → wss://mqtt.meshsat.net:443 (or :9443)
#     → HAProxy (SNI passthrough, no TLS termination)
#       → NATS :9443 (TLS handshake + client cert verification)
#
# NATS performs:
#   1. TLS handshake using server cert (meshsat.net wildcard)
#   2. Client certificate verification against bridge CA
#   3. Bridge ID extraction from certificate CN
#   4. MQTT session establishment over WebSocket
#
# verify: true  — bridges MUST present a valid client certificate.
# Certificates are issued via POST /api/bridges/{id}/certificate on the Hub API.
# Each cert has CN=bridge_id, ExtKeyUsage=ClientAuth, signed by the bridge CA.
websocket {
  port: 9443

  tls {
    cert_file: /etc/nats/certs/server.crt
    key_file: /etc/nats/certs/server.key
    ca_file: /etc/nats/certs/bridge-ca.crt
    verify: true
    timeout: 5
  }
}

# Leaf nodes — cross-site message routing.
# Authentication required on both listen and remote connections.
leafnodes {
  port: 7422
  authorization {
    token: "$NATS_LEAFNODE_TOKEN"
  }
}

# Logging
debug: false
trace: false
logtime: true
