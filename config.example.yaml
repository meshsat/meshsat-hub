# --- Subscription tiers (MESHSAT-989) ---
# One combined ceiling on registered devices and bridges per tenant. It gates
# REGISTRATION only: a tenant over its cap, or on a plan that has lapsed, keeps
# every device it already has, keeps ingesting, and keeps its SOS path. Nothing
# here can stop a distress call.
# -1 means no ceiling. Env overrides: HUB_PLAN_FREE_DEVICES and friends.
plan_device_limits:
  free: 4
  crew: 24
  fleet: 100
  custom: -1
# Where the app sends someone who wants a larger tier, when checkout does NOT
# start in the Hub. Leave it unset if you have configured Stripe below: the
# Settings page then draws its own Subscribe button instead of this link. It is
# for a self-hoster whose payments go somewhere this Hub knows nothing about.
upgrade_url: ""
# Customer receipts (MESHSAT-998). A payment is recorded in the receipts
# outbox whatever these say; they decide whether a document is issued for it.
# With the URL or token unset, payments are recorded and no receipt goes out --
# recoverable, because the outbox is drained as soon as they are set.
#
# The token is COMPANY-SCOPED in Invoice Ninja: it decides which brand, VAT
# treatment and invoice number series a receipt is issued under.
invoiceninja_url: ""
invoiceninja_token: ""
# The tax that goes on every line. The target company has inclusive taxes on,
# so this is derived OUT of the price the customer paid, never added to it:
# EUR 9.00 is 7.44 plus 1.56 VAT. It has to be sent explicitly because the
# company default rate is a web-UI prefill the API does not apply.
invoiceninja_tax_name: "BTW 21"
invoiceninja_tax_rate: 21
# The only currency that company invoices in. A payment in anything else is
# parked for a person rather than converted at an invented rate.
invoiceninja_currency: "EUR"
invoiceninja_country_id: "528"
invoiceninja_timeout: 30s
