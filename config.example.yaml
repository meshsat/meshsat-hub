# --- Subscription tiers (MESHSAT-989) ---
# One combined ceiling on registered devices and bridges per tenant. It gates
# REGISTRATION only: a tenant over its cap, or on a plan that has lapsed, keeps
# every device it already has, keeps ingesting, and keeps its SOS path. Nothing
# here can stop a distress call.
# -1 means no ceiling. Env overrides: HUB_PLAN_FREE_DEVICES and friends.
plan_device_limits:
  free: 4
  crew: 24
  fleet: 100
  custom: -1
# Where the app sends someone who wants a larger tier.
upgrade_url: "https://ko-fi.com/X2S326G23T"
# Ko-fi subscription webhook. kofi_webhook_secret is ours and forms the URL
# given to Ko-fi, https://<host>/api/webhook/kofi/<secret>; the verification
# token is issued by Ko-fi and copied from its webhook settings page. With
# either unset the endpoint refuses every request.
kofi_webhook_secret: ""
kofi_verification_token: ""
# Ko-fi tier name -> plan, when the names on the Ko-fi page differ from the
# plan names. Unset, the tier name is read as a plan name.
# kofi_tier_map:
#   "Crew Membership": crew
#   "Fleet Membership": fleet
# How many ATAK markers the OTS poller may auto-register. These rows never
# count against anyone's subscription; this bounds a runaway TAK server.
tak_api_max_devices: 5000
