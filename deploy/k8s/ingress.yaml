apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshsat-hub
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-hub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hub.example.com
      secretName: meshsat-hub-tls
  rules:
    - host: hub.example.com
      http:
        paths:
          - path: /mqtt
            pathType: Exact
            backend:
              service:
                name: meshsat-nats
                port:
                  number: 9001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meshsat-hub
                port:
                  number: 6070
