apiVersion: v1
kind: ConfigMap
metadata:
  name: meshsat-hub-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-hub
data:
  HUB_MODE: "kubernetes"
  HUB_PORT: "6070"
  HUB_LOG_LEVEL: "info"
  HUB_LOG_FORMAT: "json"
  HUB_MQTT_BROKER_URL: "tcp://meshsat-nats:1883"
  HUB_NATS_URL: "tcp://meshsat-nats:1883"
  HUB_RATELIMIT_DAILY_CAP: "100"
  HUB_RATELIMIT_MONTHLY_CAP: "0"
  HUB_RATELIMIT_BURST: "10"
  HUB_RATELIMIT_REFILL_PER_MIN: "1"
  HUB_TENANT_ENFORCE: "false"
