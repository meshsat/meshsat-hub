apiVersion: v1
kind: Secret
metadata:
  name: meshsat-hub-secrets
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-hub
type: Opaque
stringData:
  HUB_DATABASE_URL: "postgres://meshsat:CHANGE_ME@meshsat-postgres:5432/meshsat_hub?sslmode=disable"
  HUB_REDIS_URL: "redis://:CHANGE_ME@meshsat-redis:6379/0"
  HUB_AUTH_TOKEN: "CHANGE_ME"
  HUB_ROCKBLOCK_SECRET: ""
  HUB_CLOUDLOOP_API_KEY: ""
