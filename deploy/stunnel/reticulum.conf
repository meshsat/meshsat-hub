; stunnel configuration for Reticulum HDLC TCP passthrough.
;
; Deployed on DMZ hosts (nllei01dmz01, grskg01dmz01) as a systemd service:
;   systemctl restart stunnel-reticulum
;
; Architecture:
;   Bridge/RNS node → TLS → HAProxy SNI (reticulum.meshsat.net)
;     → stunnel :4243 (TLS termination + client cert verification)
;       → Hub NATS/Reticulum :4242 (raw HDLC)
;
; Client certificate verification ensures only bridges with a valid
; certificate signed by the Hub bridge CA can connect. Same CA used
; by NATS mTLS for MQTT WebSocket connections.
;
; External RNS nodes that want to connect need a client certificate
; issued via: POST /api/bridges/{id}/certificate on the Hub API.

[reticulum]
accept = 0.0.0.0:4243
connect = 127.0.0.1:4242

; Server certificate (wildcard *.meshsat.net from Let's Encrypt)
cert = /srv/certs/meshsat.net.crt
key = /srv/certs/meshsat.net.key

; Client certificate verification — require bridge CA-signed cert.
; Same CA as NATS mTLS (exported by Hub to nats-certs volume).
CAfile = /srv/meshsat-hub/nats-certs/bridge-ca.crt
verify = 2
verifyChain = yes

; TLS settings
sslVersion = TLSv1.2
options = NO_SSLv2
options = NO_SSLv3

; Logging
debug = 4
