# Galera MariaDB + Arbitrator service definition.
# All wsrep settings are passed via command-line args to avoid file
# permission issues (mariadb:11-jammy drops to UID 999 "mysql" which
# cannot read root-owned .cnf files mounted as :ro volumes).
#
# Per-node config via .env:
#   WSREP_NODE_ADDRESS    — node IP (e.g. 192.168.192.10)
#   SITE_NAME             — node name (e.g. meshsat-hub-nl)
#   WSREP_CLUSTER_ADDRESS — ALWAYS the full address: gcomm://192.168.192.10,192.168.15.10
#                           NEVER set to bare gcomm:// — the entrypoint will refuse to start.
#
# Bootstrap (safe — no .env mutation):
#   1. Stop MariaDB on ALL nodes
#   2. On the authoritative node (highest wsrep_last_committed):
#        docker run --rm -v meshsat-hub_mariadb-data:/var/lib/mysql alpine:3.21 \
#          touch /var/lib/mysql/force-bootstrap
#   3. docker compose up -d mariadb  (entrypoint detects flag, adds --wsrep-new-cluster)
#   4. Wait for wsrep_cluster_size=1, wsrep_ready=ON
#   5. Start MariaDB on other nodes (they join via IST/SST)
#   6. Start garbd: docker compose up -d garbd
#   7. Verify wsrep_cluster_size=3 on all data nodes
#
# The flag file is consumed (deleted) on first use. Next restart joins normally.
# WSREP_CLUSTER_ADDRESS is NEVER modified.

services:
  mariadb:
    image: mariadb:11-jammy
    container_name: meshsat-mariadb
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/galera-entrypoint.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: meshsat_hub
      MARIADB_USER: meshsat
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_MYSQL_LOCALHOST_USER: 1
      MARIADB_INITDB_SKIP_TZINFO: 1
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./galera-entrypoint.sh:/galera-entrypoint.sh:ro
    command:
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=meshsat-galera
      - --wsrep-cluster-address=${WSREP_CLUSTER_ADDRESS}
      - --wsrep-node-address=${WSREP_NODE_ADDRESS}
      - --wsrep-node-name=${SITE_NAME}
      - --wsrep-sst-method=rsync
      - --wsrep-provider-options=pc.recovery=TRUE;pc.weight=1;pc.wait_prim=TRUE;pc.wait_prim_timeout=PT30S;evs.keepalive_period=PT1S;evs.suspect_timeout=PT10S;evs.inactive_timeout=PT15S
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --bind-address=0.0.0.0
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --max-connections=200
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--galera_ready"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  # -------------------------------------------------------------------------
  # Galera Arbitrator (garbd) — lightweight 3rd quorum voter.
  # No data, negligible CPU/RAM. Provides the critical 3rd vote so that
  # any single failure preserves quorum (2 of 3 voters survive).
  # Runs on NL node only (same host as MariaDB node 1).
  # -------------------------------------------------------------------------
  garbd:
    build:
      context: .
      dockerfile: Dockerfile.garbd
    image: meshsat-garbd:latest
    container_name: meshsat-garbd
    restart: unless-stopped
    network_mode: host
    command:
      - --group=meshsat-galera
      - --address=gcomm://192.168.192.10,192.168.15.10
      - --name=meshsat-garbd
      - --option=gmcast.listen_addr=tcp://0.0.0.0:4570;pc.weight=1
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
