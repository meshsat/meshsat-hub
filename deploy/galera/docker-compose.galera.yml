# MeshSat Hub — Unified Production Compose (Galera + Application)
#
# Contains ALL services:
#   - mariadb + garbd (Galera cluster, host network)
#   - hub + nginx + nats + redis (application stack, hubnet bridge)
#
# Deploy Hub only (safe, never touches MariaDB):
#   docker compose up -d --no-deps --force-recreate hub
#
# NEVER run: docker compose up -d (without --no-deps)
# NEVER run: docker compose pull (evaluates all services)
# See CLAUDE.md for Galera safety rules.
#
# NOTE: wsrep-cluster-address is HARDCODED (not a variable) because
# Docker Compose v5 bakes command args at container creation time and
# does not update them on recreate without --force-recreate. Using a
# variable caused 9+ split-brain incidents. The address is identical
# on all nodes so hardcoding is safe. Node-specific values
# (WSREP_NODE_ADDRESS, SITE_NAME) remain as variables since they
# never change on a given host.

services:
  # ===========================================================================
  # GALERA CLUSTER (host network — direct host-to-host replication)
  # ===========================================================================

  mariadb:
    image: mariadb:11-jammy
    container_name: meshsat-mariadb
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/galera-entrypoint.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: meshsat_hub
      MARIADB_USER: meshsat
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_MYSQL_LOCALHOST_USER: 1
      MARIADB_INITDB_SKIP_TZINFO: 1
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./galera-entrypoint.sh:/galera-entrypoint.sh:ro
    command:
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=meshsat-galera
      - --wsrep-cluster-address=gcomm://192.168.192.10,192.168.15.10,192.168.192.10:4570
      - --wsrep-node-address=${WSREP_NODE_ADDRESS}
      - --wsrep-node-name=${SITE_NAME}
      - --wsrep-sst-method=rsync
      - --wsrep-provider-options=pc.recovery=TRUE;pc.weight=1;pc.wait_prim=TRUE;pc.wait_prim_timeout=PT30S;evs.keepalive_period=PT1S;evs.suspect_timeout=PT10S;evs.inactive_timeout=PT15S
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --bind-address=0.0.0.0
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --max-connections=200
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--galera_ready"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  garbd:
    build:
      context: .
      dockerfile: Dockerfile.garbd
    image: meshsat-garbd:latest
    container_name: meshsat-garbd
    restart: unless-stopped
    network_mode: host
    command:
      - --group=meshsat-galera
      - --address=gcomm://192.168.192.10,192.168.15.10,192.168.192.10:4570
      - --name=meshsat-garbd
      - --option=gmcast.listen_addr=tcp://0.0.0.0:4570;pc.weight=1
    depends_on:
      mariadb:
        condition: service_healthy

  # ===========================================================================
  # APPLICATION STACK (hubnet bridge — isolated from Galera)
  # ===========================================================================

  nats:
    image: nats:2-alpine
    container_name: meshsat-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf", "--name", "${SITE_NAME:-meshsat-nats}"]
    ports:
      - "4222:4222"
      - "1883:1883"
      - "8222:8222"
      - "9443:9443"   # mTLS WebSocket (SNI passthrough from HAProxy)
    volumes:
      - ${NATS_CONFIG:-./nats.conf}:/etc/nats/nats.conf:ro
      - nats-data:/data
      - nats-certs:/etc/nats/certs:ro
    networks:
      - hubnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port 1883: internal MQTT (Hub ↔ NATS, plain TCP on hubnet)
    # Port 9443: mTLS WebSocket (bridges via SNI passthrough, requires nats-mtls.conf)

  redis:
    image: redis:7-alpine
    container_name: meshsat-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - redis-data:/data
    networks:
      - hubnet

  hub:
    image: ghcr.io/cubeos-app/meshsat-hub:latest
    container_name: meshsat-hub
    restart: unless-stopped
    env_file: .env
    ports:
      - "4242:4242"   # Reticulum TCP (HDLC, stunnel terminates TLS upstream)
    environment:
      HUB_MODE: cluster
      HUB_PORT: "6070"
      HUB_MQTT_BROKER_URL: tcp://nats:1883
      HUB_NATS_URL: tcp://nats:1883
      HUB_REDIS_URL: redis://redis:6379/0
      HUB_RETICULUM_TCP_PORT: "4242"
      HUB_LOG_LEVEL: info
      HUB_LOG_FORMAT: json
      HUB_BRIDGE_CA_CERT_EXPORT_PATH: /nats-certs/bridge-ca.crt
    volumes:
      - ${HUB_CERTS_PATH:-./certs}:/certs:ro
      - nats-certs:/nats-certs
    networks:
      - hubnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6070/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: meshsat-hub-nginx
    restart: unless-stopped
    ports:
      - "8451:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-/srv/certs/server.crt}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_PATH:-/srv/certs/server.key}:/etc/nginx/certs/tls.key:ro
    networks:
      - hubnet

volumes:
  mariadb-data:
  nats-data:
  nats-certs:    # Shared: Hub exports bridge CA cert, NATS reads it for mTLS verification
  redis-data:

networks:
  hubnet:
    driver: bridge
