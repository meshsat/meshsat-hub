---
# Core tasks for MeshSat Hub deployment.
# Included by all playbooks.

- name: Create compose directory
  file:
    path: "{{ compose_dir }}"
    state: directory
    mode: "0750"

- name: Deploy .env file
  template:
    src: env.j2
    dest: "{{ compose_dir }}/.env"
    mode: "0600"
  notify: restart hub

- name: Deploy docker-compose.yml
  copy:
    src: "{{ playbook_dir }}/../../../docker-compose.yml"
    dest: "{{ compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy nats.conf
  copy:
    src: "{{ playbook_dir }}/../../../nats.conf"
    dest: "{{ compose_dir }}/nats.conf"
    mode: "0644"

- name: Deploy nginx.conf (WebSocket /mqtt → NATS + Hub API proxy)
  copy:
    src: "{{ playbook_dir }}/../../../nginx.conf"
    dest: "{{ compose_dir }}/nginx.conf"
    mode: "0644"
  notify: reload nginx

- name: Open Galera firewall ports (inbound from VPN)
  ufw:
    rule: allow
    from_addr: "{{ hostvars[item].vpn_ip }}"
    port: "{{ galera_port }}"
    proto: tcp
    comment: "Galera cluster - {{ item }}"
  loop: "{{ groups['galera_nodes'] }}"
  loop_control:
    loop_var: item
  with_items: "{{ galera_ports }}"
  become: true
  when: galera_ports is defined

- name: Open Galera firewall ports (outbound to VPN peers)
  ufw:
    rule: allow
    direction: out
    to_addr: "{{ hostvars[item].vpn_ip }}"
    port: "{{ galera_port }}"
    proto: tcp
    comment: "Galera cluster out - {{ item }}"
  loop: "{{ groups['galera_nodes'] }}"
  loop_control:
    loop_var: item
  with_items: "{{ galera_ports }}"
  become: true
  when: galera_ports is defined

- name: Allow Docker bridge to MariaDB (restrict to hubnet subnet)
  ufw:
    rule: allow
    from_addr: "{{ docker_bridge_subnet | default('172.18.0.0/16') }}"
    port: "3306"
    proto: tcp
    comment: "Docker hubnet to MariaDB"
  become: true

# Tighten Galera UFW: remove any stale /24 rules and ensure only specific peer IPs.
- name: Remove overly broad Galera UFW rules (if present)
  ufw:
    rule: allow
    from_addr: "{{ item }}"
    port: "3306,4444,4567,4568"
    proto: tcp
    delete: true
  loop:
    - "192.168.192.0/24"
    - "192.168.15.0/24"
  become: true
  ignore_errors: true
