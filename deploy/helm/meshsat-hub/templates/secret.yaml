apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meshsat-hub.fullname" . }}-secrets
  labels:
    {{- include "meshsat-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  HUB_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  HUB_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  HUB_AUTH_TOKEN: {{ .Values.secrets.authToken | quote }}
  HUB_ROCKBLOCK_SECRET: {{ .Values.secrets.rockblockSecret | quote }}
  HUB_CLOUDLOOP_API_KEY: {{ .Values.secrets.cloudloopApiKey | quote }}
