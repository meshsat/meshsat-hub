# Default values for meshsat-hub Helm chart.

# -- Hub application settings
hub:
  # -- Number of Hub replicas
  replicaCount: 2
  image:
    repository: ghcr.io/meshsat/meshsat-hub
    tag: latest
    pullPolicy: IfNotPresent
  # -- Hub configuration (injected as env vars via ConfigMap)
  config:
    mode: kubernetes
    port: 6070
    logLevel: info
    logFormat: json
    ratelimitDailyCap: 100
    ratelimitMonthlyCap: 0
    ratelimitBurst: 10
    ratelimitRefillPerMin: 1
    tenantEnforce: false
  # -- Resource requests/limits
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: "1"

# -- Secrets (set via --set or external secret manager)
secrets:
  databaseUrl: "postgres://meshsat:CHANGE_ME@meshsat-hub-postgres:5432/meshsat_hub?sslmode=disable"
  redisUrl: "redis://meshsat-hub-redis:6379/0"
  authToken: ""
  rockblockSecret: ""
  cloudloopApiKey: ""

# -- PostgreSQL settings
postgres:
  # -- Deploy PostgreSQL StatefulSet (set false to use external DB)
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 10Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: "1"

# -- Redis settings
redis:
  # -- Deploy Redis (set false to use external Redis)
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  storage: 1Gi
  maxMemory: 128mb
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 192Mi
      cpu: 500m

# -- NATS settings
nats:
  # -- Deploy NATS StatefulSet (set false to use external NATS)
  enabled: true
  image:
    repository: nats
    tag: "2.10-alpine"
  # -- Number of NATS replicas (3 for HA)
  replicaCount: 3
  storage: 2Gi
  jetstream:
    maxMem: 256MB
    maxFile: 1GB
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m

# -- Ingress settings
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: hub.example.com
  tls: true
  tlsSecretName: meshsat-hub-tls

# -- Service account
serviceAccount:
  create: true
  name: meshsat-hub
