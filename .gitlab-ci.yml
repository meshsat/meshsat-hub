stages:
  - lint
  - security
  - test
  - build
  - package
  - deploy
  - verify
  - owasp
  - pages

variables:
  CGO_ENABLED: "0"
  MESHSAT_HUB_IMAGE: "ghcr.io/cubeos-app/meshsat-hub"
  AWX_HOST: "https://awx.nuclearlighters.net"

# -----------------------------------------------------------------------------
# LINT — golangci-lint
# -----------------------------------------------------------------------------
lint:
  stage: lint
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
  script:
    - golangci-lint run ./...

# -----------------------------------------------------------------------------
# SWAGGER — ensure swagger.json is up to date with code annotations
# -----------------------------------------------------------------------------
swagger:
  stage: lint
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - apk add --no-cache git
    - go mod download
    - go install github.com/swaggo/swag/cmd/swag@v1.16.4
  script:
    - swag init -g cmd/meshsat-hub/main.go -o docs/swagger --parseDependency --parseInternal
    - rm -f docs/swagger/docs.go
    - |
      # Compare only swagger.json (YAML has non-deterministic formatting across Go versions).
      if ! git diff --exit-code docs/swagger/swagger.json; then
        echo "BLOCKED: swagger.json is out of date — run 'make swagger' and commit the result"
        exit 1
      fi

# -----------------------------------------------------------------------------
# SECURITY — SAST (gosec) + vulnerability scan (govulncheck)
# This is internet-exposed software — security scanning is mandatory.
# Failures BLOCK the pipeline. No exceptions.
# -----------------------------------------------------------------------------
gosec:
  stage: security
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
  script:
    - gosec -fmt json -out gosec-report.json -severity high ./... || true
    - |
      # Fail on HIGH severity issues only; MEDIUM/LOW are tracked as tech debt
      HIGH_COUNT=$(gosec -fmt json -severity high ./... 2>/dev/null | grep -c '"severity": "HIGH"' || echo 0)
      echo "High severity issues: $HIGH_COUNT"
      if [ "$HIGH_COUNT" -gt 0 ]; then
        echo "BLOCKED: gosec found HIGH severity issues"
        gosec -fmt text -severity high ./...
        exit 1
      fi
  artifacts:
    paths:
      - gosec-report.json
    expire_in: 30 days
    when: always

govulncheck:
  stage: security
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck ./...

# -----------------------------------------------------------------------------
# TEST — unit tests
# -----------------------------------------------------------------------------
test:
  stage: test
  image: golang:1.25-alpine
  tags: [multiarch]
  script:
    - go test -v -count=1 ./...

# -----------------------------------------------------------------------------
# BUILD — compile Go binary
# -----------------------------------------------------------------------------
build:
  stage: build
  image: golang:1.25-alpine
  tags: [multiarch]
  script:
    - go build -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o bin/meshsat-hub ./cmd/meshsat-hub/
  artifacts:
    paths:
      - bin/meshsat-hub
    expire_in: 1 week

# -----------------------------------------------------------------------------
# PACKAGE — Docker build + push to GHCR
# -----------------------------------------------------------------------------
package:
  stage: package
  tags: [multiarch]
  image: docker:24
  needs:
    - job: build
      artifacts: false
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      docker build \
        -t ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_HUB_IMAGE}:latest \
        .
      docker push ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}
      docker push ${MESHSAT_HUB_IMAGE}:latest
      echo "Pushed ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# DEPLOY — Safe rolling update of Hub container only
# NEVER touches MariaDB, Redis, NATS, nginx, or garbd.
# Pulls the new Hub image, stops the old container, starts a new one.
# Deploy targets: nllei01dmz01 + grskg01dmz01 at /srv/meshsat-hub/
# Requires CI variable: AWX_HUB_TEMPLATE_ID (set in GitLab project settings)
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  tags: [multiarch]
  image: alpine:latest
  needs:
    - package
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "${AWX_HUB_TEMPLATE_ID:-}" ]; then
        echo "SKIP: AWX_HUB_TEMPLATE_ID not set — deploy disabled"
        exit 0
      fi

      # Safe deploy command: pull new image, stop+remove ONLY hub, recreate ONLY hub
      # docker compose up -d --no-deps --force-recreate hub
      # --no-deps: do NOT touch dependencies (mariadb, nats, redis)
      # --force-recreate: recreate even if config hasn't changed (new image)
      DEPLOY_CMD="cd /srv/meshsat-hub && docker pull ${MESHSAT_HUB_IMAGE}:latest && docker compose up -d --no-deps --force-recreate hub"

      echo "Deploying meshsat-hub (Hub container only, no DB restart)..."
      RESPONSE=$(curl -s -X POST \
        -H "Authorization: Bearer ${AWX_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"extra_vars\": {\"deploy_command\": \"${DEPLOY_CMD}\"}}" \
        "${AWX_HOST}/api/v2/job_templates/${AWX_HUB_TEMPLATE_ID}/launch/")

      JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
      if [ -z "$JOB_ID" ]; then
        echo "ERROR: Failed to launch AWX job"
        echo "$RESPONSE" | jq .
        exit 1
      fi
      echo "AWX job launched: ${JOB_ID}"

      # Poll for completion (max 5 minutes)
      for i in $(seq 1 30); do
        sleep 10
        STATUS=$(curl -s \
          -H "Authorization: Bearer ${AWX_TOKEN}" \
          "${AWX_HOST}/api/v2/jobs/${JOB_ID}/" | jq -r '.status')
        echo "  [$i/30] Status: $STATUS"
        case "$STATUS" in
          successful)
            echo "Deployment successful!"
            exit 0
            ;;
          failed|error|canceled)
            echo "Deployment $STATUS"
            exit 1
            ;;
        esac
      done

      echo "ERROR: Timed out waiting for AWX job"
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production

# -----------------------------------------------------------------------------
# VERIFY — Post-deploy E2E smoke tests (runs against live cluster)
# Requires CI variables: HUB_HOST_1, HUB_HOST_2, HUB_E2E_TOKEN
# -----------------------------------------------------------------------------
verify:
  stage: verify
  tags: [multiarch]
  image: alpine:latest
  needs:
    - deploy
  before_script:
    - apk add --no-cache curl bash grep
  script:
    - |
      if [ -z "${HUB_HOST_1:-}" ] || [ -z "${HUB_HOST_2:-}" ] || [ -z "${HUB_E2E_TOKEN:-}" ]; then
        echo "SKIP: E2E variables not set (HUB_HOST_1, HUB_HOST_2, HUB_E2E_TOKEN)"
        exit 0
      fi
      # Wait for deployment to stabilize
      sleep 15
      bash test/e2e/smoke_test.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# -----------------------------------------------------------------------------
# OWASP — OWASP compliance testing on live deployment (release milestones)
# Runs ZAP baseline scan + security header validation + auth/input checks.
# Requires CI variables: HUB_HOST_1, HUB_E2E_TOKEN
# Triggered on: tags (vX.Y.Z releases) and manual trigger
# -----------------------------------------------------------------------------
owasp:
  stage: owasp
  tags: [multiarch]
  image: alpine:latest
  needs:
    - verify
  before_script:
    - apk add --no-cache curl bash python3 docker-cli
  script:
    - |
      if [ -z "${HUB_HOST_1:-}" ] || [ -z "${HUB_E2E_TOKEN:-}" ]; then
        echo "SKIP: OWASP variables not set (HUB_HOST_1, HUB_E2E_TOKEN)"
        exit 0
      fi

      export HUB_TARGET_URL="${HUB_HOST_1}"
      export HUB_AUTH_TOKEN="${HUB_E2E_TOKEN}"
      export REPORT_DIR="owasp-reports"

      bash test/owasp/owasp-scan.sh
  artifacts:
    paths:
      - owasp-reports/
    expire_in: 90 days
    when: always
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# -----------------------------------------------------------------------------
# PAGES — Hugo documentation site
# -----------------------------------------------------------------------------
pages:
  stage: pages
  tags: [multiarch]
  image: alpine:latest
  before_script:
    - apk add --no-cache hugo git
  script:
    - cd docs/site
    - hugo --minify --baseURL "${CI_PAGES_URL}"
    - mv public ../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/site/**/*
