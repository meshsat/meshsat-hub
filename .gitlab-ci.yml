stages:
  - lint
  - security
  - test
  - build
  - package
  - pre-deploy
  - deploy
  - verify
  - owasp
  - pages
  - release

variables:
  CGO_ENABLED: "0"
  MESHSAT_HUB_IMAGE: "ghcr.io/cubeos-app/meshsat-hub"
  AWX_HOST: "https://awx.nuclearlighters.net"
  # Deploy targets — use IPs (runner Docker containers lack internal DNS).
  DEPLOY_HOST_NL: "192.168.192.10"
  DEPLOY_HOST_GR: "192.168.15.10"
  DEPLOY_USER: "kyriakosp"
  GALERA_CONTAINER: "meshsat-mariadb"

# -----------------------------------------------------------------------------
# LINT — golangci-lint
# -----------------------------------------------------------------------------
lint:
  stage: lint
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
  script:
    - golangci-lint run ./...

# -----------------------------------------------------------------------------
# SWAGGER — ensure swagger.json is up to date with code annotations
# -----------------------------------------------------------------------------
swagger:
  stage: lint
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - apk add --no-cache git
    - go mod download
    - go install github.com/swaggo/swag/cmd/swag@v1.16.4
  script:
    - swag init -g cmd/meshsat-hub/main.go -o docs/swagger --parseDependency --parseInternal
    - rm -f docs/swagger/docs.go
    - echo "swagger.json generated successfully ($(wc -l < docs/swagger/swagger.json) lines)"

# -----------------------------------------------------------------------------
# SECURITY — SAST (gosec) + vulnerability scan (govulncheck)
# This is internet-exposed software — security scanning is mandatory.
# Failures BLOCK the pipeline. No exceptions.
# -----------------------------------------------------------------------------
gosec:
  stage: security
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
  script:
    - gosec -fmt json -out gosec-report.json -severity high ./... || true
    - |
      # Fail on HIGH severity issues only; MEDIUM/LOW are tracked as tech debt
      HIGH_COUNT=$(gosec -fmt json -severity high ./... 2>/dev/null | grep -c '"severity": "HIGH"' || echo 0)
      echo "High severity issues: $HIGH_COUNT"
      if [ "$HIGH_COUNT" -gt 0 ]; then
        echo "BLOCKED: gosec found HIGH severity issues"
        gosec -fmt text -severity high ./...
        exit 1
      fi
  artifacts:
    paths:
      - gosec-report.json
    expire_in: 30 days
    when: always

govulncheck:
  stage: security
  image: golang:1.25-alpine
  tags: [multiarch]
  before_script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck ./...

# -----------------------------------------------------------------------------
# TEST — unit tests
# -----------------------------------------------------------------------------
test:
  stage: test
  image: golang:1.25-alpine
  tags: [multiarch]
  script:
    - go test -v -count=1 ./...

# -----------------------------------------------------------------------------
# BUILD — compile Go binary
# -----------------------------------------------------------------------------
build:
  stage: build
  image: golang:1.25-alpine
  tags: [multiarch]
  script:
    - go build -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o bin/meshsat-hub ./cmd/meshsat-hub/
  artifacts:
    paths:
      - bin/meshsat-hub
    expire_in: 1 week

# -----------------------------------------------------------------------------
# PACKAGE — Docker build + push to GHCR
# -----------------------------------------------------------------------------
package:
  stage: package
  tags: [multiarch]
  image: docker:28
  needs:
    - job: build
      artifacts: false
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      docker build \
        -t ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_HUB_IMAGE}:latest \
        .
      docker push ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}
      docker push ${MESHSAT_HUB_IMAGE}:latest
      echo "Pushed ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# PRE-DEPLOY — Galera cluster health gate
# Checks wsrep_cluster_size, wsrep_ready, wsrep_local_state_comment on both
# nodes. If the cluster is unhealthy, deploy is BLOCKED.
# This exists because 5 Galera split-brain incidents in 2 days (2026-03-19/20)
# were caused by deploying while the cluster was in a bad state.
# -----------------------------------------------------------------------------
pre-deploy:
  stage: pre-deploy
  tags: [multiarch]
  image: alpine:latest
  needs:
    - package
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - echo "StrictHostKeyChecking no" > ~/.ssh/config
  script:
    - |
      SSH_KEY=~/.ssh/deploy_key
      HOSTS="$DEPLOY_HOST_NL $DEPLOY_HOST_GR"
      HEALTHY=true

      echo "=== Pre-Deploy Galera Health Gate ==="

      for HOST in $HOSTS; do
        echo ""
        echo "--- $HOST ---"

        # Verify .env does NOT have bare gcomm:// (the #1 cause of split-brain)
        ADDR=$(ssh -i $SSH_KEY -o ConnectTimeout=10 "${DEPLOY_USER}@${HOST}" \
          "grep WSREP_CLUSTER_ADDRESS /srv/meshsat-hub/.env" 2>/dev/null) || {
          echo "  FAIL: Cannot read .env on $HOST"
          HEALTHY=false
          continue
        }
        echo "  $ADDR"
        if echo "$ADDR" | grep -qE 'gcomm://$' || echo "$ADDR" | grep -qE 'gcomm://[[:space:]]*$'; then
          echo "  FAIL: BARE gcomm:// in .env — split-brain risk!"
          HEALTHY=false
          continue
        fi

        # Check running container for stale bare gcomm:// (incident 7/8 root cause)
        CONTAINER_CMD=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" \
          "docker inspect ${GALERA_CONTAINER} --format '{{range .Config.Cmd}}{{.}} {{end}}'" 2>/dev/null) || true
        if echo "$CONTAINER_CMD" | grep -qE 'wsrep-cluster-address=gcomm://$|wsrep-cluster-address=gcomm:// '; then
          echo "  FAIL: Running container has BARE gcomm:// (stale bootstrap!)"
          HEALTHY=false
          continue
        fi

        # Get root password from container env
        DB_PASS=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" \
          "docker inspect ${GALERA_CONTAINER} --format '{{range .Config.Env}}{{println .}}{{end}}'" 2>/dev/null \
          | grep MARIADB_ROOT_PASSWORD | cut -d= -f2)

        # Query Galera status
        STATUS=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" \
          "docker exec ${GALERA_CONTAINER} mariadb -u root -p'${DB_PASS}' -N -e \
          \"SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS \
          WHERE VARIABLE_NAME IN ('wsrep_cluster_size','wsrep_ready','wsrep_local_state_comment') \
          ORDER BY VARIABLE_NAME\"" 2>/dev/null) || {
          echo "  FAIL: Cannot query MariaDB on $HOST"
          HEALTHY=false
          continue
        }

        CLUSTER_SIZE=$(echo "$STATUS" | sed -n '1p')
        STATE=$(echo "$STATUS" | sed -n '2p')
        READY=$(echo "$STATUS" | sed -n '3p')

        echo "  cluster_size=$CLUSTER_SIZE  ready=$READY  state=$STATE"

        if [ "$READY" != "ON" ]; then
          echo "  FAIL: wsrep_ready is OFF"
          HEALTHY=false
        fi
        if [ "$CLUSTER_SIZE" -lt 3 ] 2>/dev/null; then
          echo "  FAIL: cluster_size=$CLUSTER_SIZE < 3 (garbd missing or split-brain!)"
          HEALTHY=false
        fi
      done

      # Verify garbd container is running on NL node
      echo ""
      echo "--- garbd ($DEPLOY_HOST_NL) ---"
      GARBD_STATUS=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${DEPLOY_HOST_NL}" \
        "docker inspect --format='{{.State.Status}}' meshsat-garbd 2>/dev/null" 2>/dev/null) || GARBD_STATUS="not found"
      echo "  garbd container: $GARBD_STATUS"
      if [ "$GARBD_STATUS" != "running" ]; then
        echo "  FAIL: garbd is not running — cluster has no quorum voter!"
        HEALTHY=false
      fi

      echo ""
      if [ "$HEALTHY" = "true" ]; then
        echo "=== PASS: Galera healthy (3 voters), deploy may proceed ==="
      else
        echo "=== BLOCKED: Galera cluster is NOT healthy ==="
        echo "Fix the cluster before deploying. See CLAUDE.md Galera rules."
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# DEPLOY — Safe rolling update of Hub container only
# NEVER touches MariaDB, Redis, NATS, nginx, or garbd.
# Pulls the new Hub image, stops the old container, starts a new one.
# Deploy targets: nllei01dmz01 + grskg01dmz01 at /srv/meshsat-hub/
# Direct SSH deploy — no docker compose up/pull without --no-deps.
#
# SAFETY: pre-deploy stage verifies Galera health BEFORE this runs.
# If pre-deploy fails, this stage is skipped entirely.
# Requires CI variable: DEPLOY_SSH_KEY (base64-encoded private key)
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  tags: [multiarch]
  image: alpine:latest
  needs:
    - package
    - pre-deploy
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - echo "StrictHostKeyChecking no" > ~/.ssh/config
  script:
    - |
      SSH_KEY=~/.ssh/deploy_key
      HOSTS="$DEPLOY_HOST_NL $DEPLOY_HOST_GR"
      IMAGE="${MESHSAT_HUB_IMAGE}:latest"
      FAILED=0

      for HOST in $HOSTS; do
        echo ""
        echo "=== Deploying to $HOST ==="

        ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" "
          cd /srv/meshsat-hub

          echo '1. Pull Hub image only (never pull MariaDB)...'
          docker pull $IMAGE

          echo '2. Restart ONLY Hub container (--no-deps, MariaDB untouched)...'
          docker compose up -d --no-deps --force-recreate hub

          echo '3. Wait for healthcheck...'
          for i in \$(seq 1 60); do
            STATUS=\$(docker inspect --format='{{.State.Health.Status}}' meshsat-hub 2>/dev/null || echo unknown)
            [ \"\$STATUS\" = 'healthy' ] && { echo \"Hub healthy after \${i}s\"; break; }
            [ \"\$i\" = '60' ] && { echo 'TIMEOUT: Hub not healthy after 60s'; exit 1; }
            sleep 1
          done

          echo '4. Verify /healthz...'
          docker exec meshsat-hub wget -q -O- http://localhost:6070/healthz || { echo 'healthz FAILED'; exit 1; }
          echo ' healthz OK'

          echo '5. Verify /readyz...'
          docker exec meshsat-hub wget -q -O- http://localhost:6070/readyz || echo 'readyz FAILED (non-fatal)'
          echo ' readyz OK'
        " || { echo "FAILED on $HOST"; FAILED=1; }
      done

      [ "$FAILED" = "1" ] && exit 1
      echo "=== Deploy complete on all hosts ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production

# -----------------------------------------------------------------------------
# VERIFY — Post-deploy checks: Galera still healthy + E2E smoke tests
# Confirms the deploy did NOT break the Galera cluster, then runs smoke tests.
# -----------------------------------------------------------------------------
verify:
  stage: verify
  tags: [multiarch]
  image: alpine:latest
  needs:
    - deploy
  before_script:
    - apk add --no-cache openssh-client curl bash grep
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - echo "StrictHostKeyChecking no" > ~/.ssh/config
  script:
    - |
      SSH_KEY=~/.ssh/deploy_key
      HOSTS="$DEPLOY_HOST_NL $DEPLOY_HOST_GR"

      echo "=== Post-Deploy Galera Health Verification ==="
      sleep 10

      GALERA_OK=true
      for HOST in $HOSTS; do
        echo ""
        echo "--- $HOST ---"

        # Verify Hub is responding
        HUB_STATUS=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" \
          "docker exec meshsat-hub wget -q -O- http://localhost:6070/healthz 2>/dev/null" || echo "UNREACHABLE")
        echo "  Hub /healthz: $HUB_STATUS"

        # Verify Galera is still healthy after deploy
        DB_PASS=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" \
          "docker inspect ${GALERA_CONTAINER} --format '{{range .Config.Env}}{{println .}}{{end}}'" 2>/dev/null \
          | grep MARIADB_ROOT_PASSWORD | cut -d= -f2)

        CLUSTER_SIZE=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${HOST}" \
          "docker exec ${GALERA_CONTAINER} mariadb -u root -p'${DB_PASS}' -N -e \
          \"SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS \
          WHERE VARIABLE_NAME='wsrep_cluster_size'\"" 2>/dev/null) || CLUSTER_SIZE="ERROR"

        echo "  Galera cluster_size: $CLUSTER_SIZE"

        if [ "$CLUSTER_SIZE" = "ERROR" ] || [ "$CLUSTER_SIZE" -lt 3 ] 2>/dev/null; then
          echo "  FAIL: Galera cluster degraded after deploy (cluster_size=$CLUSTER_SIZE, expected 3)!"
          GALERA_OK=false
        fi
      done

      # Verify garbd still running post-deploy
      GARBD_STATUS=$(ssh -i $SSH_KEY "${DEPLOY_USER}@${DEPLOY_HOST_NL}" \
        "docker inspect --format='{{.State.Status}}' meshsat-garbd 2>/dev/null" 2>/dev/null) || GARBD_STATUS="not found"
      echo ""
      echo "  garbd post-deploy: $GARBD_STATUS"
      if [ "$GARBD_STATUS" != "running" ]; then
        echo "  WARN: garbd stopped during deploy — restart it!"
        GALERA_OK=false
      fi

      echo ""
      if [ "$GALERA_OK" = "true" ]; then
        echo "=== PASS: Galera cluster healthy after deploy (3 voters) ==="
      else
        echo "=== WARN: Galera cluster may be degraded — investigate immediately ==="
      fi

      # Run E2E smoke tests if configured
      if [ -n "${HUB_HOST_1:-}" ] && [ -n "${HUB_HOST_2:-}" ] && [ -n "${HUB_E2E_TOKEN:-}" ]; then
        echo ""
        echo "=== Running E2E smoke tests ==="
        bash test/e2e/smoke_test.sh
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# OWASP — OWASP compliance testing on live deployment (release milestones)
# Runs ZAP baseline scan + security header validation + auth/input checks.
# Requires CI variables: HUB_HOST_1, HUB_E2E_TOKEN
# Triggered on: tags (vX.Y.Z releases) and manual trigger
# -----------------------------------------------------------------------------
owasp:
  stage: owasp
  tags: [multiarch]
  image: alpine:latest
  needs:
    - verify
  before_script:
    - apk add --no-cache curl bash docker-cli
  script:
    - |
      if [ -z "${HUB_HOST_1:-}" ] || [ -z "${HUB_E2E_TOKEN:-}" ]; then
        echo "SKIP: OWASP variables not set (HUB_HOST_1, HUB_E2E_TOKEN)"
        exit 0
      fi

      export HUB_TARGET_URL="${HUB_HOST_1}"
      export HUB_AUTH_TOKEN="${HUB_E2E_TOKEN}"
      export REPORT_DIR="owasp-reports"

      bash test/owasp/owasp-scan.sh
  artifacts:
    paths:
      - owasp-reports/
    expire_in: 90 days
    when: always
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# -----------------------------------------------------------------------------
# PAGES — Hugo documentation site
# -----------------------------------------------------------------------------
pages:
  stage: pages
  tags: [multiarch]
  image: alpine:latest
  before_script:
    - apk add --no-cache hugo git
  script:
    - cd docs/site
    - hugo --minify --baseURL "${CI_PAGES_URL}"
    - mv public ../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/site/**/*

# -----------------------------------------------------------------------------
# CHANGELOG — Generate changelog from conventional commits on tag push
# -----------------------------------------------------------------------------
changelog:
  stage: release
  tags: [multiarch]
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash
  script:
    - bash scripts/changelog.sh > CHANGELOG.md
    - cat CHANGELOG.md
  artifacts:
    paths:
      - CHANGELOG.md
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG
