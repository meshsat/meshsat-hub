stages:
  - lint
  - security
  - test
  - build
  - package
  - deploy      # bump_k8s_pin: rewrites the image digest in k8s/kustomization.yaml (Argo CD deploys)
  - pages
  - release

variables:
  CGO_ENABLED: "0"
  MESHSAT_HUB_IMAGE: "ghcr.io/meshsat/meshsat-hub"
  AWX_HOST: "https://awx.nuclearlighters.net"
  # Deploy targets — use IPs (runner Docker containers lack internal DNS).
  DEPLOY_HOST_NL: "192.168.192.10"
  DEPLOY_HOST_GR: "192.168.15.10"
  DEPLOY_USER: "kyriakosp"
  GALERA_CONTAINER: "meshsat-mariadb"

# -----------------------------------------------------------------------------
# LINT — golangci-lint
# -----------------------------------------------------------------------------
lint:
  stage: lint
  image: golang:1.25-alpine
  tags: [docker]
  before_script:
    # Pinned: @latest (v2.13.1+) requires Go >= 1.26, image is golang:1.25 (MESHSAT-712)
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
  script:
    # go.sum is the module allow-list; a module that no longer matches it is a
    # substituted dependency, not a build to trust.
    - go mod verify
    - golangci-lint run ./...

# -----------------------------------------------------------------------------
# GITLEAKS — no credential reaches main.
#
# The working tree and the commits of this push are scanned; a hit fails the
# pipeline. `.gitleaks.toml` allow-lists the test-fixture paths BY PATH, each
# with its reason -- there is no per-rule or per-string escape hatch, so a real
# secret pasted into a non-test file has nowhere to hide. The one committed
# credential this found on introduction (the E2E probe's password in the
# nightly suite) was made per-run instead of allow-listed.
# -----------------------------------------------------------------------------
gitleaks:
  stage: lint
  tags: [docker]
  image:
    name: zricethezav/gitleaks:v8.24.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: "50"
  script:
    - gitleaks dir . --no-banner --redact --exit-code 1
    - gitleaks git . --no-banner --redact --exit-code 1 --log-opts="-n 25"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# -----------------------------------------------------------------------------
# IAC — the manifests are scanned like the image is.
#
# trivy config over k8s/ and the shipped Dockerfiles, HIGH and CRITICAL fail
# the job. `.trivyignore.yaml` carries the accepted findings scoped to the files
# they were measured on, each with the reason: architectural ones (the
# hostNetwork relay), measured ones (wg-easy's capabilities) and the
# deploy-then-harden backlog (read-only root on third-party images), listed per
# file so a NEW container without the flag still fails here.
# -----------------------------------------------------------------------------
iac:trivy-config:
  stage: lint
  tags: [docker]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 k8s
    # The Dockerfiles that ship, staged alone so nothing else in the tree is
    # parsed as a config file by accident.
    - mkdir -p .iac-dockerfiles && cp Dockerfile Dockerfile.sim .iac-dockerfiles/
    - trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 .iac-dockerfiles
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - k8s/**/*
        - Dockerfile
        - Dockerfile.sim
        - .trivyignore.yaml
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# SHELL — no early-exiting pipe reader inside a script that sets pipefail.
#
# `cmd | head` returns 141 once the producer outgrows a pipe buffer, and pipefail
# turns that into a failed job. It took out every deploy on 2026-09-11 because
# bump_k8s_pin -- the job that deploys -- ended in `git log -100 ... | head -1`.
# It passes in review and on small inputs, which is exactly why it needs a gate.
# -----------------------------------------------------------------------------
shell:pipefail:
  stage: lint
  image: alpine:3.21
  tags: [docker]
  before_script:
    - apk add --no-cache bash grep
  script:
    - bash scripts/check-pipefail-sigpipe.sh .

# -----------------------------------------------------------------------------
# ENV KEYS — a manifest key the binary never reads (MESHSAT-1121).
#
# k8s/hub/externalsecret.yaml supplied HUB_CLOUDLOOP_MQTT_CA from the day it was
# written; config.go only ever read HUB_CLOUDLOOP_MQTT_CA_CERT. A misnamed key is
# indistinguishable from an unset one, so the Cloudloop MQTT subscriber ran with
# an empty CA and silently fell back to the system root pool for two months.
# Nothing compared the keys a manifest supplies against the keys the code reads.
# -----------------------------------------------------------------------------
config:env-keys:
  stage: lint
  image: alpine:3.21
  tags: [docker]
  before_script:
    - apk add --no-cache bash grep findutils
  script:
    - bash scripts/check-env-keys.sh .

# -----------------------------------------------------------------------------
# BUMP-PIN — the deploy path's one moving part, now with a test (MESHSAT-1047).
#
# bump-pin.py rewrites the image digest Argo CD deploys. It had no test, which is
# how it came to rewrite the digest while freezing the comment beside it: the file
# claimed a commit four days older than what was actually running.
#
# The fix gave it a branch that REWRITES a comment, and kustomization.yaml carries
# seven hand-written comments beside other images -- which version, what the image
# is for, and why the nats version is pinned at all. A regression there would
# destroy information while every deploy still looked fine, so it is asserted.
# -----------------------------------------------------------------------------
bump-pin:test:
  stage: lint
  image: python:3-alpine
  tags: [docker]
  needs: []
  script:
    - python3 k8s/scripts/bump_pin_test.py
  rules:
    # Not in merge request pipelines, for the same reason as kubeconform above.
    # This job was added after that rule was written; it uses `changes:` with no
    # exclusion, so on its own it would keep creating a merge request pipeline
    # that goes green in seconds while the branch pipeline is still building.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - changes:
        - k8s/scripts/bump-pin.py
        - k8s/scripts/bump_pin_test.py
        - k8s/kustomization.yaml

# -----------------------------------------------------------------------------
# SWAGGER — ensure swagger.json is up to date with code annotations
# -----------------------------------------------------------------------------
swagger:
  stage: lint
  image: golang:1.25-alpine
  tags: [docker]
  before_script:
    - apk add --no-cache git
    - go mod download
    - go install github.com/swaggo/swag/cmd/swag@v1.16.4
  script:
    - swag init -g cmd/meshsat-hub/main.go -o docs/swagger --parseDependency --parseInternal
    - rm -f docs/swagger/docs.go
    - echo "swagger.json generated successfully ($(wc -l < docs/swagger/swagger.json) lines)"

# -----------------------------------------------------------------------------
# OWASP ZAP baseline scan of the public Hub URLs (MESHSAT-979, successor of the
# compose-era owasp job): weekly schedule (OWASP_RUN=1) or manual on main.
#
# This job could not fail, and did not use its own ruleset (MESHSAT-1197). Four
# things had to be true at once for it to report anything, and none was:
#
#   allow_failure: true    -- a failure was cosmetic
#   || true                -- and the exit code was discarded before that
#   GIT_STRATEGY: none     -- so test/owasp/zap-baseline.conf was not even
#                             CHECKED OUT, and its FAIL rules (missing CSP,
#                             X-Powered-By, missing Permissions-Policy) governed
#                             nothing. docs/SECURITY_AUDIT.md claimed they did.
#   tags: [multiarch]      -- the permanently-loaded GPU-host runner, which the
#                             estate's own rule says never to route jobs to
#
# `-I` is NOT one of the defects and is kept deliberately: with a config file
# that declares FAIL rules, -I means "a WARN does not fail the job, a declared
# FAIL does", which is exactly the wanted behaviour. Removing it would fail the
# job on every informational finding instead.
#
# allow_failure is set PER RULE, which matters more than it looks. `build` has
# no `needs:`, so it waits for the whole security stage -- and a `when: manual`
# job with allow_failure: false is a BLOCKING manual job in GitLab. Making this
# non-optional on the main branch would leave every pipeline parked at the
# security stage waiting for somebody to click it, halting all deploys. So the
# weekly scheduled run is blocking (a red weekly scan is a real signal, and
# `package` refuses scheduled pipelines anyway, so it cannot block a release),
# while the manual-on-main variant stays optional.
#
# Still passive and still unauthenticated: the Hub 401s every /api/* route
# before routing, so this covers the SPA, the headers and the unauthenticated
# surface only. test/owasp/owasp-scan.sh is the authenticated five-phase
# scanner and is still manual-only -- wiring it up is tracked separately.
# -----------------------------------------------------------------------------
owasp:baseline:
  stage: security
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  tags: [docker]
  needs: []
  variables:
    ZAP_TARGETS: "https://hub.meshsat.net https://auth.meshsat.net"
  script:
    - mkdir -p /zap/wrk "$CI_PROJECT_DIR/zap"
    # The ruleset has to be INSIDE /zap/wrk: zap-baseline.py resolves -c
    # relative to its own working directory inside the container.
    - cp test/owasp/zap-baseline.conf /zap/wrk/zap-baseline.conf
    - cd /zap/wrk
    - |
      rc=0
      for t in $ZAP_TARGETS; do
        n=$(echo "$t" | sed 's|https://||')
        echo "== ZAP baseline: $t"
        # No `|| true`: the exit code is the result. 1 = a rule marked FAIL in
        # zap-baseline.conf matched. Every target is scanned even if an earlier
        # one fails, so one bad host does not hide the others.
        #
        # Authenticated against the Hub (MESHSAT-1197): an unauthenticated
        # baseline sees a 401 on every /api route and scans nothing. ZAP_API_KEY
        # is a VIEWER key on an empty probe tenant (t-zap-probe; OpenBao
        # secret/ci-no/apps/meshsat-hub/zap), so the spider can only read, and
        # only nothing. The replacer rule adds the header to every request.
        ZOPT=""
        if [ "$n" = "hub.meshsat.net" ] && [ -n "$ZAP_API_KEY" ]; then
          ZOPT="-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer\ $ZAP_API_KEY"
          echo "   (authenticated as the read-only probe tenant)"
        fi
        if [ -n "$ZOPT" ]; then
          zap-baseline.py -t "$t" -c zap-baseline.conf -r "zap-$n.html" -J "zap-$n.json" -I -m 5 -z "$ZOPT" || rc=$?
        else
          zap-baseline.py -t "$t" -c zap-baseline.conf -r "zap-$n.html" -J "zap-$n.json" -I -m 5 || rc=$?
        fi
      done
      cp /zap/wrk/zap-* "$CI_PROJECT_DIR/zap/" 2>/dev/null || true
      ls -la "$CI_PROJECT_DIR/zap/"
      if [ "$rc" -ne 0 ]; then
        echo "ZAP reported at least one FAIL-level finding; see the artifacts in zap/"
      fi
      exit "$rc"
  artifacts:
    paths: [zap/]
    expire_in: 90 days
    when: always
  rules:
    - if: $OWASP_RUN == "1"
      allow_failure: false
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# -----------------------------------------------------------------------------
# KUBECONFORM — the k8s/ kustomize tree must render and validate (MESHSAT-930).
# Schemas: upstream for core kinds, the datreeio CRD catalog for CNPG, ESO,
# monitoring and Argo kinds. Runs only when the tree exists and changed.
# -----------------------------------------------------------------------------
kubeconform:
  stage: lint
  image: alpine:3.21
  tags: [docker]
  variables:
    KUSTOMIZE_VERSION: "v5.6.0"
    KUBECONFORM_VERSION: "v0.7.0"
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
    - curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
  script:
    - kustomize build k8s/ > /tmp/rendered.yaml
    - |
      kubeconform -strict -summary -ignore-missing-schemas \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        /tmp/rendered.yaml
    - grep -c '^kind:' /tmp/rendered.yaml | xargs echo "rendered objects:"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Not in merge request pipelines. Every other job here uses the legacy
    # default (branches and tags), so a merge request pipeline would contain
    # THIS JOB ALONE -- and the merge request page then reports "pipeline
    # passed" once the manifests render, while lint, test, test:postgres, gosec
    # and govulncheck are still running on the branch pipeline or have failed
    # there. The project does not gate merges on a pipeline, so nothing was
    # blocked incorrectly; what was wrong was the signal a person reads before
    # clicking merge. With no job matching, no merge request pipeline is created
    # and the merge request shows the branch pipeline, which is the real one.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - exists:
        - k8s/kustomization.yaml
      changes:
        - k8s/**/*
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# SECURITY — SAST (gosec) + vulnerability scan (govulncheck)
# This is internet-exposed software — security scanning is mandatory.
# Failures BLOCK the pipeline. No exceptions.
# -----------------------------------------------------------------------------
gosec:
  stage: security
  image: golang:1.25-alpine
  tags: [docker]
  before_script:
    # Pinned: rule sets change between releases and the gate must be reproducible (MESHSAT-966).
    - go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
  script:
    - gosec -fmt json -out gosec-report.json -severity high ./... || true
    - |
      # Fail on HIGH severity issues only; MEDIUM/LOW are tracked as tech debt.
      # Count from the report file: piping gosec (non-zero exit on findings)
      # through grep under pipefail produced "79\n0" and `[ -gt ]` silently
      # failed with "bad number" for months (MESHSAT-966).
      HIGH_COUNT=$(grep -c '"severity": "HIGH"' gosec-report.json || true)
      echo "High severity issues: ${HIGH_COUNT:-0}"
      if [ "${HIGH_COUNT:-0}" -gt 0 ]; then
        echo "BLOCKED: gosec found HIGH severity issues"
        gosec -fmt text -severity high ./... || true
        exit 1
      fi
  artifacts:
    paths:
      - gosec-report.json
    expire_in: 30 days
    when: always

govulncheck:
  stage: security
  image: golang:1.25-alpine
  tags: [docker]
  before_script:
    # Pinned, not @latest: v1.8.0 requires Go 1.26 and this job runs on the
    # Go 1.25 image, so @latest broke every merge the day it was published.
    # The same thing happened to golangci-lint (MESHSAT-712). Bump this and
    # the image together, deliberately.
    - go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
  script:
    - govulncheck ./...

# -----------------------------------------------------------------------------
# OTS — the image patches must WORK, not merely apply
# -----------------------------------------------------------------------------
# The Dockerfile already asserts the patches APPLIED: the marker is in the module
# Python loads. That is not the same as asserting they work, and the difference
# is not academic -- MESHSAT-1089's first fix passed that assertion while every
# tenant still wrote nine tracebacks per ninety seconds, because it cured one
# caller of close_connection and the other was never read. It was caught by
# measuring production afterwards, which is a poor last line of defence.
#
# These tests execute the patched code. They need no network, no image and no
# OpenTAKServer: each fixture is built from the patch script's own anchor, because
# upstream is GPL-3.0-or-later and this repository is Apache-2.0, so its source
# must not be vendored here.
#
# The two halves are deliberately separate: this job proves the patched result
# behaves, and the image build proves the anchors still match real upstream.
ots:patch-tests:
  stage: lint
  image: python:3.13-slim
  tags: [docker]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        - k8s/ots/**/*
  script:
    - python3 -m unittest discover -s k8s/ots -p 'test_*.py' -v

# -----------------------------------------------------------------------------
# WEB — the committed dist must match the committed source
# -----------------------------------------------------------------------------
# CI DOES NOT BUILD THE FRONTEND, and the Go binary embeds cmd/meshsat-hub/web/dist
# verbatim (`//go:embed dist/*`). So the SPA that ships is whatever was last
# committed, and a change to web/src with no rebuild ships the old interface with
# a green pipeline and nothing to look at. That has already bitten: P8 deleted a
# view and `/tak` still routed to it until dist was rebuilt by hand.
#
# This does not build dist FOR you -- it is committed on purpose, so the image
# build needs no Node and the artefact is reviewable. It asserts the committed
# output is the output the committed source produces.
#
# Byte-for-byte comparison is sound because the build is deterministic: rebuilding
# unchanged source reproduces the tree hash exactly (verified before writing this).
# If that ever stops being true this job reds immediately, which is the correct
# response -- a non-reproducible frontend build is its own problem.
#
# Node 20 is pinned because that is what produced the committed dist. A different
# major may emit different output and turn this into a false red.
web:dist-current:
  stage: lint
  image: node:20-alpine
  tags: [docker]
  rules:
    # Always on main. Without this a dist that went stale in an earlier merge
    # stays stale for as long as nobody happens to touch web/ again -- the rule
    # below would simply never fire, and the gate would be silent about a defect
    # that is already shipped.
    - if: $CI_COMMIT_BRANCH == "main"
    # On branches: source edits, dependency changes, and hand-edits of dist itself.
    - changes:
        - web/**/*
        - cmd/meshsat-hub/web/dist/**/*
  before_script:
    - apk add --no-cache git
  script:
    - cd web
    - npm ci --no-audit --no-fund
    - npm run build
    - cd ..
    # --exit-code fails on any difference. --stat first so the log names the files
    # rather than making somebody scroll a minified diff.
    - |
      if ! git diff --quiet -- cmd/meshsat-hub/web/dist; then
        echo "committed dist does not match what web/ builds:"
        git diff --stat -- cmd/meshsat-hub/web/dist
        echo ""
        echo "Rebuild and commit it:  cd web && npm ci && npm run build"
        echo "The binary embeds dist verbatim, so without this the shipped UI is stale."
        exit 1
      fi
    - echo "committed dist matches the committed source"

# -----------------------------------------------------------------------------
# TEST — unit tests
# -----------------------------------------------------------------------------
test:
  stage: test
  image: golang:1.25-alpine
  tags: [docker]
  script:
    # -timeout is EXPLICIT because Go's default is 10 minutes PER PACKAGE and this
    # suite has run close to it on a contended runner (MESHSAT-1088's pipeline).
    #
    # What the time actually goes to, measured from the JUnit report of job
    # 519612 (2026-09-15): the job took 408 s, of which the sqlite store
    # conformance suite was 262 s, and a dozen unrelated tests sat on a ~20 s
    # plateau. NOT Argon2 -- the whole suite hashes about eight passwords. Every
    # one of those tests opens a fresh SQLite file and runs all 25 migrations,
    # and on the runners' overlay filesystem the fsyncs of that cost 14-20 s per
    # test (1-3 s locally). HUB_SQLITE_TEST_FAST=1 turns durability off for
    # test databases (internal/store/sqlite DSN); GOMAXPROCS and -p stop two
    # co-scheduled jobs (`concurrent = 2`) from oversubscribing 16 cores twofold.
    # A genuine hang still fails the job, just later, which is the right trade:
    # a false red teaches people to retry pipelines without reading them.
    #
    # gotestsum wraps `go test -json` and writes a JUnit report, so a failure is
    # a named test in the pipeline's Tests tab instead of a line somewhere in a
    # 25-minute log. `--format testname` keeps the raw log readable too; the
    # full go test output of a FAILED test is still printed by gotestsum.
    - go install gotest.tools/gotestsum@v1.13.0
    - gotestsum --junitfile report.xml --format testname -- -p 4 -count=1 -timeout 25m ./...
  variables:
    HUB_SQLITE_TEST_FAST: "1"
    GOMAXPROCS: "8"
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 2 weeks

# Postgres store tests against a real server (MESHSAT-903). The unit job above
# skips them when HUB_TEST_POSTGRES_DSN is unset; this job provides it through a
# GitLab service container, so no Go test dependency is needed.
test:postgres:
  stage: test
  image: golang:1.25-alpine
  tags: [docker]
  services:
    - name: postgres:16-alpine
      alias: pg
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_DB: meshsat_test
    HUB_TEST_POSTGRES_DSN: "postgres://postgres@pg:5432/meshsat_test?sslmode=disable"
    HUB_SQLITE_TEST_FAST: "1"
    GOMAXPROCS: "8"
  script:
    # Same reasoning as the `test` job above: explicit budget, not the 10m default.
    # This job is the one that hit it first, because the store conformance suite
    # opens the most fresh databases.
    - go install gotest.tools/gotestsum@v1.13.0
    - gotestsum --junitfile report.xml --format testname -- -p 4 -count=1 -timeout 25m ./internal/store/...
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 2 weeks

# -----------------------------------------------------------------------------
# TEST:RACE — the race detector, nightly.
#
# Critical rule 7 is CGO_ENABLED=0 for everything that ships, and the race
# detector needs cgo, so the push pipeline never runs it. Three data races sat
# in internal/webhook's tests undetected because of that (found by hand,
# 2026-09-14). This job turns cgo on for the TEST BINARY ONLY -- nothing built
# here is packaged -- and runs on the nightly schedule (RACE_RUN=1) or by hand
# on main. It is slow (the detector is 2-10x) and the runners are shared, which
# is why it is not on every push. A red run here is a real bug: read it, do not
# retry it.
# -----------------------------------------------------------------------------
test:race:
  stage: test
  image: golang:1.25-alpine
  tags: [docker]
  needs: []
  variables:
    CGO_ENABLED: "1"
  before_script:
    - apk add --no-cache gcc musl-dev
    - go install gotest.tools/gotestsum@v1.13.0
  script:
    - gotestsum --junitfile report.xml --format testname -- -race -count=1 -timeout 45m ./internal/... ./cmd/...
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 2 weeks
  rules:
    - if: $RACE_RUN == "1"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# -----------------------------------------------------------------------------
# FUZZ — the parsers that eat untrusted binary off an internet-reachable port
# (MESHSAT-1202). Nightly, like test:race, because fuzzing is time-boxed work
# rather than a pass/fail gate on a push.
#
# `go test -fuzz` runs ONE target per invocation, so each is listed explicitly
# rather than discovered — a loop over a glob would silently fuzz only the first
# match and report success. The seed corpus of every target still runs on every
# ordinary `test` job, so a known-bad input is a push-blocking failure even
# though the exploration is nightly.
#
# A crash writes its input to testdata/fuzz/<Target>/; that file is the
# artifact worth keeping, so it is collected on failure and becomes a
# permanent seed once committed.
# -----------------------------------------------------------------------------
test:fuzz:
  stage: test
  image: golang:1.25-alpine
  tags: [docker]
  needs: []
  script:
    - |
      rc=0
      for t in \
        "./internal/reticulum FuzzHDLCFrameReader" \
      ; do
        set -- $t
        echo "== fuzzing $2 in $1 for ${FUZZTIME:-120s}"
        go test "$1" -run "^$" -fuzz "^$2\$" -fuzztime "${FUZZTIME:-120s}" || rc=$?
      done
      exit $rc
  artifacts:
    when: on_failure
    paths:
      - internal/**/testdata/fuzz/
    expire_in: 90 days
  rules:
    - if: $FUZZ_RUN == "1"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# -----------------------------------------------------------------------------
# BUILD — compile Go binary
# -----------------------------------------------------------------------------
build:
  stage: build
  image: golang:1.25-alpine
  tags: [docker]
  script:
    - go build -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o bin/meshsat-hub ./cmd/meshsat-hub/
    # The tak-operator ships in the same image (see Dockerfile); building it here
    # too means a break in it fails the pipeline rather than the image build.
    - go build -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o bin/tak-operator ./cmd/tak-operator/
  artifacts:
    paths:
      - bin/meshsat-hub
      - bin/tak-operator
    expire_in: 1 week

# -----------------------------------------------------------------------------
# PACKAGE — Docker build + push to GHCR
# -----------------------------------------------------------------------------
package:
  stage: package
  tags: [docker]
  image: docker:28
  needs:
    - job: build
      artifacts: false
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      docker build \
        --build-arg VERSION=${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_HUB_IMAGE}:latest \
        .
      docker push ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}
      docker push ${MESHSAT_HUB_IMAGE}:latest
      echo "Pushed ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      # The digest is what gets signed and what gets pinned; a tag can be
      # re-pointed, a digest cannot.
      docker inspect --format='{{index .RepoDigests 0}}' "${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}" > image-digest.txt
      cat image-digest.txt
  artifacts:
    paths: [image-digest.txt]
    expire_in: 1 week
  rules:
    # A scheduled pipeline (nightly race run, weekly ZAP) is not a release: it
    # must not rebuild and re-push the image, and `latest` must keep pointing at
    # what the last merge built. bump_k8s_pin already refuses schedules.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# PACKAGE:STUNNEL — the Reticulum-leg stunnel image for the k8s tree
# (k8s/stunnel/Dockerfile). Tag = alpine base; pinned in k8s/kustomization.yaml.
# -----------------------------------------------------------------------------
package:stunnel:
  stage: package
  tags: [docker]
  image: docker:28
  needs: []
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - docker build -t ghcr.io/meshsat/meshsat-hub-stunnel:3.21 -f k8s/stunnel/Dockerfile k8s/stunnel
    - docker push ghcr.io/meshsat/meshsat-hub-stunnel:3.21
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - k8s/stunnel/Dockerfile
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# OTS IMAGE: OpenTAKServer for hosted per-tenant TAK (MESHSAT-1034, -1035).
# Built and CVE-scanned on every branch push that touches k8s/ots, so a broken
# lock or a vulnerable dependency fails before merge. Pushed only on main, where
# trivy:ots is the authoritative gate. The tak-operator config pins the image by
# digest; bump_k8s_pin does not manage it.
# -----------------------------------------------------------------------------
# PACKAGE:VERIFY — the nightly verification runner for the k8s tree
# (k8s/verify/Dockerfile). Tag = the kubectl version it carries; pinned in
# k8s/kustomization.yaml.
# -----------------------------------------------------------------------------
package:verify:
  stage: package
  tags: [docker]
  image: docker:28
  needs: []
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - docker build -t ghcr.io/meshsat/meshsat-hub-verify:v1.36.3 -f k8s/verify/Dockerfile k8s/verify
    - docker push ghcr.io/meshsat/meshsat-hub-verify:v1.36.3
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - k8s/verify/Dockerfile

# -----------------------------------------------------------------------------
.ots-image:
  variables:
    OTS_IMAGE: "ghcr.io/meshsat/meshsat-hub-ots"
    OTS_VERSION: "1.7.13"

package:ots:
  extends: .ots-image
  stage: package
  tags: [docker]
  image: docker:28
  needs: []
  timeout: 45m
  script:
    - docker build -t "$OTS_IMAGE:$OTS_VERSION-$CI_COMMIT_SHORT_SHA" -f k8s/ots/Dockerfile k8s/ots
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
        docker push "$OTS_IMAGE:$OTS_VERSION-$CI_COMMIT_SHORT_SHA"
        docker tag "$OTS_IMAGE:$OTS_VERSION-$CI_COMMIT_SHORT_SHA" "$OTS_IMAGE:$OTS_VERSION"
        docker push "$OTS_IMAGE:$OTS_VERSION"
      else
        # Branch pipelines cannot push (GHCR_USER is a protected group variable),
        # so they scan the image this job just built. Same gate as trivy:ots,
        # which stays authoritative on main. The binary comes out of the same
        # aquasec/trivy:0.58.2 image that job runs: Alpine's repos for docker:28
        # have no trivy package, and v0.58.2 is no longer on GitHub releases.
        TC=$(docker create aquasec/trivy:0.58.2)
        docker cp "$TC:/usr/local/bin/trivy" /usr/local/bin/trivy
        docker rm "$TC" >/dev/null
        trivy image --scanners vuln --quiet --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$OTS_IMAGE:$OTS_VERSION-$CI_COMMIT_SHORT_SHA"
        echo "branch pipeline: image built and scanned, not pushed"
      fi
  # The OTS image is about 1 GB, and keeping one per build filled runner03's
  # disk on 2026-09-11. Remove what this job tagged, whether it passed or
  # failed. The shared build cache is left alone.
  after_script:
    - docker image rm -f "$OTS_IMAGE:$OTS_VERSION-$CI_COMMIT_SHORT_SHA" "$OTS_IMAGE:$OTS_VERSION" >/dev/null 2>&1 || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        - k8s/ots/**/*
        - .gitlab-ci.yml

# The OTS image runs third-party Python that faces the internet, so the same
# CVE gate as the Hub image applies to it.
trivy:ots:
  extends: .ots-image
  stage: package
  tags: [docker]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  needs:
    - job: package:ots
      artifacts: false
  timeout: 30m
  variables:
    TRIVY_USERNAME: $GHCR_USER
    TRIVY_PASSWORD: $GHCR_TOKEN
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - IMAGE="${OTS_IMAGE}:${OTS_VERSION}-${CI_COMMIT_SHORT_SHA}"
    # Full census, informational.
    - trivy image --scanners vuln --quiet --format table --severity CRITICAL,HIGH "$IMAGE" || true
    # The gate: its exit status is the job's.
    - trivy image --scanners vuln --quiet --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$IMAGE"
    - echo "no fixable CRITICAL/HIGH CVEs in $IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - k8s/ots/**/*
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# TRIVY — fixable CRITICAL/HIGH CVEs in the pushed image block the pipeline
# (MESHSAT-930). The scanner image is the job image and pulls the artifact
# straight from GHCR with the registry credentials; no docker daemon needed.
# -----------------------------------------------------------------------------
trivy:
  stage: package
  tags: [docker]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  needs:
    - job: package
      artifacts: false
  timeout: 30m
  variables:
    TRIVY_USERNAME: $GHCR_USER
    TRIVY_PASSWORD: $GHCR_TOKEN
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - IMAGE="${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    # SBOM (CycloneDX) of exactly this image; attested to the image by `sign`.
    - trivy image --format cyclonedx --quiet --output sbom.cdx.json "$IMAGE"
    # Full census, informational.
    - trivy image --scanners vuln --quiet --format table --severity CRITICAL,HIGH "$IMAGE" || true
    # The gate: its exit status is the job's.
    - trivy image --scanners vuln --quiet --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$IMAGE"
    - echo "no fixable CRITICAL/HIGH CVEs in $IMAGE"
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 1 year
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# SIGN — the image is signed by digest and its SBOM attested to it.
#
# cosign with a key pair: the private key and its password are the protected
# project variables COSIGN_PRIVATE_KEY and COSIGN_PASSWORD (source of truth:
# OpenBao secret/ci-no/apps/meshsat-hub/cosign); the public key is committed
# as cosign.pub so anyone -- and, next, a Kyverno verifyImages policy on the
# cluster -- can check what is running against what CI built. bump_k8s_pin
# needs this job: an unsigned image is never pinned. The verify at the end is
# the self-check that the signature reads back with the committed public key.
#
# Two things learnt by rehearsing this against ghcr before it ran here:
#   - the official cosign image is distroless (no shell), so GitLab cannot run
#     a script in it; the release binary is fetched and checksum-pinned instead.
#   - cosign 3 refuses --tlog-upload=false; "no transparency log" is a signing
#     config with no Rekor and no TSA. There is no Rekor reachable from this
#     GitLab and the public one is not where this estate's digests belong.
#     Verification correspondingly ignores the (absent) tlog entry.
# The signature and attestation land as OCI referrers next to the image.
# -----------------------------------------------------------------------------
sign:
  stage: package
  tags: [docker]
  image: alpine:3.21
  needs:
    - job: package
      artifacts: true
    - job: trivy
      artifacts: true
  variables:
    COSIGN_VERSION: "v3.1.2"
    COSIGN_SHA256: "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf"
    COSIGN_YES: "true"
  before_script:
    - apk add --no-cache curl
    - curl -sSfL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
    - chmod +x /usr/local/bin/cosign
    - cosign version
  script:
    - DIGEST="$(cat image-digest.txt)"
    - echo "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
    - cosign signing-config create --no-default-fulcio --no-default-oidc --no-default-rekor --no-default-tsa --out no-tlog.json
    - cosign sign --key env://COSIGN_PRIVATE_KEY --signing-config no-tlog.json "$DIGEST"
    - cosign attest --key env://COSIGN_PRIVATE_KEY --signing-config no-tlog.json --type cyclonedx --predicate sbom.cdx.json "$DIGEST"
    - cosign verify --key cosign.pub --insecure-ignore-tlog=true "$DIGEST" > /dev/null
    - cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type cyclonedx "$DIGEST" > /dev/null
    - echo "signed and attested $DIGEST"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# BUMP K8S PIN — GitOps deploy path for the notrf01 cluster (MESHSAT-930).
# Writes the pushed image digest into k8s/kustomization.yaml on main; Argo CD
# rolls it out. Copy of the omoikane daemon job. Needs the file variable
# K8S_PIN_SSH_KEY (deploy key "k8s-pin-bump", write access). Skipped until the
# k8s tree exists.
# -----------------------------------------------------------------------------
bump_k8s_pin:
  stage: deploy
  interruptible: false
  resource_group: k8s-pin-bump
  image: docker:28
  tags: [docker]
  cache: []
  variables:
    GIT_STRATEGY: none
    PIN_REMOTE: "git@nllei01gitlab01.nuclearlighters.net:products/meshsat/meshsat-hub.git"
  needs:
    - job: sign
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      exists:
        - k8s/kustomization.yaml
  retry:
    max: 1
    when:
      - runner_system_failure
  before_script:
    - apk add --no-cache bash git openssh-client python3
    - docker info >/dev/null 2>&1 || { echo "FATAL - host docker.sock not reachable"; exit 1; }
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      bash -euo pipefail -c '
      [ -n "${K8S_PIN_SSH_KEY:-}" ] || { echo "FATAL - K8S_PIN_SSH_KEY file variable not set on this project"; exit 1; }
      install -m 600 "$K8S_PIN_SSH_KEY" /tmp/pin_key
      export GIT_SSH_COMMAND="ssh -i /tmp/pin_key -o StrictHostKeyChecking=accept-new"
      git clone --depth 200 --branch main "$PIN_REMOTE" /tmp/pin-repo
      cd /tmp/pin-repo
      git config user.name "k8s-pin-bump"
      git config user.email "k8s-pin-bump@nuclearlighters.net"
      # Never pin a build older than the one already pinned.
      #
      # resource_group serialises these jobs; it does NOT order them by commit
      # ancestry. Two merges landing close together, with the OLDER commit`s
      # pipeline finishing second, had this job quietly roll production back to
      # a build missing the newer merge (MESHSAT-1023: a fix for a 403 on the
      # checkout endpoint was merged, pinned, and then un-pinned by a slower
      # pipeline for an earlier commit). Nothing announced it; the deployment
      # simply went backwards.
      #
      # Each pin commit records the commit it pinned in a Source: trailer, so
      # that is what this reads back.
      # `sed -n 1p`, NOT `head -1`. head exits after the first line, which closes
      # the pipe under it; git log is still writing, takes SIGPIPE, and returns
      # 141 -- which `set -o pipefail` promotes into a failed job. It only bites
      # once the log is larger than a pipe buffer, so it passed review and every
      # small-repo test and then blocked EVERY deploy the moment this job first
      # ran for real (2026-09-11: pipelines 53297 and 53302, both exit 141,
      # production stuck on the previous pin). sed -n 1p reads to EOF and prints
      # only the first line, so nothing upstream is ever signalled.
      pinned=$(git log -100 --pretty=%b -- k8s/kustomization.yaml \
               | sed -n "s|^Source: .*@\([0-9a-f]\{40\}\).*|\1|p" | sed -n 1p)
      if [ -n "$pinned" ] && [ "$pinned" != "$CI_COMMIT_SHA" ] \
         && git cat-file -e "${pinned}^{commit}" 2>/dev/null \
         && git merge-base --is-ancestor "$CI_COMMIT_SHA" "$pinned"; then
        echo "refusing to pin $CI_COMMIT_SHORT_SHA: it is an ANCESTOR of the already-pinned $pinned,"
        echo "so writing it would deploy a build missing whatever landed since. Nothing to do."
        exit 0
      fi
      digest=$(docker buildx imagetools inspect "$MESHSAT_HUB_IMAGE:$CI_COMMIT_SHORT_SHA" --format "{{json .Manifest}}" \
               | python3 -c "import json,sys; print(json.load(sys.stdin)[\"digest\"])")
      rc=0
      # The 4th argument is the provenance comment (MESHSAT-1047). Without it the
      # digest moved on every deploy and its comment never did, so the file named
      # a commit from days earlier. These are values this job already has.
      python3 k8s/scripts/bump-pin.py k8s/kustomization.yaml "$MESHSAT_HUB_IMAGE" "$digest" \
        "$CI_COMMIT_BRANCH $CI_COMMIT_SHORT_SHA ($(date -u +%Y-%m-%d))" || rc=$?
      case "$rc" in 0) : ;; 3) echo "pin already current"; exit 0;; *) exit "$rc";; esac
      git commit -am "[skip ci] chore(k8s): bump $MESHSAT_HUB_IMAGE pin to $CI_COMMIT_SHORT_SHA" \
        -m "Source: $CI_PROJECT_PATH@$CI_COMMIT_SHA (pipeline $CI_PIPELINE_ID)"
      for i in 1 2 3; do
        git push origin HEAD:main && exit 0
        git fetch origin main && git rebase origin/main
      done
      echo "FATAL: could not push pin bump after 3 attempts"; exit 1
      '


# -----------------------------------------------------------------------------
pages:
  stage: pages
  tags: [docker]
  image: alpine:latest
  before_script:
    - apk add --no-cache hugo git
  script:
    - cd docs/site
    - hugo --minify --baseURL "${CI_PAGES_URL}"
    - mv public ../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/site/**/*

# -----------------------------------------------------------------------------
# CHANGELOG — Generate changelog from conventional commits on tag push
# -----------------------------------------------------------------------------
changelog:
  stage: release
  tags: [docker]
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash
  script:
    - bash scripts/changelog.sh > CHANGELOG.md
    - cat CHANGELOG.md
  artifacts:
    paths:
      - CHANGELOG.md
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# CHANGELOG — tell meshsat.net to regenerate /changelog/ when a tag is cut
# [MESHSAT-853]. Downstream: meshsat-website job changelog:regenerate (source
# "pipeline", CHANGELOG_RUN=1); it commits the new section and deploys only
# when the pages changed. The nightly schedule there covers everything else.
# -----------------------------------------------------------------------------
changelog:notify-website:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true
  variables:
    CHANGELOG_RUN: "1"
  trigger:
    project: products/meshsat/meshsat-website
    branch: main
