stages:
  - lint
  - test
  - build
  - package
  - pages

variables:
  MESHSAT_HUB_IMAGE: "ghcr.io/cubeos-app/meshsat-hub"

variables:
  CGO_ENABLED: "0"

lint:
  stage: lint
  image: golangci/golangci-lint:v1.64-alpine
  script:
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.24-alpine
  script:
    - go test -v -count=1 ./...

build:
  stage: build
  image: golang:1.24-alpine
  script:
    - go build -ldflags "-s -w" -o bin/meshsat-hub ./cmd/meshsat-hub/
  artifacts:
    paths:
      - bin/meshsat-hub
    expire_in: 1 week

package:
  stage: package
  tags: [multiarch]
  image: docker:24
  needs:
    - job: build
      artifacts: false
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      docker build \
        -t ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${MESHSAT_HUB_IMAGE}:latest \
        .
      docker push ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}
      docker push ${MESHSAT_HUB_IMAGE}:latest
      echo "Pushed ${MESHSAT_HUB_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: pages
  image: alpine:latest
  before_script:
    - apk add --no-cache hugo git
  script:
    - cd docs/site
    - hugo --minify --baseURL "${CI_PAGES_URL}"
    - mv public ../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/site/**/*
