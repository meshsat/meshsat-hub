stages:
  - lint
  - test
  - build
  - pages

variables:
  CGO_ENABLED: "0"

lint:
  stage: lint
  image: golangci/golangci-lint:v1.64-alpine
  script:
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.24-alpine
  script:
    - go test -v -count=1 ./...

build:
  stage: build
  image: golang:1.24-alpine
  script:
    - go build -ldflags "-s -w" -o bin/meshsat-hub ./cmd/meshsat-hub/
  artifacts:
    paths:
      - bin/meshsat-hub
    expire_in: 1 week

pages:
  stage: pages
  image: alpine:latest
  before_script:
    - apk add --no-cache hugo git
  script:
    - cd docs/site
    - hugo --minify --baseURL "${CI_PAGES_URL}"
    - mv public ../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/site/**/*
