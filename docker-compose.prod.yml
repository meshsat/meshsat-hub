## MeshSat Hub — Production Docker Compose
## Usage: docker compose -f docker-compose.prod.yml up -d
## Requires: .env file with secrets (see docs/deployment.md)

services:
  hub:
    image: ghcr.io/meshsat/meshsat-hub:latest
    container_name: meshsat-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:6070:6070"  # only expose to localhost — Caddy proxies externally
    env_file: .env
    environment:
      - HUB_PORT=6070
      - HUB_MQTT_BROKER_URL=tcp://mqtt:1883
      - HUB_LOG_LEVEL=info
      - HUB_LOG_FORMAT=json
    volumes:
      - hub-data:/data
    depends_on:
      mqtt:
        condition: service_started
    networks:
      - hubnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6070/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M

  mqtt:
    image: eclipse-mosquitto:2
    container_name: meshsat-mqtt
    restart: unless-stopped
    ports:
      - "6071:1883"     # MQTT TCP (field devices connect here)
      - "6072:9001"     # MQTT WebSocket (dashboard, optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - hubnet
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    container_name: meshsat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub
    networks:
      - hubnet

  tor:
    image: cmehay/docker-tor-hidden-service:latest
    container_name: meshsat-tor
    restart: unless-stopped
    environment:
      HUB_TOR_SERVICE_HOSTS: "80:hub:6070,1883:mqtt:1883"
      HUB_TOR_SERVICE_VERSION: "3"
    volumes:
      - tor-keys:/var/lib/tor/hidden_service
    depends_on:
      - hub
      - mqtt
    networks:
      - hubnet

  # Optional: Apprise multi-channel notifications (enable with --profile notifications)
  apprise:
    image: caronc/apprise:latest
    container_name: meshsat-apprise
    restart: unless-stopped
    networks:
      - hubnet
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - notifications

  # Optional: OpenTAKServer (enable with --profile tak)
  opentakserver:
    image: ghcr.io/brian7704/opentakserver:latest
    container_name: meshsat-tak
    restart: unless-stopped
    ports:
      - "8087:8087"
      - "8089:8089"
      - "8443:8443"
    volumes:
      - tak-data:/opt/opentakserver/data
    networks:
      - hubnet
    profiles:
      - tak

  # Optional: Prometheus metrics (enable with --profile monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: meshsat-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - hubnet
    profiles:
      - monitoring

volumes:
  hub-data:
  mqtt-data:
  mqtt-log:
  tor-keys:
  tak-data:
  caddy-data:
  caddy-config:
  prometheus-data:

networks:
  hubnet:
    driver: bridge
