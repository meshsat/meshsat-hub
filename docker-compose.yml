services:
  hub:
    build: .
    container_name: meshsat-hub
    restart: unless-stopped
    ports:
      - "6070:6070"
    environment:
      - HUB_PORT=6070
      - HUB_MQTT_BROKER_URL=tcp://mqtt:1883
      - HUB_LOG_LEVEL=info
      - HUB_LOG_FORMAT=json
      # TAK/CoT integration (requires 'tak' profile: docker compose --profile tak up)
      - HUB_TAK_ENABLED=false
      - HUB_TAK_HOST=opentakserver
      - HUB_TAK_PORT=8087
      - HUB_TAK_SSL=false
      - HUB_TAK_CALLSIGN_PREFIX=MESHSAT-HUB
      - HUB_TAK_COT_STALE_SECONDS=600
      # Apprise notifications (requires 'notifications' profile)
      - HUB_APPRISE_ENABLED=false
      - HUB_APPRISE_URL=http://apprise:8000
      # ntfy push notifications (requires 'notifications' profile)
      - HUB_NTFY_ENABLED=false
      - HUB_NTFY_URL=http://ntfy:80
      # APRS-IS IGate (optional — requires amateur radio license)
      - HUB_APRSIS_ENABLED=false
      - HUB_APRSIS_SERVER=euro.aprs2.net:14580
      - HUB_APRSIS_CALLSIGN=
      - HUB_APRSIS_PASSCODE=
    volumes:
      - hub-data:/data
    depends_on:
      mqtt:
        condition: service_started
    networks:
      - hubnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6070/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mqtt:
    image: eclipse-mosquitto:2
    container_name: meshsat-mqtt
    restart: unless-stopped
    ports:
      - "6071:1883"
      - "6072:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - hubnet

  tor:
    image: cmehay/docker-tor-hidden-service:latest
    container_name: meshsat-tor
    restart: unless-stopped
    environment:
      HUB_TOR_SERVICE_HOSTS: "80:hub:6070,1883:mqtt:1883"
      HUB_TOR_SERVICE_VERSION: "3"
    volumes:
      - tor-keys:/var/lib/tor/hidden_service
    depends_on:
      - hub
      - mqtt
    networks:
      - hubnet

  # Apprise — multi-channel notification service (90+ backends).
  # Hub connects to this internally for SOS/alert notifications.
  apprise:
    image: caronc/apprise:latest
    container_name: meshsat-apprise
    restart: unless-stopped
    networks:
      - hubnet
    profiles:
      - notifications

  # ntfy — lightweight push notifications for mobile/desktop.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: meshsat-ntfy
    restart: unless-stopped
    command: serve
    networks:
      - hubnet
    profiles:
      - notifications

  # OpenTAKServer — CoT/TAK integration for situational awareness.
  # Hub's Go service connects to this internally on port 8087 (TCP CoT).
  # ATAK/WinTAK/iTAK clients connect externally on ports 8087/8089/8443.
  opentakserver:
    image: ghcr.io/brian7704/opentakserver:latest
    container_name: meshsat-tak
    restart: unless-stopped
    ports:
      - "8087:8087"   # TCP CoT (plaintext)
      - "8089:8089"   # TCP CoT (TLS)
      - "8443:8443"   # HTTPS DataPackage API
    volumes:
      - tak-data:/opt/opentakserver/data
    networks:
      - hubnet
    profiles:
      - tak

volumes:
  hub-data:
  mqtt-data:
  mqtt-log:
  tor-keys:
  tak-data:

networks:
  hubnet:
    driver: bridge
