    - ANY_REACHABLE
    - ORDERED_FALLBACK
    - HEMB_BONDED
    - ALL_BEARERS
    type: string
    x-enum-varnames:
    - StrategyPrimaryOnly
    - StrategyAnyReachable
    - StrategyOrderedFallback
    - StrategyHeMBBonded
    - StrategyAllBearers
  github_com_meshsat_meshsat-hub_internal_directory.TrustLevel:
    enum:
    - 0
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - TrustUnknown
    - TrustAuto
    - TrustQR
    - TrustInPerson
  github_com_meshsat_meshsat-hub_internal_geo.Fence:
    properties:
      chain_id:
        description: escalation chain to trigger
        type: string
      cooldown_sec:
        description: |-
          CooldownSec suppresses repeat events for the same device and this fence
          after one fires. 0 means the platform default. See Engine.cooldown.
        type: integer
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      polygon:
        description: ordered vertices (closed polygon)
        items:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_geo.Point'
        type: array
      tenant_id:
        type: string
      trigger:
        allOf:
        - $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_geo.TriggerMode'
        description: '"enter", "exit", "both"'
    type: object
  github_com_meshsat_meshsat-hub_internal_geo.Point:
    properties:
      lat:
        description: |-
          The JSON names are lower case on purpose: geofence polygons are read
          and written by the SPA, which sends {"lat","lon"} on create. Without
          the tags the API answered {"Lat","Lon"} and the map drew nothing
          (MESHSAT-967).
        type: number
      lon:
        type: number
    type: object
  github_com_meshsat_meshsat-hub_internal_geo.TriggerMode:
    enum:
    - enter
    - exit
    - both
    type: string
    x-enum-varnames:
    - TriggerEnter
    - TriggerExit
    - TriggerBoth
  github_com_meshsat_meshsat-hub_internal_integrations.Field:
    properties:
      broker:
        description: |-
          Broker marks an MQTT broker address (ssl://host:port) the Hub will dial
          for this tenant. The same request-forgery concern as URL, with the
          scheme set an MQTT client accepts: the host must resolve to a public
          address, so a tenant cannot point the Hub at nats:1883 or the database.
        type: boolean
      default:
        type: string
      generate:
        description: filled with a random token when left empty
        type: boolean
      hint:
        type: string
      key:
        type: string
      label:
        type: string
      multiline:
        description: |-
          Multiline renders as a textarea and raises the size cap: a PEM block
          pasted into a single-line input loses its newlines and can never parse.
        type: boolean
      pem:
        description: |-
          PEM values are checked on save: the block must decode, and a field
          ending in client_cert_pem must pair with its client_key_pem
          (tls.X509KeyPair), so a bad paste is a 400 here rather than a connect
          loop in a log the customer cannot read (MESHSAT-1151).
        type: boolean
      required:
        description: must be present to count as configured
        type: boolean
      secret:
        description: write-only, masked on read
        type: boolean
      url:
        description: |-
          URL marks a field the Hub will make outbound requests to. Those are
          validated against internal/netguard on save, because a tenant choosing a
          URL the Hub then fetches is a request-forgery primitive: the Hub sits in a
          cluster with a database, a broker and a metadata service all reachable by
          name (MESHSAT-1121, found by gosec as a G704 taint).
        type: boolean
    type: object
  github_com_meshsat_meshsat-hub_internal_protocol.HeMBReassemblyStats:
    properties:
      active_streams:
        type: integer
      generations_decoded:
        type: integer
      generations_pending:
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_reticulum.PathHandlerStatsSnapshot:
    properties:
      deduplicated:
