  /api/v1/directory/export/vcard:
    get:
      description: |-
        Streams every contact in the caller's tenant as a
        concatenated vCard 4.0 document. X-MESHSAT-*
        extensions carry the bearer-kind metadata not covered
        by standard TEL/EMAIL.
      parameters:
      - description: Max contacts (default 10000)
        in: query
        name: limit
        type: integer
      produces:
      - text/vcard
      responses:
        "200":
          description: vCard 4.0 text
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export tenant contacts as vCard 4.0
      tags:
      - directory
  /api/v1/directory/import/csv:
    post:
      consumes:
      - text/csv
      description: |-
        Uploads a CSV file with header row:
        `display_name,sms,meshtastic,aprs,email,team,role`.
        Unknown columns ignored; missing columns treated as
        empty. One contact per data row.
      parameters:
      - description: CSV with header row
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import contacts from CSV
      tags:
      - directory
  /api/v1/directory/import/vcard:
    post:
      consumes:
      - text/vcard
      description: |-
        Uploads a .vcf file (Content-Type: text/vcard) and
        creates directory_contacts + directory_addresses rows
        for each record. X-MESHSAT-* extensions cover the
        bearer kinds that standard vCard does not
        (MESHTASTIC, APRS, IRIDIUM_SBD/IMT, CELLULAR, TAK,
        RETICULUM, ZIGBEE, BLE, WEBHOOK, MQTT) plus team /
        role / SIDC / trust-level metadata. Response reports
        parsed / imported / errors counts.
      parameters:
      - description: vCard 4.0 text (one or more BEGIN/END records)
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import contacts from vCard 4.0
      tags:
      - directory
  /api/v1/directory/snapshot:
    get:
      description: |-
        Full tenant directory payload with an ECDSA-P256-SHA256
        signature over its canonical JSON. Bridges consume via
        the directory_push MQTT command (MESHSAT-540) or by
        polling this endpoint on reconnect. since is advisory —
        v1 always returns the full snapshot; a future delta
        endpoint (MESHSAT-540) ships incremental changes.
      parameters:
      - description: 'Hint: only return data if stored version > since'
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_directory.Snapshot'
        "304":
          description: Not modified — stored version <= since
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get signed directory snapshot
      tags:
      - directory
