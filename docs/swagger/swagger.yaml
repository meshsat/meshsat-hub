host: localhost:6070
info:
  contact: {}
  description: Multi-tenant SaaS platform for satellite device management. Ingests
    MO messages from Iridium/Globalstar, manages devices, SOS escalation, dead man's
    switch, and E2E encryption.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: MeshSat Hub API
  version: "1.1"
paths:
  /api/alert-rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.AlertRule'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List alert rules
      tags:
      - alerting
    post:
      consumes:
      - application/json
      parameters:
      - description: Alert rule configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.AlertRule'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.AlertRule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create alert rule
      tags:
      - alerting
  /api/alert-rules/{id}:
    delete:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete alert rule
      tags:
      - alerting
    get:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.AlertRule'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get alert rule
      tags:
      - alerting
    put:
      consumes:
      - application/json
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated alert rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.AlertRule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.AlertRule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update alert rule
      tags:
      - alerting
  /api/alerts:
    get:
      parameters:
      - default: false
        description: Only active alerts
        in: query
        name: active
        type: boolean
      - default: 50
        description: Max results
        in: query
