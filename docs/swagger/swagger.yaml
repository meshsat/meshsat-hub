      cert_issuer:
        type: string
      cert_not_after:
        type: string
      cert_subject:
        type: string
      created_at:
        type: string
      cred_type:
        description: mtls_bundle, api_key, webhook_secret, username_password
        type: string
      distributed_at:
        type: string
      id:
        type: string
      name:
        description: human-readable label
        type: string
      provider:
        description: cloudloop_mqtt, rockblock, globalstar, etc.
        type: string
      status:
        description: active, expiring, expired, revoked
        type: string
      target_bridge_id:
        type: string
      target_scope:
        description: hub, bridge, all
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_store.Device:
    properties:
      created_at:
        type: string
      imei:
        type: string
      label:
        type: string
      last_seen:
        type: string
      notes:
        type: string
      type:
        description: '"rockblock", "globalstar", etc.'
        type: string
      updated_at:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.DeviceConfig:
    properties:
      author:
