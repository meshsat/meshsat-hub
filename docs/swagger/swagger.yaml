basePath: /
definitions:
  github_com_cubeos-app_meshsat-hub_internal_auth.User:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      roles:
        items:
          type: string
        type: array
      tenant_id:
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_deadman.Config:
    properties:
      chain_id:
        description: escalation chain to trigger
        type: string
      device_imei:
        type: string
      enabled:
        type: boolean
      grace:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: grace period after interval expires
      interval:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: expected check-in interval
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.APIKey:
    properties:
      created_at:
        type: string
      device_imei:
        description: 'optional: scope to specific device'
        type: string
      expires_at:
        type: string
      id:
        type: string
      key_prefix:
        description: first 8 chars for display (e.g. "meshsat_ab12cd34")
        type: string
      label:
        description: human-readable label
        type: string
      last_used:
        type: string
      role:
        description: '"viewer", "operator", "owner"'
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.Alert:
    properties:
      acked_at:
        type: string
      acked_by:
        type: string
      chain_id:
        type: string
      created_at:
        type: string
      current_tier:
        description: 0-indexed tier in the chain
        type: integer
      detail:
        description: human-readable description
        type: string
      device_imei:
        type: string
      id:
        type: string
      next_esc_at:
        description: when to escalate to next tier
        type: string
      retries:
        description: retries within current tier
        type: integer
      state:
        description: triggered, escalating, acknowledged, exhausted
        type: string
      type:
        description: '"sos", "deadman", "geofence", "custom"'
        type: string
      updated_at:
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.AuditEntry:
    properties:
      action:
        type: string
      actor:
        type: string
      created_at:
        type: string
      detail:
        type: string
      hash:
        description: SHA-256 of (action|actor|detail|ip|prev_hash)
        type: string
      id:
        type: string
      ip:
        type: string
      prev_hash:
        description: SHA-256 hash of the previous entry
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.Device:
    properties:
      created_at:
        type: string
      imei:
        type: string
      label:
        type: string
      last_seen:
        type: string
      notes:
        type: string
      type:
        description: '"rockblock", "astrocast", etc.'
        type: string
      updated_at:
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.DeviceConfig:
    properties:
      author:
        description: who made this change
        type: string
      comment:
        description: change description
        type: string
      config:
        description: JSON-encoded configuration
        type: string
      created_at:
        type: string
      device_imei:
        type: string
      id:
        type: string
      version:
        type: integer
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.DeviceKey:
    properties:
      created_at:
        type: string
      device_imei:
        type: string
      id:
        type: string
      key_hash:
        description: SHA-256 hash for identification
        type: string
      key_hex:
        description: hex-encoded AES-256 key (omitted in listings, passthrough)
        type: string
      mode:
        description: '"decrypt" (server can read) or "passthrough" (opaque)'
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.DeviceWireguard:
    properties:
      created_at:
        type: string
      device_imei:
        type: string
      peer_id:
        description: wg-easy peer ID
        type: string
      public_key:
        type: string
      vpn_address:
        description: allocated VPN IP (e.g. "10.8.0.5/32")
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.EscalationChain:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      tiers:
        items:
          $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.EscalationTier'
        type: array
      updated_at:
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.EscalationTier:
    properties:
      max_retries:
        description: max delivery retries within this tier
        type: integer
      name:
        description: e.g. "sms_oncall", "email_team", "page_manager"
        type: string
      targets:
        description: notification targets (URLs, emails, phone numbers)
        items:
          type: string
        type: array
      wait_sec:
        description: seconds to wait before escalating to next tier
        type: integer
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.Message:
    properties:
      channel:
        description: '"iridium", "astrocast"'
        type: string
      compressed:
        type: boolean
      created_at:
        type: string
      device_imei:
        type: string
      direction:
        description: '"mo" or "mt"'
        type: string
      error:
        type: string
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      momsn:
        type: integer
      raw_hex:
        type: string
      status:
        description: '"received", "queued", "sent", "delivered", "failed"'
        type: string
      text:
        type: string
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.NotificationPref:
    properties:
      created_at:
        type: string
      device_imei:
        description: device IMEI or "*" for tenant-wide default
        type: string
      enabled:
        description: toggle notifications without deleting config
        type: boolean
      events:
        description: 'event types to notify on: "sos", "deadman", "geofence", "mo",
          "mt_status"'
        items:
          type: string
        type: array
      id:
        type: string
      updated_at:
        type: string
      urls:
        description: Apprise notification URLs (e.g., "slack://token", "mailto://...")
        items:
          type: string
        type: array
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.Position:
    properties:
      alt:
        type: number
      cep:
        type: number
      created_at:
        type: string
      device_imei:
        type: string
      heading:
        description: degrees 0-360
        type: number
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      sats:
        description: satellites in view
        type: integer
      source:
        description: '"gps", "iridium_cep", "astrocast"'
        type: string
      speed:
        description: m/s
        type: number
    type: object
  github_com_cubeos-app_meshsat-hub_internal_store.Route:
    properties:
      created_at:
        type: string
      destination_type:
        type: string
      enabled:
        type: boolean
      filter:
        type: string
      id:
        type: string
      name:
        type: string
      source_type:
        type: string
      updated_at:
        type: string
    type: object
  internal_api.ackRequest:
    properties:
      acked_by:
        type: string
    type: object
  internal_api.createConfigRequest:
    properties:
      comment:
        type: string
      config:
        items:
          type: integer
        type: array
    type: object
  internal_api.createDeviceKeyRequest:
    properties:
      mode:
        description: '"decrypt" or "passthrough"'
        type: string
    type: object
  internal_api.createDeviceKeyResponse:
    properties:
      id:
        type: string
      key_hash:
        type: string
      key_hex:
        description: plaintext — shown once
        type: string
      mode:
        type: string
    type: object
  internal_api.createKeyRequest:
    properties:
      device_imei:
        type: string
      expires_in:
        description: Go duration string, e.g. "720h"
        type: string
      label:
        type: string
      role:
        type: string
    type: object
  internal_api.createKeyResponse:
    properties:
      expires_at:
        type: string
      id:
        type: string
      key:
        description: plaintext — shown once
        type: string
      key_prefix:
        type: string
      label:
        type: string
      role:
        type: string
    type: object
  internal_api.createUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        description: '"viewer", "operator", "owner"'
        type: string
    type: object
  internal_api.deadmanConfigRequest:
    properties:
      chain_id:
        type: string
      enabled:
        type: boolean
      grace_min:
        description: grace period in minutes
        type: integer
      interval_min:
        description: check-in interval in minutes
        type: integer
    type: object
  internal_api.deviceCreateResponse:
    properties:
      created_at:
        type: string
      imei:
        type: string
      label:
        type: string
      last_seen:
        type: string
      notes:
        type: string
      type:
        description: '"rockblock", "astrocast", etc.'
        type: string
      updated_at:
        type: string
      wireguard:
        $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.DeviceWireguard'
    type: object
  internal_api.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_api.loginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  internal_api.paginatedPositions:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      positions:
        items:
          $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.Position'
        type: array
      total:
        type: integer
    type: object
  internal_api.snoozeRequest:
    properties:
      duration_min:
        type: integer
    type: object
  internal_api.triggerAlertRequest:
    properties:
      chain_id:
        type: string
      detail:
        type: string
      device_imei:
        type: string
      type:
        type: string
    type: object
  internal_api.updateUserRequest:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      password:
        description: optional — only set if changing
        type: string
      role:
        type: string
    type: object
  internal_api.userResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_login_at:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  internal_cluster.ClusterStatus:
    properties:
      checked_at:
        type: string
      healthy:
        type: boolean
      node_count:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/internal_cluster.NodeStatus'
        type: array
      problems:
        items:
          type: string
        type: array
      quorum_size:
        description: majority = (n/2)+1
        type: integer
    type: object
  internal_cluster.NodeStatus:
    properties:
      cert_deps_distance:
        description: avg distance between causal deps
        type: number
      checked_at:
        description: Timestamp
        type: string
      cluster_size:
        description: Cluster membership
        type: integer
      cluster_status:
        description: '"Primary", "Non-primary", "Disconnected"'
        type: string
      connected:
        description: wsrep_connected = ON
        type: boolean
      flow_control_paused:
        description: 0.0-1.0, fraction of time paused
        type: number
      healthy:
        description: Health assessment
        type: boolean
      hub_url:
        type: string
      last_committed:
        description: Counters
        type: integer
      node_address:
        type: string
      node_name:
        description: Identity
        type: string
      problems:
        items:
          type: string
        type: array
      ready:
        description: Node state
        type: boolean
      received:
        description: total writesets received
        type: integer
      recv_queue:
        description: Performance
        type: integer
      replicated:
        description: total writesets replicated (sent)
        type: integer
      send_queue:
        description: local send queue size
        type: integer
      state_comment:
        description: '"Synced", "Donor/Desynced", "Joined", "Initialized"'
        type: string
      state_uuid:
        type: string
    type: object
  internal_cluster.RemediationAction:
    properties:
      dangerous:
        type: boolean
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  internal_codec.CodecInfo:
    properties:
      name:
        type: string
    type: object
  internal_email.ContactInfo:
    properties:
      created_at:
        type: string
      email:
        type: string
      key_id:
        type: string
      name:
        type: string
    type: object
  internal_email.addContactRequest:
    properties:
      armored_key:
        type: string
      email:
        type: string
    type: object
  internal_hawkbit.ActionStatus:
    properties:
      id:
        type: integer
      status:
        description: '"finished", "running", "error", "canceled"'
        type: string
      type:
        description: '"update", "cancel"'
        type: string
    type: object
  internal_hawkbit.Rollout:
    properties:
      amountGroups:
        type: integer
      distributionSetId:
        type: integer
      id:
        type: integer
      name:
        type: string
      status:
        description: '"creating", "ready", "running", "paused", "finished"'
        type: string
      targetFilterQuery:
        type: string
      totalTargets:
        type: integer
    type: object
  internal_hawkbit.Target:
    properties:
      controllerId:
        type: string
      description:
        type: string
      ipAddress:
        type: string
      lastControllerRequestAt:
        type: string
      name:
        type: string
      updateStatus:
        description: '"registered", "in_sync", "pending", "error"'
        type: string
    type: object
  internal_health.Response:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
  internal_ipougrs.Config:
    properties:
      compress:
        description: Compress enables DEFLATE compression of IP packets before framing.
        type: boolean
      device_name:
        description: DeviceName is the TUN device name (e.g., "tun-ugrs0").
        type: string
      enabled:
        description: 'Enabled activates the tunnel. Default: false (experimental).'
        type: boolean
      frag_timeout:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: |-
          FragTimeout is how long to wait for all fragments of a packet before
          discarding incomplete reassemblies.
      hub_address:
        description: HubAddress is the Hub's IP within the tunnel subnet.
        type: string
      mtu:
        description: MTU is the IP-level MTU for the TUN device (not SBD MTU).
        type: integer
      sbd_mtu:
        description: |-
          SBDMTU is the maximum SBD payload size per frame. Iridium MT = 270,
          MO = 340. Uses the smaller value (MT) by default for bidirectional safety.
        type: integer
      tunnel_subnet:
        description: TunnelSubnet is the CIDR for the tunnel network.
        type: string
    type: object
  internal_ipougrs.Stats:
    properties:
      bytes_rx:
        type: integer
      bytes_tx:
        type: integer
      fragments_rx:
        type: integer
      fragments_tx:
        type: integer
      packets_rx:
        type: integer
      packets_tx:
        type: integer
      reassembly_err:
