    put:
      consumes:
      - application/json
      description: Changes the strategy used for managing multiple network paths.
        "aggregate" uses all paths simultaneously for maximum throughput. "failover"
        uses the primary path and promotes a backup if the primary degrades. "redundant"
        sends traffic on all paths for maximum reliability.
