        type: string
      role:
        type: string
    type: object
  internal_api.routeTableResponse:
    properties:
      count:
        type: integer
      routes:
        items:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_reticulum.RouteInfo'
        type: array
    type: object
  internal_api.sendMessageRequest:
    properties:
      compress:
        description: 'SMAZ2 compress before sending (default: true)'
        type: boolean
      encrypt:
        description: 'AES-256-GCM encrypt with device key (default: true if key exists)'
        type: boolean
      imt_topic:
        description: 'IMT only: PURPLE/PINK/RED/ORANGE/YELLOW/RAW'
        type: string
      priority:
        description: '>=9 bypasses per-device rate limiting (SOS)'
        type: integer
      ring_style:
        description: 'IMT only: NORMAL/URGENT/EXTENDED'
        type: string
      scheduled_at:
        description: RFC3339 timestamp for future delivery (empty = send now)
        type: string
      text:
        type: string
    type: object
  internal_api.sendSMSRequest:
    properties:
      compress:
        description: SMAZ2 compress (default false for SMS — human-readable)
        type: boolean
      encrypt:
        description: AES-256-GCM encrypt (base64-encoded in SMS body)
        type: boolean
      text:
        type: string
      to:
        description: E.164 phone number
        type: string
    type: object
  internal_api.snoozeRequest:
    properties:
      duration_min:
        type: integer
    type: object
  internal_api.takStatusResponse:
    properties:
      enabled:
        description: Enabled is whether this tenant has a server at all.
        type: boolean
      limit:
        description: -1 when the plan has no ceiling
        type: integer
      phase:
        description: |-
          Phase is the operator's own word for where it has got to: Provisioning,
          Ready, Failed and so on.
        type: string
      plan:
        type: string
      port:
        description: |-
          Port is the public TAK SSL port. There is deliberately no host here: the
          instance's address is an in-cluster service name that no phone can reach,
          and publishing it would tell a customer something both useless and internal.
          A phone is configured from its enrollment package, not from this.
        type: integer
      remaining:
        description: -1 when unlimited
        type: integer
      users:
        description: Users is the account meter.
        type: integer
    type: object
  internal_api.takUserResponse:
    properties:
      active:
        type: boolean
      callsign:
        type: string
      cert_serial:
        description: |-
          CertSerial is present once a phone has enrolled. The enrollment token hash
          is never here: store.TAKUser marks it json:"-" and it is in
          store.RedactedInExport for the same reason.
        type: string
      username:
        type: string
    type: object
  internal_api.tenantResponse:
    properties:
      audit_retention_days:
        description: |-
          AuditRetentionDays is the tenant's own choice in days, 0 meaning the
          platform default, which AuditRetentionDefault carries.
        type: integer
      audit_retention_default:
        type: integer
      audit_retention_max:
        type: integer
      audit_retention_min:
        type: integer
      bridge_offline_timeout:
        description: |-
          BridgeOfflineTimeout is the tenant's own choice in seconds, or 0 meaning
          "use the platform default" -- which BridgeOfflineTimeoutDefault carries,
          so the UI can show the number that is actually in force instead of
          hardcoding one that can drift from the ConfigMap.
        type: integer
      bridge_offline_timeout_default:
        type: integer
      bridge_offline_timeout_max:
        type: integer
      bridge_offline_timeout_min:
        type: integer
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      oob_max_per_hour:
        description: |-
          Out-of-band command policy: this tenant's own choices, 0 meaning the
          platform default, with that default and the bounds alongside so the form
          shows the number actually in force (MESHSAT-1121).
        type: integer
      oob_max_per_hour_default:
        type: integer
      oob_max_per_hour_max:
        type: integer
      oob_max_per_hour_min:
        type: integer
      oob_sat_timeout_default:
        type: integer
      oob_sat_timeout_sec:
        type: integer
      oob_sms_timeout_default:
        type: integer
      oob_sms_timeout_sec:
        type: integer
      oob_timeout_max:
        type: integer
      oob_timeout_min:
        type: integer
      owner_user_id:
        type: string
      plan:
        type: string
      purge_grace_days:
        description: |-
          PurgeGraceDays is how long a closed account can still be recovered. The
          close dialog quotes it to the customer, and a number the UI hardcoded
          would be one refactor away from disagreeing with what actually happens.
        type: integer
      ratelimit_daily_cap:
        description: |-
          The per-device send budget: how many messages the Hub will send to ONE
          of this tenant's devices per UTC day and per month (SOS is never
          counted). 0 is "the platform default". The airtime is the tenant's own
          carrier account, so the owner sets this, above or below the default; a
          monthly default of 0 means no monthly limit.
        type: integer
      ratelimit_daily_default:
        type: integer
      ratelimit_daily_max:
        type: integer
      ratelimit_monthly_cap:
        type: integer
      ratelimit_monthly_default:
        type: integer
      ratelimit_monthly_max:
        type: integer
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  internal_api.tierResponse:
    properties:
      current:
        type: boolean
      devices:
        description: -1 = no ceiling
        type: integer
      plan:
        type: string
    type: object
  internal_api.topologyHub:
    properties:
      app_name:
        type: string
      dest_hash:
        type: string
      role:
        type: string
    type: object
  internal_api.topologyResponse:
    properties:
      hints_published:
        type: integer
      hub:
        $ref: '#/definitions/internal_api.topologyHub'
      interfaces:
        items:
          $ref: '#/definitions/internal_api.relayInterfaceInfo'
        type: array
      path_stats:
        $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_reticulum.PathHandlerStatsSnapshot'
      relay_stats:
        $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_reticulum.RelayStatsSnapshot'
      routes:
        items:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_reticulum.RouteInfo'
        type: array
    type: object
  internal_api.triggerAlertRequest:
    properties:
      chain_id:
        type: string
      detail:
        type: string
      device_imei:
        type: string
      type:
        type: string
    type: object
  internal_api.unmatchedPaymentResponse:
    properties:
      payment:
        items:
          type: integer
        type: array
      recorded_at:
        type: string
    type: object
  internal_api.updateBondGroupRequest:
    properties:
      cost_budget:
        type: number
      label:
        type: string
      members:
        items:
          type: string
        type: array
    type: object
  internal_api.updateTemplateRequest:
    properties:
      body:
        type: string
      name:
        type: string
    type: object
  internal_api.updateTenantRequest:
    properties:
      audit_retention_days:
        description: |-
          AuditRetentionDays, same pointer semantics: absent leaves it alone,
          0 returns the tenant to the platform default.
        type: integer
      bridge_offline_timeout:
        description: |-
          BridgeOfflineTimeout is a pointer so the three cases stay
          distinguishable: absent leaves the setting alone, 0 returns the tenant to
          the platform default, and a number sets it. A plain int would make every
          name change silently reset the timeout to the default.
        type: integer
      name:
        type: string
      oob_max_per_hour:
        description: |-
          Out-of-band command policy, same pointer semantics throughout: absent
          leaves it alone, 0 returns the tenant to the platform default. Owner
          editable, unlike the send caps -- these are the tenant's OWN kit on the
          tenant's OWN airtime, not a commercial lever (MESHSAT-1121).
        type: integer
      oob_sat_timeout_sec:
        type: integer
      oob_sms_timeout_sec:
        type: integer
      ratelimit_daily_cap:
        description: |-
          RatelimitDailyCap and RatelimitMonthlyCap are this tenant's per-device
          send budget, set by its owner (owner ruling, 21 Sep 2026: every tenant
          pays its own carrier for these messages, so the limit on them is the
          tenant's to choose). Same pointer semantics: absent leaves it alone, 0
          returns to the platform default.
        type: integer
      ratelimit_monthly_cap:
        type: integer
    type: object
  internal_api.updateUserRequest:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      password:
        description: optional — only set if changing
        type: string
      role:
        type: string
    type: object
  internal_api.usageResponse:
    properties:
      billing:
        allOf:
        - $ref: '#/definitions/internal_api.billingState'
        description: |-
          Billing reports whether this tenant can start a checkout and whether it
          has anything to manage. The claim code it replaces is gone: a payment is
          bound to a tenant by the metadata on its Checkout session now, not by
          somebody typing a code into a message box (MESHSAT-1023).
      bridges:
        type: integer
      devices:
        type: integer
      limit:
        description: -1 when the plan has no ceiling
        type: integer
      over_limit:
        type: boolean
      plan:
        type: string
      remaining:
        description: -1 when unlimited; never negative otherwise
        type: integer
      tiers:
        items:
          $ref: '#/definitions/internal_api.tierResponse'
        type: array
      upgrade_url:
        description: |-
          UpgradeURL is where a person goes to pay, for as long as the old
          provider is still the one taking money. It is empty once checkout starts
          inside the Hub, and the UI shows a Subscribe button instead.
        type: string
      used:
        description: devices + bridges
        type: integer
    type: object
  internal_api.userResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_login_at:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  internal_api.vatThresholdResponse:
    properties:
      by_country:
        additionalProperties:
          format: int64
          type: integer
        type: object
      cross_border_cents:
        description: |-
          CrossBorderCents is the gross of issued receipts to EU consumers OUTSIDE
          the Netherlands this calendar year. Domestic sales are excluded: the
          threshold is about supplies to other member states, and counting our own
          would raise a false alarm on the busiest possible month.
        type: integer
      note:
        description: |-
          Note says in words what the number means, because the person reading it
          at 80% needs to know what to do, not just that a bar is filling.
        type: string
      percent_used:
        type: number
      refunded_cents:
        description: |-
          RefundedCents is what was given back and therefore never supplied. It is
          already subtracted from CrossBorderCents; it is reported separately so a
          person can see why the figure moved down (MESHSAT-1019).
        type: integer
      threshold_cents:
        type: integer
      year:
        type: integer
    type: object
  internal_codec.CodecInfo:
    properties:
      name:
        type: string
    type: object
  internal_email.ContactInfo:
    properties:
      created_at:
        type: string
      email:
        type: string
      key_id:
        type: string
      name:
        type: string
    type: object
  internal_email.addContactRequest:
    properties:
      armored_key:
        type: string
      email:
        type: string
    type: object
  internal_email.testEmailRequest:
    properties:
      body:
        type: string
      subject:
        type: string
      to:
        type: string
    type: object
  internal_hawkbit.ActionStatus:
    properties:
      id:
        type: integer
      status:
        description: '"finished", "running", "error", "canceled"'
        type: string
      type:
        description: '"update", "cancel"'
        type: string
    type: object
  internal_hawkbit.Rollout:
    properties:
      amountGroups:
        type: integer
      distributionSetId:
        type: integer
      id:
        type: integer
      name:
        type: string
      status:
        description: '"creating", "ready", "running", "paused", "finished"'
        type: string
      targetFilterQuery:
        type: string
      totalTargets:
        type: integer
    type: object
  internal_hawkbit.Target:
    properties:
      controllerId:
        type: string
      description:
        type: string
      ipAddress:
        type: string
      lastControllerRequestAt:
        type: string
      name:
        type: string
      updateStatus:
        description: '"registered", "in_sync", "pending", "error"'
        type: string
    type: object
  internal_health.CheckResult:
    properties:
      detail:
        additionalProperties: {}
        type: object
      latency_ms:
        type: integer
      status:
        type: string
    type: object
  internal_health.Response:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/internal_health.CheckResult'
        type: object
      info:
        additionalProperties:
          $ref: '#/definitions/internal_health.CheckResult'
        type: object
      status:
        type: string
    type: object
  internal_ipougrs.Config:
    properties:
      compress:
        description: Compress enables DEFLATE compression of IP packets before framing.
        type: boolean
      device_name:
        description: DeviceName is the TUN device name (e.g., "tun-ugrs0").
        type: string
      enabled:
        description: 'Enabled activates the tunnel. Default: false (experimental).'
        type: boolean
      frag_timeout:
        allOf:
        - $ref: '#/definitions/time.Duration'
        description: |-
          FragTimeout is how long to wait for all fragments of a packet before
          discarding incomplete reassemblies.
      hub_address:
        description: HubAddress is the Hub's IP within the tunnel subnet.
        type: string
      mtu:
        description: MTU is the IP-level MTU for the TUN device (not SBD MTU).
        type: integer
      sbd_mtu:
        description: |-
          SBDMTU is the maximum SBD payload size per frame. Iridium MT = 270,
          MO = 340. Uses the smaller value (MT) by default for bidirectional safety.
        type: integer
      tunnel_subnet:
        description: TunnelSubnet is the CIDR for the tunnel network.
        type: string
    type: object
  internal_ipougrs.Stats:
    properties:
      bytes_rx:
        type: integer
      bytes_tx:
        type: integer
      fragments_rx:
        type: integer
      fragments_tx:
        type: integer
      packets_rx:
        type: integer
      packets_tx:
        type: integer
      reassembly_err:
        type: integer
      reassembly_ok:
        type: integer
    type: object
  internal_ipougrs.StatusResponse:
    properties:
      config:
        $ref: '#/definitions/internal_ipougrs.Config'
      experimental:
        type: boolean
      stats:
        $ref: '#/definitions/internal_ipougrs.Stats'
    type: object
  internal_mptcp.Endpoint:
    properties:
      address:
        type: string
      backup:
        type: boolean
      interface:
        type: string
      signal:
        type: boolean
      subflow:
        type: boolean
    type: object
  internal_mptcp.Status:
    properties:
      available:
        description: kernel supports MPTCP
        type: boolean
      enabled:
        type: boolean
      strategy:
        description: '"aggregate", "failover", "redundant"'
        type: string
      subflows:
        items:
          $ref: '#/definitions/internal_mptcp.Subflow'
        type: array
      updated_at:
        type: string
    type: object
  internal_mptcp.Subflow:
    properties:
      bytes_recv:
        type: integer
      bytes_sent:
        type: integer
      id:
        type: string
      interface:
        type: string
      last_seen:
        type: string
      local_addr:
        type: string
      path_type:
        description: '"satellite", "cellular", "wifi", "ethernet"'
        type: string
      remote_addr:
        type: string
      rtt_ms:
        type: integer
      status:
        description: '"active", "backup", "degraded", "down"'
        type: string
    type: object
  internal_ratelimit.DeviceUsage:
    properties:
      daily_cap:
        type: integer
      daily_sent:
        type: integer
      device_id:
        type: string
      last_send:
        type: string
      max_tokens:
        type: number
      monthly_cap:
        type: integer
      monthly_sent:
        type: integer
      override_until:
        type: string
      throttled:
        type: boolean
      tokens_left:
        type: number
    type: object
  internal_routing.createRouteRequest:
    properties:
      destination_type:
        type: string
      enabled:
        type: boolean
      filter:
        type: string
      name:
        type: string
      senders:
        description: comma-separated origins; empty = any (MESHSAT-964)
        type: string
      source_type:
        type: string
    type: object
  internal_routing.testRouteRequest:
    properties:
      channel:
        type: string
      device_id:
        type: string
      text:
        type: string
    type: object
  internal_routing.testRouteResult:
    properties:
      destination_type:
        type: string
      matched:
        type: boolean
      route_id:
        type: string
      route_name:
        type: string
    type: object
  internal_tor.OnionInfo:
    properties:
      available:
        type: boolean
      http_address:
        description: e.g., "abc123...xyz.onion"
        type: string
      mqtt_address:
        description: same .onion, different port
        type: string
    type: object
  internal_webhook.DeliveryLog:
    properties:
      attempt:
        type: integer
      device_id:
        type: string
      error:
        type: string
      event:
        type: string
      latency_ms:
        description: |-
          LatencyMS is how long the attempt took. The Delivery Logs table has had a
          Latency column since it was written and nothing ever measured one, so
          every row rendered "undefinedms".
        type: integer
      status_code:
        type: integer
      timestamp:
        type: string
      webhook_id:
        type: string
    type: object
  internal_webhook.EventType:
    enum:
    - mo
    - sos
    - position
    - telemetry
    - mt_status
    type: string
    x-enum-comments:
      EventMO: Mobile Originated message received
      EventMTStatus: MT delivery status change
      EventPosition: Position update
      EventSOS: SOS event
      EventTelemetry: Telemetry data
    x-enum-descriptions:
    - Mobile Originated message received
    - SOS event
    - Position update
    - Telemetry data
    - MT delivery status change
    x-enum-varnames:
    - EventMO
    - EventSOS
    - EventPosition
    - EventTelemetry
    - EventMTStatus
  internal_webhook.WebhookConfig:
    properties:
      enabled:
        type: boolean
      events:
        description: which events to fire for
        items:
          $ref: '#/definitions/internal_webhook.EventType'
        type: array
      id:
        type: string
      max_retries:
        description: default 3
        type: integer
      secret:
        description: HMAC-SHA256 signing secret
        type: string
      tenant_id:
        description: |-
          TenantID is the tenant that owns this webhook and the ONLY tenant whose
          events it may receive (MESHSAT-1118). It is set from the caller's session
          in CreateWebhook and is never read from a request body -- see the
          overwrite in handler.go and the test that pins it.
        type: string
      timeout_sec:
        description: default 10
        type: integer
      url:
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
host: localhost:6070
info:
  contact: {}
  description: Multi-tenant SaaS platform for satellite device management. Ingests
    MO messages from Iridium/Globalstar, manages devices, SOS escalation, dead man's
    switch, and E2E encryption.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: MeshSat Hub API
  version: "1.1"
paths:
  /api/admin/payments/unmatched:
    get:
      parameters:
      - default: 50
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.unmatchedPaymentResponse'
            type: array
      summary: Payments that matched no tenant
      tags:
      - admin
  /api/admin/receipts/{id}/refund:
    post:
      consumes:
      - application/json
      parameters:
      - description: Receipt ID
        in: path
        name: id
        required: true
        type: string
      - description: Refund
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.recordRefundRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.Refund'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record a refund against a payment
      tags:
      - admin
  /api/admin/receipts/{id}/requeue:
    post:
      parameters:
      - description: Receipt ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Retry a blocked receipt
      tags:
      - admin
  /api/admin/receipts/blocked:
    get:
      parameters:
      - default: 100
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.Receipt'
            type: array
      summary: Receipts a person has to look at
      tags:
      - admin
  /api/admin/refunds:
    get:
      parameters:
      - default: pending
        description: pending, issued or blocked
        in: query
        name: status
        type: string
      - default: 100
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.Refund'
            type: array
      summary: Refunds by state
      tags:
      - admin
  /api/admin/refunds/{id}:
    delete:
      parameters:
      - description: Refund ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Withdraw a refund that has no credit note yet
      tags:
      - admin
  /api/admin/refunds/{id}/requeue:
    post:
      parameters:
      - description: Refund ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Retry a blocked refund
      tags:
      - admin
  /api/admin/signups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
