      id:
        type: string
      interface:
        type: string
      last_seen:
        type: string
      local_addr:
        type: string
      path_type:
        description: '"satellite", "cellular", "wifi", "ethernet"'
        type: string
      remote_addr:
        type: string
      rtt_ms:
        type: integer
      status:
        description: '"active", "backup", "degraded", "down"'
        type: string
    type: object
  internal_ratelimit.DeviceUsage:
    properties:
      daily_cap:
