    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - '[MESHSAT-538] mirrors bridge-side v45'
    x-enum-varnames:
    - KindSMS
    - KindMeshtastic
    - KindAPRS
    - KindIridiumSBD
    - KindIridiumIMT
    - KindCellular
    - KindTAK
    - KindReticulum
    - KindZigbee
    - KindBLE
    - KindWebhook
    - KindEmail
    - KindMQTT
