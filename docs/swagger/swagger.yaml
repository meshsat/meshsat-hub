        type: string
      comment:
        description: change description
        type: string
      config:
        description: JSON-encoded configuration
        type: string
      created_at:
        type: string
      device_imei:
        type: string
      id:
        type: string
      version:
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_store.DeviceGroup:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.DeviceKey:
    properties:
      created_at:
        type: string
      device_imei:
        type: string
      id:
        type: string
