      responses:
        "200":
          description: PEM
          schema:
            type: string
        "404":
          description: no bridge CA on this Hub
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bridge CA certificate for the relay
      tags:
      - relay
  /api/relay/connect/{bridge_id}:
    get:
      description: The caller is itself a bridge of the tenant (an Android device
        is a bridge of type android) and authenticates with its own MQTT credentials;
        its bridge id is the client id on the other end, never a parameter. The target
        must belong to the same tenant. Bare binary frames, 100 per minute per client.
      parameters:
      - description: the bridge to reach
        in: path
        name: bridge_id
        required: true
        type: string
      responses:
        "101":
          description: switching protocols
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: not a bridge of your tenant
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: budget exhausted for this minute
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BasicAuth: []
      summary: Open a tunnel to one of your tenant's bridges (WebSocket)
      tags:
      - relay
  /api/relay/serve:
    get:
      description: The bridge opens one outbound WebSocket and every client of it
        is multiplexed through the envelope [0x01][len][client_id][payload]. HTTP
        Basic with the bridge's own MQTT credentials. Binary frames only; the Hub
        never reads the payload.
      responses:
        "101":
          description: switching protocols
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BasicAuth: []
      summary: Serve this bridge's clients through the Hub (WebSocket)
      tags:
      - relay
