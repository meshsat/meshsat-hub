        description: ECDSA-P256-SHA256 over canonical(payload)
        items:
          type: integer
        type: array
      signed_at:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_directory.Strategy:
