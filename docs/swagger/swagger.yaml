    x-enum-varnames:
    - OriginLocal
    - OriginHub
    - OriginImported
    - OriginQR
  github_com_meshsat_meshsat-hub_internal_directory.Snapshot:
    properties:
      contacts:
        items:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_directory.Contact'
        type: array
      etag:
