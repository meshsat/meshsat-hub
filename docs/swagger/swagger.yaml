      daily_sent:
        type: integer
      device_id:
        type: string
      last_send:
        type: string
      max_tokens:
        type: number
      monthly_cap:
        type: integer
      monthly_sent:
        type: integer
      override_until:
        type: string
      throttled:
        type: boolean
      tokens_left:
        type: number
    type: object
  internal_routing.createRouteRequest:
    properties:
      destination_type:
        type: string
      enabled:
        type: boolean
      filter:
        type: string
      name:
        type: string
      source_type:
        type: string
    type: object
  internal_routing.testRouteRequest:
    properties:
      channel:
        type: string
      device_id:
        type: string
      text:
        type: string
    type: object
  internal_routing.testRouteResult:
    properties:
      destination_type:
        type: string
      matched:
        type: boolean
      route_id:
        type: string
      route_name:
        type: string
    type: object
  internal_tor.OnionInfo:
    properties:
      available:
        type: boolean
      http_address:
        description: e.g., "abc123...xyz.onion"
        type: string
      mqtt_address:
        description: same .onion, different port
        type: string
    type: object
  internal_webhook.DeliveryLog:
    properties:
      attempt:
        type: integer
      device_id:
        type: string
      error:
        type: string
      event:
        type: string
      status_code:
        type: integer
      timestamp:
        type: string
      webhook_id:
        type: string
    type: object
  internal_webhook.EventType:
    enum:
    - mo
    - sos
    - position
    - telemetry
    - mt_status
    type: string
    x-enum-comments:
      EventMO: Mobile Originated message received
      EventMTStatus: MT delivery status change
      EventPosition: Position update
      EventSOS: SOS event
      EventTelemetry: Telemetry data
    x-enum-descriptions:
    - Mobile Originated message received
    - SOS event
    - Position update
    - Telemetry data
    - MT delivery status change
    x-enum-varnames:
    - EventMO
    - EventSOS
    - EventPosition
    - EventTelemetry
    - EventMTStatus
  internal_webhook.WebhookConfig:
    properties:
      enabled:
        type: boolean
      events:
        description: which events to fire for
        items:
          $ref: '#/definitions/internal_webhook.EventType'
        type: array
      id:
        type: string
      max_retries:
        description: default 3
        type: integer
      secret:
        description: HMAC-SHA256 signing secret
        type: string
      timeout_sec:
        description: default 10
        type: integer
      url:
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
    - minDuration
    - maxDuration
