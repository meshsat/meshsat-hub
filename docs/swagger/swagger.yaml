      bridge_id:
        type: string
      capabilities:
        description: JSON array
        type: string
      cert_expiry:
        type: string
      cert_pem:
        type: string
      cot_callsign:
        type: string
      cot_type:
        type: string
      created_at:
        type: string
      hostname:
        type: string
      label:
        type: string
      last_birth:
        description: JSON
        type: string
      last_health:
        description: JSON
        type: string
      last_report_at:
        type: string
      last_report_bearer:
        description: |-
          Last report received over any bearer (mqtt, sms, sbd, imt, globalstar)
          and when: uplink frames while MQTT is down keep these current (MESHSAT-964).
        type: string
      last_seen:
        type: string
      location_alt:
        type: number
      location_lat:
        type: number
      location_lon:
        type: number
      mode:
        type: string
      mqtt_username:
        type: string
      online:
        type: boolean
      reticulum_hash:
        type: string
      reticulum_pubkey:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      version:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.BridgeUpdate:
    properties:
