  github_com_meshsat_meshsat-hub_internal_store.DeviceWireguard:
    properties:
      created_at:
        type: string
      device_imei:
        type: string
      peer_id:
        description: wg-easy peer ID
        type: string
      public_key:
        type: string
      vpn_address:
        description: allocated VPN IP (e.g. "10.8.0.5/32")
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.EscalationChain:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      tiers:
        items:
          $ref: '#/definitions/github_com_meshsat_meshsat-hub_internal_store.EscalationTier'
        type: array
      updated_at:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.EscalationTier:
    properties:
      max_retries:
        description: max delivery retries within this tier
        type: integer
      name:
        description: e.g. "sms_oncall", "email_team", "page_manager"
        type: string
      targets:
        description: notification targets (URLs, emails, phone numbers)
        items:
          type: string
        type: array
      wait_sec:
        description: seconds to wait before escalating to next tier
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_store.Message:
    properties:
      channel:
        description: '"iridium", "globalstar"'
        type: string
      compressed:
        type: boolean
      created_at:
        type: string
      device_imei:
        type: string
      direction:
        description: '"mo" or "mt"'
        type: string
      error:
        type: string
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      momsn:
        type: integer
      raw_hex:
        type: string
      scheduled_at:
        type: string
      status:
        description: '"received", "queued", "sent", "delivered", "failed", "scheduled"'
        type: string
      tenant_id:
        description: |-
          TenantID is set on rows read by platform-wide jobs (ListScheduledMessages),
          which have no tenant of their own and must hand the row's tenant back to
          the store when they update it (MESHSAT-1149). Tenant-scoped reads leave
          it empty: the caller already knows.
        type: string
      text:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.MessageTemplate:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      variables:
        items:
          type: string
        type: array
    type: object
  github_com_meshsat_meshsat-hub_internal_store.NotificationPref:
    properties:
      created_at:
        type: string
      device_imei:
        description: device IMEI or "*" for tenant-wide default
        type: string
      enabled:
        description: toggle notifications without deleting config
        type: boolean
      events:
        description: 'event types to notify on: "sos", "deadman", "geofence", "mo",
          "mt_status"'
        items:
          type: string
        type: array
      id:
        type: string
      updated_at:
        type: string
      urls:
        description: Apprise notification URLs (e.g., "slack://token", "mailto://...")
        items:
          type: string
        type: array
    type: object
