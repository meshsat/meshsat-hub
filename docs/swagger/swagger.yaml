      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete outbound webhook
      tags:
      - webhooks
  /api/webhooks/logs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_webhook.DeliveryLog'
            type: array
      summary: Get recent webhook delivery logs
      tags:
      - webhooks
  /api/wireguard/peers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List WireGuard peers
      tags:
      - wireguard
    post:
      consumes:
      - application/json
      parameters:
      - description: Peer name
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create WireGuard peer
      tags:
      - wireguard
  /api/wireguard/peers/{id}:
    delete:
      parameters:
      - description: Peer ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete WireGuard peer
      tags:
      - wireguard
  /api/wireguard/peers/{id}/config:
    get:
      parameters:
      - description: Peer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get WireGuard peer config
      tags:
      - wireguard
  /api/ws:
    get:
      description: Real-time stream of this tenant's messages, positions and alerts.
        Browsers pass the token as the Sec-WebSocket-Protocol "bearer, <token>"; other
        clients may use the Authorization header or ?token=.
      parameters:
      - description: Auth token (JWT or API key)
        in: query
        name: token
        type: string
      responses: {}
      summary: WebSocket event stream
      tags:
      - websocket
  /basemap/assets/{path}:
    get:
      description: Streams the self-hosted map font ranges and sprite sheets. Public
        map data, no authentication.
      parameters:
      - description: Relative asset path, e.g. fonts/Noto Sans Regular/0-255.pbf
        in: path
        name: path
        required: true
        type: string
      responses:
        "200":
          description: Asset
          schema:
            type: file
        "404":
          description: Unknown or malformed asset path
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Basemap glyph and sprite assets
      tags:
      - map
  /basemap/basemap.pmtiles:
    get:
      description: Streams the self-hosted PMTiles basemap, forwarding HTTP range
        requests. Public map data, no authentication.
      parameters:
      - description: Byte range, e.g. bytes=0-16383
        in: header
        name: Range
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Whole archive
          schema:
            type: file
        "206":
          description: Requested byte range
          schema:
            type: file
        "404":
          description: Basemap object missing from the store
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Object store unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Vector basemap archive
      tags:
      - map
  /basemap/local.pmtiles:
    get:
      description: Streams the deeper PMTiles archive for the area the fleet operates
        in, forwarding HTTP range requests. Public map data, no authentication.
      parameters:
      - description: Byte range, e.g. bytes=0-16383
        in: header
        name: Range
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Whole archive
          schema:
            type: file
        "206":
          description: Requested byte range
          schema:
            type: file
        "404":
          description: No local archive configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Local vector basemap archive
      tags:
      - map
  /donate:
    get:
      description: Creates a Stripe Checkout session for an anonymous donation and
        redirects to it. For linking from a static page.
      responses:
        "303":
          description: redirect to Stripe Checkout
        "503":
          description: donations are not available
          schema:
            type: string
      summary: Donate without an account
      tags:
      - billing
  /donate/cancelled:
    get:
      description: The page Stripe returns an anonymous giver to after they abandon
        a donation.
      produces:
      - text/html
      responses:
        "200":
          description: cancelled page
          schema:
            type: string
      summary: Donation cancelled
      tags:
      - billing
  /donate/thanks:
    get:
      description: The page Stripe returns an anonymous giver to after a successful
        donation.
      produces:
      - text/html
      responses:
        "200":
          description: thank-you page
          schema:
            type: string
      summary: Donation complete
      tags:
      - billing
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_health.Response'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      parameters:
      - description: Include informational dependencies (1)
        in: query
        name: verbose
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_health.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_health.Response'
      summary: Readiness probe
      tags:
      - health
  /startupz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_health.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_health.Response'
      summary: Startup probe
      tags:
      - health
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
