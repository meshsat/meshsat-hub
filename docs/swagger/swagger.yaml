      no_route:
        type: integer
      requests_received:
        type: integer
      responses_sent:
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_reticulum.RelayStatsSnapshot:
    properties:
      dropped:
        type: integer
      forwarded:
        type: integer
      no_route:
        type: integer
      rate_limited:
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_reticulum.RouteInfo:
    properties:
      app_data:
        type: string
      cost:
        type: number
      dest_hash:
        type: string
      expires_at:
        type: string
      hops:
        type: integer
      interface:
        type: string
      last_seen:
        type: string
      signing_pub_hex:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.APIKey:
    properties:
      created_at:
        type: string
      device_imei:
        description: 'optional: scope to specific device'
        type: string
      expires_at:
        type: string
      id:
        type: string
      key_prefix:
        description: first 8 chars for display (e.g. "meshsat_ab12cd34")
        type: string
      label:
        description: human-readable label
        type: string
      last_used:
        type: string
      platform_admin:
        description: |-
          PlatformAdmin lets this key act across tenants, the axis that until
          MESHSAT-1209 only the static HUB_AUTH_TOKEN could carry. Settable ONLY by a
          caller who already holds it -- see internal/api/apikeys.go. Unlike that token
          a key with this flag is revocable and can expire, which is the entire point.
        type: boolean
      role:
        description: '"viewer", "operator", "owner"'
        type: string
      rotation_days:
        description: auto-rotation period (0=disabled)
        type: integer
    type: object
  github_com_meshsat_meshsat-hub_internal_store.Alert:
    properties:
      acked_at:
        type: string
      acked_by:
        type: string
      chain_id:
        type: string
      created_at:
        type: string
      current_tier:
        description: 0-indexed tier in the chain
        type: integer
      detail:
        description: human-readable description
        type: string
      device_imei:
        type: string
      id:
        type: string
      next_esc_at:
        description: when to escalate to next tier
        type: string
      retries:
        description: retries within current tier
        type: integer
      state:
        description: triggered, escalating, acknowledged, exhausted
        type: string
      tenant_id:
        type: string
      type:
        description: '"sos", "deadman", "geofence", "custom"'
        type: string
      updated_at:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.AlertRule:
    properties:
      chain_id:
        description: escalation chain to trigger
        type: string
      condition_params:
        description: 'JSON: {"threshold_hours":6} or {"threshold_pct":20}'
        type: string
      condition_type:
        description: device_not_seen, battery_low, geofence_breach, message_rate_drop
        type: string
      created_at:
        type: string
      device_filter:
        description: '"*" for all, or specific IMEI, or group ID'
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_evaluated:
        type: string
      name:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.AuditEntry:
    properties:
      action:
        type: string
      actor:
        type: string
      created_at:
        type: string
      detail:
        type: string
      hash:
        description: digest of the entry; which fields it binds is HashVersion's business
        type: string
      hash_version:
        description: |-
          HashVersion names the digest Hash was computed with. 1 is the original
          formula over action|actor|detail|ip|prev_hash, which lets a row be moved
          between tenants or back-dated without breaking the chain; 2 also binds
          tenant_id, id and created_at. Rows written before migration 30 carry 1
          and stay valid; every row written since is 2, and a verifier never
          accepts a 1 that follows a 2 (that would be a downgrade, not history).
        type: integer
      id:
        type: string
      ip:
        type: string
      prev_hash:
        description: SHA-256 hash of the previous entry
        type: string
    type: object
  github_com_meshsat_meshsat-hub_internal_store.BondGroup:
    properties:
      bridge_id:
        type: string
      cost_budget:
        type: number
      created_at:
        type: string
      id:
        type: string
      label:
        type: string
      members:
