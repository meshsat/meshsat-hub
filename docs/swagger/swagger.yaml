host: localhost:6070
info:
  contact: {}
  description: Multi-tenant SaaS platform for satellite device management. Ingests
    MO messages from Iridium/Astrocast, manages devices, SOS escalation, dead man's
    switch, and E2E encryption.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: MeshSat Hub API
  version: "1.1"
paths:
  /api/alerts:
    get:
      parameters:
      - default: false
        description: Only active alerts
        in: query
        name: active
        type: boolean
      - default: 50
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.Alert'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List alerts
      tags:
      - escalation
    post:
      consumes:
      - application/json
      parameters:
      - description: Alert parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.triggerAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.Alert'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger alert
      tags:
      - escalation
  /api/alerts/{id}:
    get:
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.Alert'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get alert
      tags:
      - escalation
  /api/alerts/{id}/ack:
    post:
      consumes:
      - application/json
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      - description: Acknowledger
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.ackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cubeos-app_meshsat-hub_internal_store.Alert'
        "400":
          description: Bad Request
          schema:
