# ZAP Baseline Scan Configuration for MeshSat Hub
# Used by: test/owasp/owasp-scan.sh and CI pipeline (owasp stage)
# Reference: https://www.zaproxy.org/docs/docker/baseline-scan/
#
# Format: rule_id	action	[parameter]
# Actions: IGNORE (skip), WARN (report only), FAIL (block pipeline)

# --- Headers ---
# 10036 = Server header info leak — nginx proxies this; acceptable
10036	WARN
# 10037 = X-Content-Type-Options missing — we set this, FAIL if missing
10037	FAIL
# 10038 = CSP missing — we set this, FAIL if missing
10038	FAIL
# 10063 = Permissions-Policy missing — we set this, FAIL if missing
10063	FAIL
# 10096 = Timestamp disclosure — acceptable for API
10096	IGNORE

# --- TLS ---
# 10011 = Cookie without Secure flag — FAIL (all cookies must be secure)
10011	FAIL
# 10054 = Cookie without SameSite — FAIL
10054	FAIL

# --- Information Disclosure ---
# 10020 = X-Frame-Options — we set DENY, FAIL if missing
10020	FAIL
# 10021 = X-Content-Type-Options — duplicate of 10037
10021	FAIL
# 10049 = Storable cacheable response — WARN for API endpoints
10049	WARN

# --- Injection ---
# 40012 = Cross Site Scripting (Reflected) — FAIL always
40012	FAIL
# 40014 = Cross Site Scripting (Persistent) — FAIL always
40014	FAIL
# 40018 = SQL Injection — FAIL always
40018	FAIL
# 90020 = Remote OS Command Injection — FAIL always
90020	FAIL

# --- Authentication ---
# 10010 = Cookie no HttpOnly flag — FAIL
10010	FAIL
# 10035 = Strict-Transport-Security missing — FAIL on HTTPS targets
10035	FAIL

# --- Misc ---
# 10015 = Incomplete or no cache-control — WARN for API
10015	WARN
# 10098 = Cross-Domain Misconfiguration — WARN
10098	WARN
# 90033 = Loosely scoped cookie — WARN
90033	WARN
