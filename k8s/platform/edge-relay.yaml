# meshsat-edge-relay: hostNetwork TCP relay for the two non-HTTP public legs.
#
# The VPS edge HAProxy passes these SNI hosts through in TCP mode to the worker
# mesh IPs (10.255.{4,5,10}.11), exactly as it did to the DMZ hosts:
#   mqtt-hub.meshsat.net  :9443 -> NATS websocket (TLS + bridge client certs)
#   reticulum.meshsat.net :4243 -> stunnel (TLS + bridge client certs) -> hub:4242
# Cilium's NodePort does not answer traffic entering through the xfrm tunnels
# (see the omoikane edge-relay header), so a hostNetwork listener is required.
# HTTPS reuses omoikane's :8443 leg (ingress-nginx routes by SNI/Host).
# Long-lived bridge sessions: 3600s client/server timeouts (edge uses tunnel 3600s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: meshsat-edge-relay-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-edge-relay
data:
  haproxy.cfg: |
    global
        maxconn 4096
    defaults
        mode tcp
        timeout connect 5s
        timeout client 3600s
        timeout server 3600s
    resolvers kubedns
        parse-resolv-conf
        hold valid 10s
    # Liveness for the kubelet, answered locally. A tcpSocket probe on :9443
    # was accepted by the frontend below and forwarded straight on to NATS,
    # which saw a connection carrying no TLS ClientHello and logged
    # `websocket: TLS handshake error ... EOF` -- once per probe per node, about
    # 24k lines a day across the three members (MESHSAT-1220).
    #
    # Bound to loopback, so this adds no listener to a public-facing node; the
    # kubelet probes a hostNetwork pod from the node itself, and the probes
    # below say `host: 127.0.0.1`. It reports on haproxy itself rather than on
    # a backend, which is the honest signal here: haproxy exits if a bind
    # fails, and readiness gates nothing operationally because the VPS targets
    # the host ports directly and no Service selects this DaemonSet.
    frontend health
        bind 127.0.0.1:8405
        mode http
        monitor-uri /healthz
    frontend mqtt_in
        bind :9443
        default_backend nats_ws
    # Health: the NATS monitor endpoint on :8222 (same Service), not a TCP poke at
    # the TLS listener, which logged a handshake error per check (3 relays x 3s).
    #
    # What is LEFT in the broker log, measured 2026-09-20 after the probe fix
    # above removed the EOF half (MESHSAT-1220): about 8 lines a minute of
    # `websocket: TLS handshake error ... tls: client didn't provide a
    # certificate`, ~11.5k a day, in roughly nine streams each on a 60s cycle.
    # Those are the monitoring TLS probes -- blackbox's `tls_sni_mqtt_hub` by
    # hostname plus the per-edge variants that exist because a dead VPS once hid
    # itself for hours behind a round-robin DNS record. Each is exactly one line
    # per probe per interval, and it is the probe WORKING: it proves the leg
    # terminates TLS with a valid server certificate.
    #
    # Deliberately not "fixed" by issuing the prober a client certificate. That
    # would put a credential the broker accepts on a monitoring host, to quieten
    # a log line. Accepted and written down instead.
    backend nats_ws
        option httpchk GET /healthz
        server nats nats-ws.meshsat-hub.svc.cluster.local:9443 resolvers kubedns init-addr none check port 8222 inter 10s
    frontend reticulum_in
        bind :4243
        default_backend stunnel
    # stunnel has no health endpoint; a TCP connect every 30s keeps its log quiet enough.
    backend stunnel
        server stunnel stunnel.meshsat-hub.svc.cluster.local:4243 resolvers kubedns init-addr none check inter 30s
    # Hosted TAK (MESHSAT-1037). 9089 in from the VPS, 8089 on to the Hub's own TLS
    # front, which terminates and identifies the tenant from the client
    # certificate's issuer.
    #
    # TCP passthrough, and it has to be: ATAK, iTAK and WinTAK send no SNI on the
    # CoT socket, and TLS encrypts the client certificate, so nothing between the
    # phone and the Hub can tell tenants apart. Terminating here would either serve
    # one tenant or serve the wrong one.
    #
    # This backend reads DOWN until HUB_TAK_FRONT_ENABLED is set and the front has
    # its server certificate. That is correct rather than a fault: the leg is laid
    # down before the feature is switched on, and `show stat` saying DOWN is the
    # honest answer while nothing is listening.
    frontend tak_in
        bind :9089
        default_backend hub_takfront
    backend hub_takfront
        server hub hub.meshsat-hub.svc.cluster.local:8089 resolvers kubedns init-addr none check inter 30s
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: meshsat-edge-relay
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-edge-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: meshsat-edge-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meshsat-edge-relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      # haproxy already ran as its image user (99:99, measured on the pod);
      # declaring it is what lets the restricted profile see it (MESHSAT-1204).
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: haproxy
          image: docker.io/library/haproxy
          # hostNetwork and the three hostPorts are load-bearing and stay: Cilium's
          # NodePort does not answer traffic arriving through the xfrm tunnels, which
          # is why this relay exists at all. Everything ELSE goes (MESHSAT-1204).
          #
          # Checked, not assumed: haproxy binds :9443, :4243 and :9089 -- all above
          # 1024, so no NET_BIND_SERVICE -- and the embedded config declares no
          # `user`, `group` or `chroot`, so no SETUID/SETGID/SYS_CHROOT either. No
          # `usesrc`/transparent binding, so no NET_RAW. That leaves nothing for the
          # capability set to do, and this is the front door for every Hub request.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - containerPort: 9443
              hostPort: 9443
            - containerPort: 4243
              hostPort: 4243
            # 9089, not 8089: the VPS edge listens on the standard TAK port 8089
            # publicly and forwards here. 9443 and 4243 are this DaemonSet's other
            # legs and 8443 belongs to omoikane's relay on the same nodes, so 9089
            # is the free number that keeps the pairing readable.
            - containerPort: 9089
              hostPort: 9089
          # Both probes hit haproxy's own loopback monitor (see the config
          # above). They used to be tcpSocket pokes at :9443 and :4243, which
          # the relay forwarded to NATS and stunnel and which showed up in
          # their logs as failed handshakes (MESHSAT-1220).
          readinessProbe:
            httpGet: {host: 127.0.0.1, path: /healthz, port: 8405}
            periodSeconds: 10
          livenessProbe:
            httpGet: {host: 127.0.0.1, path: /healthz, port: 8405}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {memory: 32Mi, cpu: 50m}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: cfg
              mountPath: /usr/local/etc/haproxy
      volumes:
        - name: cfg
          configMap: {name: meshsat-edge-relay-config}
