# *.meshsat.net wildcard for ingress-nginx (hub, auth), NATS websocket and stunnel.
# k8s/shared/wildcard-meshsat-net-tls is written by the NL cert-manager PushSecret
# `push-wildcard-meshsat-net` (infrastructure canonical k8s module, MESHSAT-865):
# Let's Encrypt -> NL cert-manager -> OpenBao -> this ES -> consumers. NATS reloads
# on change (config reloader watches the mounted files); stunnel needs a rollout
# restart (NOTES.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-net-tls
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-net-tls
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-net-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: crt
      remoteRef:
        key: k8s/shared/wildcard-meshsat-net-tls
        property: tls.crt
    - secretKey: key
      remoteRef:
        key: k8s/shared/wildcard-meshsat-net-tls
        property: tls.key
