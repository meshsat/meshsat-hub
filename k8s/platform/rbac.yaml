# What the Hub pod may do in its own namespace:
#   - Leases: leader election (internal/leader/kubelease.go, lease meshsat-hub-leader).
#   - Secret meshsat-bridge-ca: keep the bridge CA certificate current for NATS and
#     stunnel (internal/bridge/casecret.go, get + patch on that one Secret only).
#   - Secret meshsat-nats-auth: the rendered NATS users/permissions file
#     (internal/bridge/natsauth.go), same get + patch pattern.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meshsat-hub
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-hub
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["meshsat-bridge-ca", "meshsat-nats-auth"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meshsat-hub
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: meshsat-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meshsat-hub
subjects:
  - kind: ServiceAccount
    name: meshsat-hub
    namespace: meshsat-hub
