# The three workers are 49, 90 and 92 percent committed by other namespaces
# (omoikane, monitoring, seaweedfs). Without a priority the Hub's data path
# competes on equal terms with tens of gigabytes of other pods when a node dies,
# and a replacement replica can sit Pending exactly when it is needed
# (MESHSAT-711). preemptionPolicy Never buys queue priority only: it never
# evicts another team's workload. If a failure drill shows a Pending Hub pod,
# that is the signal to discuss capacity, or to escalate this to
# PreemptLowerPriority deliberately rather than by surprise.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: meshsat-hub-critical
value: 900000
preemptionPolicy: Never
globalDefault: false
description: "MeshSat Hub data path: hub, nats, keydb, stunnel, edge relay."
---
# Hosted per-tenant TAK, deliberately BELOW the Hub's data path. A customer's
# OpenTAKServer and its database carry control-plane tolerations, so they need a
# priority for the same reason everything else there does — but if the scheduler
# ever has to choose, the Hub's own path wins: an SOS must not queue behind
# somebody's map server. preemptionPolicy Never for the same reason as its
# sibling, it buys queue order and never evicts another team's workload.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: meshsat-tak
value: 800000
preemptionPolicy: Never
globalDefault: false
description: "Hosted per-tenant TAK: OpenTAKServer instances and their Postgres cluster."
