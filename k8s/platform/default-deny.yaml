# DEFAULT-DENY INGRESS (MESHSAT-1205). The last step of CIS 5.3's ingress half.
#
# Every workload in meshsat-hub carries its own CiliumNetworkPolicy allow-list,
# each built from flows Hubble observed. That makes the namespace safe TODAY, but
# only by remembering: the next workload added is reachable by every pod in the
# cluster until someone writes a policy for it, and nothing fails to remind them.
# This inverts the default.
#
# ── WHY THIS IS A KUBERNETES NetworkPolicy AND NOT A CiliumNetworkPolicy ──
#
# Two CiliumNetworkPolicy attempts at this were shipped and BOTH did nothing.
# Measured each time by creating a pod with a label no policy mentions and dialling
# it from an unrelated pod:
#
#   1. endpointSelector: {} + ingress: []            -> newcomer REACHABLE
#   2. the same + enableDefaultDeny: {ingress: true} -> newcomer REACHABLE
#
# Cilium turns on default-deny for a direction only when the policy carries RULES
# in that direction, and an empty list is not a rule; `enableDefaultDeny` does not
# rescue it, and the CRD's anyOf schema simultaneously REFUSES a spec with no rule
# section at all ("spec.ingress: Required value"). The plain Kubernetes
# NetworkPolicy says the same thing unambiguously, because `policyTypes` names the
# direction explicitly instead of inferring it:
#
#   3. podSelector: {} + policyTypes: [Ingress]      -> newcomer BLOCKED
#
# A policy whose effect is nothing is worse than no policy, because the scorecard
# counts it. Same shape as a scanner phase that cannot fail and an alert whose
# labels can never match.
#
# ── AND WHY IT DOES NOT BREAK THE WORKLOADS IT SELECTS ──
#
# Also measured, not assumed, because the whole namespace depends on it: Cilium
# feeds Kubernetes NetworkPolicies and CiliumNetworkPolicies into ONE policy
# repository and the permitted set is the UNION. Tested by pointing this exact
# construct at `basemap` alone while its CiliumNetworkPolicy allow stayed in
# place -- basemap continued to serve HTTP 200 through the ingress on every
# request. So a workload with an explicit allow keeps exactly what it had.
#
# ⚠ INGRESS ONLY. Egress is deliberately absent: it carries the CNPG WAL archive
# to nl-s3, the satellite provider callbacks, Twilio, Stripe and the Tor circuit,
# and an egress default-deny that is even slightly wrong stops the backups rather
# than the attacker. That is its own change, with its own drill.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/part-of: meshsat-hub
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Same for the database namespace. postgres-confine already carries the allows;
# this is what protects whatever lands here next.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: meshsat-hub-db
  labels:
    app.kubernetes.io/part-of: meshsat-hub
spec:
  podSelector: {}
  policyTypes:
    - Ingress
