# Hub non-secret config. Values carried over from the NL compose .env capture
# (2026-09-08) where they are not cluster-specific; cluster settings per the
# MESHSAT-864 plan. Secrets and templated URLs live in hub-secrets (ES).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
data:
  HUB_PORT: "6070"
  HUB_MODE: "kubernetes"
  HUB_DB_DRIVER: "postgres"
  HUB_DB_RETRY_MAX_ATTEMPTS: "8"
  HUB_SHUTDOWN_DRAIN_SECONDS: "5"
  HUB_LOG_FORMAT: "json"
  HUB_LOG_LEVEL: "info"
  HUB_MQTT_CLIENT_ID: "meshsat-hub"
  # --- identity: authentik at auth.meshsat.net (MESHSAT-936); issuer exactly as discovery reports it ---
  HUB_AUTH_MODE: "oidc"
  HUB_OIDC_ISSUER_URL: "https://auth.meshsat.net/application/o/meshsat-hub/"
  HUB_OIDC_REDIRECT_URI: "https://hub.meshsat.net/api/auth/oidc/callback"
  HUB_OIDC_SCOPES: "openid profile email meshsat"  # meshsat = groups claim (bootstrap-meshsat.py ScopeMapping)
  HUB_OIDC_GROUPS_CLAIM: "groups"
  HUB_OIDC_ADMIN_GROUP: "meshsat-platform-admin"
  # The password reset flow. It has existed since MESHSAT-978 and been bound to
  # the MeshSat brand, but nothing in the Hub linked to it -- a user who forgot
  # their password had no route to recovery from the login screen.
  HUB_OIDC_RECOVERY_URL: "https://auth.meshsat.net/if/flow/meshsat-recovery/"
  HUB_OIDC_SIGNUP_URL: "https://auth.meshsat.net/if/flow/meshsat-enrollment/"
  # Approving beta requests from the Hub (MESHSAT-978): the identity provider
  # it acts on. HUB_SIGNUP_WEBHOOK_URL used to sit here too, pointing at the
  # n8n workflow that added an approved address to the VPS allowlists; the edge
  # opened at public launch and that list is gone (MESHSAT-995).
  HUB_AUTHENTIK_URL: https://auth.meshsat.net
  # The owner's MeshSat ID attaches to the migrated `default` tenant at first login
  # instead of creating a new one (MR 16); everyone else gets their own tenant.
  HUB_OIDC_BOOTSTRAP_OWNER_EMAIL: "admin@meshsat.net"
  HUB_TENANT_ENFORCE: "true"
  HUB_LOCAL_LOGIN_ENABLED: "false"
  # --- bridges ---
  MESHSAT_MQTT_PUBLIC_URL: "wss://mqtt-hub.meshsat.net:443"
  HUB_BRIDGE_CA_SECRET_NAME: "meshsat-bridge-ca"
  HUB_NATS_AUTH_SECRET_NAME: "meshsat-nats-auth"  # rendered NATS users/permissions (internal/bridge/natsauth.go)
  HUB_RETICULUM_TCP_ENABLED: "true"
  HUB_RETICULUM_TCP_ADDR: ":4242"
  HUB_AUDIT_ARCHIVE_S3_ENDPOINT: "https://nl-s3.nuclearlighters.net"
  HUB_AUDIT_ARCHIVE_S3_BUCKET: "cnpg-meshsat-hub"
  HUB_AUDIT_ARCHIVE_S3_PREFIX: "hub-audit"
  # Self-hosted vector basemap (MESHSAT-967): the archive and its glyph and
  # sprite assets live beside the audit archive in the same bucket, and the Hub
  # streams them at /basemap/. Endpoint, bucket and credentials fall back to the
  # audit archive values. Rebuild with k8s/scripts/basemap/build-basemap.sh.
  # The world archive stops at zoom 11 (major roads and their names) and the
  # regional one carries the Netherlands and Greece to zoom 15, which is where
  # street names live. Those are the two countries the fleet is actually in.
  # Adding a country is one line in k8s/scripts/basemap/fleet-regions.geojson
  # and a rebuild; see build-basemap.sh for the sizes.
  HUB_BASEMAP_S3_KEY: "basemap/protomaps-world-z11-20260907.pmtiles"
  # The deep archive is served by the basemap StatefulSet from its own disks,
  # not from the object store, so the Hub's local key stays empty. See
  # k8s/basemap/ and NOTES.md.
  HUB_BASEMAP_S3_LOCAL_KEY: ""
  HUB_BASEMAP_S3_ASSET_PREFIX: "basemap/assets"
  # --- carried over from the compose .env ---
  HUB_RATELIMIT_BURST: "10"
  HUB_RATELIMIT_DAILY_CAP: "100"
  HUB_RATELIMIT_REFILL_PER_MIN: "1"
  HUB_SMS_ENABLED: "true"
  HUB_CLOUDLOOP_DEVICE_MAP: "300258060902280:OVdRorbmlwqkNBpaVOXnJYPZvxaXpzjL:imt"
  HUB_CLOUDLOOP_MQTT_BROKER: "ssl://mqtt.cloudloop.com:8883"
  # "*" is only honoured together with HUB_CLOUDLOOP_WEBHOOK_TOKEN (ExternalSecret, ?token= in the Cloudloop console URL); without it the webhook rejects every request (MESHSAT-971).
  # Researched 2026-09-09. Cloudloop publishes no egress addresses anywhere in
  # its documentation, and it runs on AWS eu-west-2 (api.cloudloop.com resolves
  # to 18.132.81.144 / 3.8.7.26), so there is no list to put here and an AWS
  # region would not be a control. The tenant's secret in the webhook path is
  # what authenticates a Cloudloop delivery. Ask Ground Control support if you
  # want a real list; if they give one, put it here and the check applies to
  # path-authenticated requests too.
  #
  # RockBLOCK is different and needs no allowlist at all: Ground Control signs
  # every delivery with a key it publishes, and the Hub verifies it
  # (internal/rockblock/jwt.go). For reference, the two addresses its docs say
  # to allow through a firewall are 109.74.196.135 and 212.71.235.32, both
  # Linode UK -- separate infrastructure from Cloudloop's, so they do not
  # transfer.
  HUB_CLOUDLOOP_WEBHOOK_ALLOWED_IPS: "*"
  HUB_APRSIS_ENABLED: "false"
  HUB_WG_ENABLED: "false"
  HUB_HAWKBIT_ENABLED: "false"
  # TAK: OpenTAKServer stays on the DMZ hosts (not part of this migration). The
  # values are the NL compose ones; reachability of 192.168.192.10 from the
  # cluster is verified at rehearsal (NOTES.md). Self-signed OTS certificate.
  HUB_TAK_ENABLED: "true"
  HUB_TAK_HOST: "192.168.192.10"
  HUB_TAK_PORT: "8088"
  HUB_TAK_API_BASE_URL: "http://192.168.192.10:8880"
  HUB_TAK_API_POLL_SEC: "10"
  HUB_TAK_API_INSECURE_TLS: "true"
  # ATAK marker rows the poller registers itself. They are excluded from every
  # tenant's subscription count (nobody bought them, MESHSAT-989); this bounds
  # how many a busy or looping TAK server can create.
  HUB_TAK_API_MAX_DEVICES: "5000"
  HUB_TAK_CALLSIGN_PREFIX: "MESHSAT-HUB"
  HUB_TAK_FEDERATION_ENABLED: "true"
  HUB_TAK_FEDERATION_PEERS: "192.168.15.10:9001"

  # --- public exposure (MESHSAT-995) ---
  # Whose X-Forwarded-For to believe when resolving the client IP for rate
  # limiting. Every hop on our own side of the wire has to be listed or the
  # "client" resolves to one of our own proxies: ingress-nginx (pod network),
  # the edge relay DaemonSet (mesh), and the three VPS HAProxies. Anything not
  # listed is treated as the client, so this list is what makes a per-IP limit
  # mean a per-client limit rather than a per-ingress-pod one.
  HUB_TRUSTED_PROXIES: "10.2.0.0/16,10.255.0.0/16,185.44.82.32/32,185.125.171.172/32,185.121.169.27/32"
  # Per-client budget on the unauthenticated auth endpoints. The OIDC callback
  # makes an outbound token exchange against authentik on every call, so this
  # is what stops an anonymous caller pointing our fan-out at our own IdP.
  HUB_AUTH_RATE_LIMIT_PER_MIN: "30"

  # --- subscription tiers (MESHSAT-989) ---
  # One combined ceiling on registered devices and bridges per tenant. It gates
  # REGISTRATION only: a tenant over its cap or on a lapsed plan keeps every
  # device it has, keeps ingesting, and keeps its SOS path. Re-price a tier by
  # changing a number here; no code change and no image build.
  HUB_PLAN_FREE_DEVICES: "4"
  HUB_PLAN_CREW_DEVICES: "24"
  HUB_PLAN_FLEET_DEVICES: "100"
  HUB_PLAN_CUSTOM_DEVICES: "-1"
  HUB_UPGRADE_URL: "https://ko-fi.com/X2S326G23T"

  # Transactional email. nllei01smtp-dkim01 authorises by IP and signs with DKIM
  # for meshsat.net; the Hub's tunnel address 10.255.200.37 is in its mynetworks
  # AND in opendkim's trusted.hosts -- reaching the relay and being signed by it
  # are two separate permissions, and only the second is invisible from here.
  # Port 2525, not 25, which is the zeyple GPG hop Invoice Ninja also bypasses so
  # customer mail bounces normally. Receipts are NOT sent from here.
  HUB_SMTP_RELAY: "192.168.181.72:2525"
  HUB_MAIL_FROM: "billing@meshsat.net"
  HUB_MAIL_FROM_NAME: "MeshSat Hub"
  HUB_PUBLIC_URL: "https://hub.meshsat.net"
  # Ko-fi tier name -> plan. Left unset the tier name is read as a plan name,
  # so a Ko-fi tier literally called "Crew" or "Fleet" needs nothing here.
  # HUB_KOFI_TIER_MAP: "Crew Membership=crew,Fleet Membership=fleet"

  # --- customer receipts (MESHSAT-998) ---
  # A Ko-fi payment is recorded in the receipts outbox either way; these decide
  # whether a document is actually issued for it. HUB_INVOICENINJA_TOKEN is a
  # secret and lives in the ExternalSecret -- with it unset, payments are
  # recorded and no receipt goes out, which is recoverable: the outbox is
  # drained whenever the token appears.
  #
  # The token is COMPANY-SCOPED. It must be the MeshSat Hub company's token
  # (company 2), not the other company on that instance: the token is what
  # decides the brand, the VAT treatment and the number series a receipt is
  # issued under.
  HUB_INVOICENINJA_URL: "https://invoiceninja.nuclearlighters.net"
  # Dutch 21%, derived OUT of the price the customer paid rather than added to
  # it: that company has inclusive taxes on, and EUR 9.00 is 7.44 + 1.56 VAT.
  # The company default rate is a web-UI prefill the API does not apply, so
  # this goes on every invoice line explicitly.
  HUB_INVOICENINJA_TAX_NAME: "BTW 21"
  HUB_INVOICENINJA_TAX_RATE: "21"
  # The only currency that company invoices in. A payment in anything else is
  # parked for a person rather than converted at an invented rate.
  HUB_INVOICENINJA_CURRENCY: "EUR"
  HUB_INVOICENINJA_COUNTRY_ID: "528"
  HUB_INVOICENINJA_TIMEOUT: "30s"
