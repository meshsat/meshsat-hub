# Hub non-secret config. Values carried over from the NL compose .env capture
# (2026-09-08) where they are not cluster-specific; cluster settings per the
# MESHSAT-864 plan. Secrets and templated URLs live in hub-secrets (ES).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
data:
  # Not read by the Hub. Changing this value is the Reloader drill (MESHSAT-1150):
  # a ConfigMap edit must roll the Deployment by itself, under the PDB, with no
  # hand-run rollout restart. Bump the date to re-run the drill.
  RELOADER_CANARY: "2026-09-15"
  HUB_PORT: "6070"
  HUB_MODE: "kubernetes"
  HUB_DB_DRIVER: "postgres"
  HUB_DB_RETRY_MAX_ATTEMPTS: "8"
  HUB_SHUTDOWN_DRAIN_SECONDS: "5"
  HUB_LOG_FORMAT: "json"
  HUB_LOG_LEVEL: "info"
  HUB_MQTT_CLIENT_ID: "meshsat-hub"
  # --- identity: authentik at auth.meshsat.net (MESHSAT-936); issuer exactly as discovery reports it ---
  HUB_AUTH_MODE: "oidc"
  # MESHSAT-1209: the off switch for the static HUB_AUTH_TOKEN break-glass bearer.
  # Declared here at its DEFAULT so the switch is discoverable and retiring the
  # token is a one-line edit plus an Argo sync, not a code change.
  #
  # Before flipping to "false": the remaining consumers are hand-run operator
  # scripts that read the token out of the pod env (stripe-suite.py,
  # refund-suite.py, vat-suite.py, donation-check.py, stripe-live-check.py).
  # Mint each a platform-admin API key first -- POST /api/auth/keys with
  # {"platform_admin": true}, which only a platform admin may do -- and cut them
  # over. The Hub REFUSES TO BOOT if this is false and neither OIDC nor a JWT
  # signing key is configured, rather than quietly serving unauthenticated.
  # FLIPPED 2026-09-17 (MESHSAT-1209). Every consumer verified on a replacement
  # first: the nightly's journey-suite on HUB_VERIFY_ADMIN_KEY, the CI variable
  # HUB_E2E_TOKEN rotated to an owner-scoped key, the scratchpad probes given an
  # adminkey() helper. The static bearer is now refused at every acceptance
  # point; the value stays in OpenBao and the pod env only until the
  # ExternalSecret is trimmed, but the Hub no longer honours it.
  HUB_LEGACY_TOKEN_ENABLED: "false"
  HUB_OIDC_ISSUER_URL: "https://auth.meshsat.net/application/o/meshsat-hub/"
  HUB_OIDC_REDIRECT_URI: "https://hub.meshsat.net/api/auth/oidc/callback"
  HUB_OIDC_SCOPES: "openid profile email meshsat"  # meshsat = groups claim (bootstrap-meshsat.py ScopeMapping)
  HUB_OIDC_GROUPS_CLAIM: "groups"
  HUB_OIDC_ADMIN_GROUP: "meshsat-platform-admin"
  # The password reset flow. It has existed since MESHSAT-978 and been bound to
  # the MeshSat brand, but nothing in the Hub linked to it -- a user who forgot
  # their password had no route to recovery from the login screen.
  HUB_OIDC_RECOVERY_URL: "https://auth.meshsat.net/if/flow/meshsat-recovery/"
  HUB_OIDC_SIGNUP_URL: "https://auth.meshsat.net/if/flow/meshsat-enrollment/"
  # Self-service for a signed-in customer. authentik's own settings page
  # (/if/user/) answers "Interface can only be accessed by internal users", and
  # every customer is `external` by licensing -- so until these existed a
  # customer could not change their password or turn on two-factor, while the
  # sign-in flow had been validating MFA at order 30 the whole time. A flow
  # executor is not that settings page and works for an external user.
  # Both flows are created by k8s/scripts/authentik/bootstrap-meshsat.py.
  HUB_OIDC_PASSWORD_CHANGE_URL: "https://auth.meshsat.net/if/flow/meshsat-password-change/"
  HUB_OIDC_MFA_SETUP_URL: "https://auth.meshsat.net/if/flow/meshsat-mfa-setup/"
  # Approving beta requests from the Hub (MESHSAT-978): the identity provider
  # it acts on. HUB_SIGNUP_WEBHOOK_URL used to sit here too, pointing at the
  # n8n workflow that added an approved address to the VPS allowlists; the edge
  # opened at public launch and that list is gone (MESHSAT-995).
  HUB_AUTHENTIK_URL: https://auth.meshsat.net
  # Where the Hub's OPERATOR notices go -- today, "somebody is waiting for a
  # decision on an account" (MESHSAT-1081). Until that existed, enrolment reached
  # a YouTrack issue and a Matrix message and no inbox, so a request sat in the
  # Beta requests panel until somebody happened to open Settings.
  #
  # DELIBERATELY UNSET. With no address configured the recipients are resolved
  # from the members of HUB_OIDC_ADMIN_GROUP in the identity provider, so adding
  # a platform admin there is all it takes to start receiving these -- no edit
  # here, no redeploy. Set it only to send somewhere else instead, such as a
  # shared alias or a ticket queue. A ConfigMap change rolls the Deployment by
  # itself (Reloader annotation on deployment.yaml, MESHSAT-1150).
  # HUB_ADMIN_NOTIFY_EMAIL: ""
  # The owner's MeshSat ID attaches to the migrated `default` tenant at first login
  # instead of creating a new one (MR 16); everyone else gets their own tenant.
  HUB_OIDC_BOOTSTRAP_OWNER_EMAIL: "admin@meshsat.net"
  HUB_TENANT_ENFORCE: "true"
  HUB_LOCAL_LOGIN_ENABLED: "false"
  # --- bridges ---
  MESHSAT_MQTT_PUBLIC_URL: "wss://mqtt-hub.meshsat.net:443"
  HUB_BRIDGE_CA_SECRET_NAME: "meshsat-bridge-ca"
  HUB_NATS_AUTH_SECRET_NAME: "meshsat-nats-auth"  # rendered NATS users/permissions (internal/bridge/natsauth.go)
  HUB_RETICULUM_TCP_ENABLED: "true"
  HUB_RETICULUM_TCP_ADDR: ":4242"
  HUB_AUDIT_ARCHIVE_S3_ENDPOINT: "https://nl-s3.nuclearlighters.net"
  HUB_AUDIT_ARCHIVE_S3_BUCKET: "cnpg-meshsat-hub"
  HUB_AUDIT_ARCHIVE_S3_PREFIX: "hub-audit"
  # Self-hosted vector basemap (MESHSAT-967): the archive and its glyph and
  # sprite assets live beside the audit archive in the same bucket, and the Hub
  # streams them at /basemap/. Endpoint, bucket and credentials fall back to the
  # audit archive values. Rebuild with k8s/scripts/basemap/build-basemap.sh.
  # The world archive stops at zoom 11 (major roads and their names) and the
  # regional one carries the Netherlands and Greece to zoom 15, which is where
  # street names live. Those are the two countries the fleet is actually in.
  # Adding a country is one line in k8s/scripts/basemap/fleet-regions.geojson
  # and a rebuild; see build-basemap.sh for the sizes.
  HUB_BASEMAP_S3_KEY: "basemap/protomaps-world-z11-20260907.pmtiles"
  # The deep archive is served by the basemap StatefulSet from its own disks,
  # not from the object store, so the Hub's local key stays empty. See
  # k8s/basemap/ and NOTES.md.
  HUB_BASEMAP_S3_LOCAL_KEY: ""
  HUB_BASEMAP_S3_ASSET_PREFIX: "basemap/assets"
  # --- carried over from the compose .env ---
  HUB_RATELIMIT_BURST: "10"
  HUB_RATELIMIT_DAILY_CAP: "100"
  HUB_RATELIMIT_REFILL_PER_MIN: "1"
  HUB_SMS_ENABLED: "true"
  HUB_CLOUDLOOP_MQTT_BROKER: "ssl://mqtt.cloudloop.com:8883"
  # "*" is only honoured together with HUB_CLOUDLOOP_WEBHOOK_TOKEN (ExternalSecret, ?token= in the Cloudloop console URL); without it the webhook rejects every request (MESHSAT-971).
  # Researched 2026-09-09. Cloudloop publishes no egress addresses anywhere in
  # its documentation, and it runs on AWS eu-west-2 (api.cloudloop.com resolves
  # to 18.132.81.144 / 3.8.7.26), so there is no list to put here and an AWS
  # region would not be a control. The tenant's secret in the webhook path is
  # what authenticates a Cloudloop delivery. Ask Ground Control support if you
  # want a real list; if they give one, put it here and the check applies to
  # path-authenticated requests too.
  #
  # RockBLOCK is different and needs no allowlist at all: Ground Control signs
  # every delivery with a key it publishes, and the Hub verifies it
  # (internal/rockblock/jwt.go). For reference, the two addresses its docs say
  # to allow through a firewall are 109.74.196.135 and 212.71.235.32, both
  # Linode UK -- separate infrastructure from Cloudloop's, so they do not
  # transfer.
  HUB_CLOUDLOOP_WEBHOOK_ALLOWED_IPS: "*"
  # Where satellite webhooks are EXPECTED to come from. Observe-only: a delivery
  # from outside this range is still PROCESSED, and increments
  # meshsat_hub_webhook_unexpected_source_total. Deliberately not a blocklist --
  # Cloudloop publishes no egress addresses to allowlist, so any range here is a
  # guess, and this is the path an SOS arrives on. Refusing on a guess would be
  # a distress message that never arrives.
  #
  # Left unset until the real range is known. To find it: set it to the
  # provider's claimed region (Cloudloop runs on AWS eu-west-2) and watch the
  # counter -- warnings mean the guess is wrong, and nothing was dropped while
  # you found out.
  # HUB_CLOUDLOOP_WEBHOOK_EXPECTED_IPS: ""
  # APRS-IS, WireGuard and hawkBit are all PER TENANT since MESHSAT-1121: each
  # tenant brings its own callsign, wg-easy and hawkBit on the Integrations page.
  # These three variables are now only the PLATFORM's own account, serving the
  # default tenant, exactly like HUB_SMS_* is the platform's Twilio. A customer
  # is unaffected by them either way.
  #
  # APRS-IS stays off for the platform: the operator has no callsign on file, and
  # a callsign is a licence issued to a named person. A tenant that brings its
  # own transmits regardless of this value.
  # The platform's own Apprise relay, deployed in k8s/apprise (MESHSAT-1121).
  # It was unset with no relay anywhere in the estate, so every notification URL
  # a customer saved was accepted and delivered nowhere -- the silence this whole
  # issue started from. A tenant may still point at its own relay instead.
  HUB_APPRISE_ENABLED: "true"
  HUB_APPRISE_URL: "http://apprise:8000"
  # The Hub's Tor hidden service (k8s/tor, MESHSAT-1121). Set here rather than
  # read from Tor's hostname FILE because the two are separate pods and the key
  # volume is RWO node-local, so the Hub cannot mount it. A .onion is derived
  # from that key and is stable for the life of the volume, which makes it
  # configuration rather than state to discover at runtime.
  #
  # It reaches BOTH consumers: /api/tor/onion and the Reticulum Tor interface,
  # which already read this variable. If the key volume is ever lost this value
  # changes and every published reference to it breaks.
  #
  # Rotated 2026-09-17 to a VANITY address with a recognisable prefix
  # (MESHSAT-1193). The previous identity was ynyj72hfs4k5wwrmphxyu5lf4mpgzcrr
  # jzap4ntfx7bmnxwpjdps2bid.onion, preserved in OpenBao at
  # ci-no/apps/meshsat-hub/tor-legacy-ynyj72hf so the change is reversible.
  #
  # Rotating cost nothing at the time because NOTHING published the old address:
  # it appeared only in this file, there was no Onion-Location header, and the
  # only way to learn it was an authenticated GET /api/tor/onion. That will not
  # be true twice -- once this value is on meshsat.net and in kit configs, it is
  # permanent, so treat the next rotation as breaking.
  #
  # The prefix is a usability aid and NOT a security control: an attacker can
  # generate a "meshsat"-prefixed lookalike for the same ~$0.09 of compute, so
  # all 56 characters remain the only identifier that means anything.
  HUB_TOR_ONION: "meshsatgwdjt62kkm3q2tat2x6clg2367lzjqrv5j2oj4ojyx76bbbqd.onion"
  HUB_APRSIS_ENABLED: "false"
  # The platform's own wg-easy, deployed in k8s/wireguard (MESHSAT-1121). It was
  # "false" with no server anywhere in the estate, so Network was a nav entry in
  # front of nothing.
  HUB_WG_ENABLED: "true"
  HUB_WG_URL: "http://wg-easy:51821"
  # The platform's own hawkBit, deployed in k8s/hawkbit (MESHSAT-1121). It was
  # "false" with no OTA server anywhere in the estate, so OTA was a nav entry in
  # front of nothing. hawkBit is multi-tenant itself, so a tenant pointing at its
  # own account here is isolated by hawkBit rather than by us.
  HUB_HAWKBIT_ENABLED: "true"
  HUB_HAWKBIT_URL: "http://hawkbit:8080"
  # TAK is per-tenant (MESHSAT-1037, MESHSAT-1065): the operator runs one
  # OpenTAKServer per tenant, or a tenant points the Hub at their own server
  # through Settings -> Integrations. The platform-wide keys that used to be
  # here -- one TAK host, its OTS marker poller and TAK Federation v2 -- are
  # gone with the code that read them (MESHSAT-1032). The HUB_TAK_FRONT_* and
  # HUB_TAK_NAMESPACE keys below belong to the hosted path and stay.

  # --- public exposure (MESHSAT-995) ---
  # Whose X-Forwarded-For to believe when resolving the client IP for rate
  # limiting. Every hop on our own side of the wire has to be listed or the
  # "client" resolves to one of our own proxies: ingress-nginx (pod network),
  # the edge relay DaemonSet (mesh), and the three VPS HAProxies. Anything not
  # listed is treated as the client, so this list is what makes a per-IP limit
  # mean a per-client limit rather than a per-ingress-pod one.
  #
  # This list names the whole pod network, which means it also named the tor
  # pod, and the hidden service forwards raw TCP -- so an anonymous onion client
  # arrived from a trusted peer carrying its own X-Forwarded-For and picked its
  # own rate-limit key, or a named victim's (MESHSAT-1169). The fix is not to
  # narrow this list: ingress-nginx pods have no stable address to narrow it to,
  # and a list of pod IPs would be wrong after the next rollout. Instead the
  # onion has its own listener (HUB_ONION_PORT) and the Hub keys that channel
  # separately, and who may reach 6070 is settled by NetworkPolicy rather than
  # by arithmetic on this line.
  HUB_TRUSTED_PROXIES: "10.2.0.0/16,10.255.0.0/16,185.44.82.32/32,185.125.171.172/32,185.121.169.27/32"
  # The Tor-only HTTP listener. Same routes as 6070, but requests arriving here
  # are keyed as one "onion" client for rate limiting instead of believing a
  # forwarding header that, on this path, the anonymous client wrote itself.
  # Tor users therefore share a budget, which is inherent: the hidden service
  # offers no per-client identity to key on. Set to 0 to stop serving the onion.
  HUB_ONION_PORT: "6079"

  # --- WhatsApp bearer and the TTC stand flow (MESHSAT-1175) ---
  # Same Twilio account and the same account auth token as SMS; only the channel
  # differs. Nothing may be load-bearing on this: Meta auto-restricted the WABA
  # on the day it was created, so both switches below have to be survivable.
  HUB_WHATSAPP_ENABLED: "true"
  HUB_BOOTH_ENABLED: "true"
  # The destination ALLOWLIST, "<bridge_id>:<label>[:<mesh_dest>]". A kit not
  # named here cannot be reached from the stand, and nothing a visitor types can
  # add one. Empty mesh_dest means the kit's default channel, which is also how
  # the return-leg conversation is keyed.
  HUB_BOOTH_KITS: "nllei01tesseract01:Tesseract,nllei01parallax01:Parallax"
  # Twilio Content SIDs for the interactive list and buttons. Created out of
  # band on 2026-09-16 and deliberately NEVER submitted to Meta: an unapproved
  # template is deliverable only inside the 24h window a visitor opens by
  # messaging us first, which is exactly the booth's shape. Changing the kit list
  # above means rebuilding meshsat_booth_kits, whose items are fixed in the
  # template rather than variable.
  # SMS is a SHARED bearer: kit OOB replies and satellite traffic arrive on the
  # same number. The booth therefore claims a message only from somebody already
  # in a conversation, or one whose WHOLE text is this word -- everything else
  # falls through to the pipeline untouched. Empty disables the SMS bearer.
  #
  # The stand needs this because Meta restricted the WABA again on 2026-09-16,
  # six days before TTC: WhatsApp cannot deliver a single message while that
  # stands, and SMS needs no Meta approval at all.
  HUB_BOOTH_SMS_KEYWORD: "MESHSAT"
  # How recently a node must have been HEARD behind a kit for the stand to call
  # that mesh live (MESHSAT-1181). Presence is only observable when a node
  # transmits, so this governs a POSITIVE signal: outside the window the Hub
  # says "no recent evidence" and still offers the kit, it never says "empty".
  # Set to 0 to stop asking the question at all.
  HUB_BOOTH_MESH_WINDOW: "30m"
  HUB_BOOTH_CONTENT_MENU: "HX0d6710337e5ff9e5b9ed1d6496f2372c"
  HUB_BOOTH_CONTENT_OPTIN: "HXc80c6bc6e7b71cff01935143d9dc5a7e"
  HUB_BOOTH_CONTENT_KITS: "HX5d7051b39bf8001239620c0334c080e4"
  # Per-client budget on the unauthenticated auth endpoints. The OIDC callback
  # makes an outbound token exchange against authentik on every call, so this
  # is what stops an anonymous caller pointing our fan-out at our own IdP.
  HUB_AUTH_RATE_LIMIT_PER_MIN: "30"
  # Per-principal budget on every authenticated route (ASVS V4, MESHSAT-1219):
  # 600/min per user or API key. Webhooks, health and the capability URLs carry
  # no principal and are never counted against it. 0 disables.
  HUB_API_RATE_LIMIT_PER_MIN: "600"

  # --- tenant-owned operational settings (MESHSAT-1117) ---
  # How long a bridge may go quiet before the Hub calls it offline. This stays
  # the DEFAULT every tenant gets; an owner can now choose their own in
  # Settings -> Tenant, because a vehicle on a city network and a kit on a
  # satellite schedule do not want the same number. MIN and MAX bound what an
  # owner may pick: below a bridge's own heartbeat the reaper flaps a healthy
  # fleet offline between beats, and far above it a dead bridge reads as online
  # for as long as somebody cared to type. Changing any of these is an edit and
  # an Argo sync, not a build.
  #
  # This decides one thing only: whether a bridge is SHOWN as offline. It is not
  # on the delivery path and has nothing to do with SOS.
  HUB_BRIDGE_OFFLINE_TIMEOUT: "300"
  HUB_BRIDGE_OFFLINE_TIMEOUT_MIN: "60"
  HUB_BRIDGE_OFFLINE_TIMEOUT_MAX: "86400"

  # How long a tenant's audit entries are kept. An audit log is the CUSTOMER's
  # own record of who did what in their account, so how long they keep it is
  # their compliance question; an owner can now choose in Settings -> Tenant and
  # this is the default. MIN is the load-bearing bound -- without it a tenant
  # could shorten retention until the evidence of a security event in their own
  # account is gone before anyone looks at it. MAX is the boring one: storage
  # here is node-local and audit rows are an append-only hash chain that only
  # ever grows.
  HUB_AUDIT_RETENTION_MIN_DAYS: "30"
  HUB_AUDIT_RETENTION_MAX_DAYS: "3650"

  # How long a geofence stays quiet for one device after it fires
  # (MESHSAT-1119). A crossing triggers the moment point-in-polygon flips, so a
  # device parked on a boundary -- GPS jitter is metres -- would otherwise page
  # somebody every few minutes all night.
  #
  # This damps the OUTPUT: the FIRST crossing fires immediately and is never
  # delayed. Dwell time, the obvious alternative, damps the input by waiting for
  # a second position report on the new side -- and with Iridium reports minutes
  # apart that delays every genuine crossing by a full reporting interval, which
  # on a safety path is the worse failure.
  #
  # A fence may set its own cooldown_sec within MIN..MAX; 0 means this default.
  HUB_GEOFENCE_COOLDOWN_SEC: "300"
  HUB_GEOFENCE_COOLDOWN_MIN: "30"
  HUB_GEOFENCE_COOLDOWN_MAX: "86400"

  # --- subscription tiers (MESHSAT-989) ---
  # One combined ceiling on registered devices and bridges per tenant. It gates
  # REGISTRATION only: a tenant over its cap or on a lapsed plan keeps every
  # device it has, keeps ingesting, and keeps its SOS path. Re-price a tier by
  # changing a number here; no code change and no image build.
  HUB_PLAN_FREE_DEVICES: "4"
  HUB_PLAN_CREW_DEVICES: "24"
  HUB_PLAN_FLEET_DEVICES: "100"
  HUB_PLAN_CUSTOM_DEVICES: "-1"

  # Per-device send budget per tier (MESHSAT-1117 tranche 2c). Until one of
  # these is set, every tenant gets HUB_RATELIMIT_DAILY_CAP and nothing changes
  # -- which is how this shipped, deliberately.
  #
  # These can only ever RAISE a tenant's budget: a resolved cap is never below
  # HUB_RATELIMIT_DAILY_CAP / _MONTHLY_CAP. Setting a tier LOWER does nothing,
  # on purpose. A lower tier resolving to a smaller budget would mean a lapse
  # reduces message DELIVERY, and the subscription ceiling is only ever allowed
  # to gate registration -- never ingest, never delivery, never SOS.
  #
  # So the way to give a paid tier meaning here is to raise it, e.g.
  #   HUB_PLAN_CREW_DAILY_CAP: "500"
  #   HUB_PLAN_FLEET_DAILY_CAP: "2000"
  # A single customer can be raised on their own with a platform-admin PUT to
  # /api/admin/tenants/{id} (ratelimit_daily_cap), which is not owner-editable:
  # a send budget is a commercial lever and self-service would make it free.

  # TAK accounts per tier (MESHSAT-1037), a separate meter from devices: a TAK
  # user is a person with a phone and a certificate, a device is a piece of kit,
  # and a two-device survey team can have a dozen people watching the map.
  # Registration only, exactly like the device cap above -- an account that
  # exists keeps connecting and keeps its SOS path whatever the tier says.
  #
  # Custom gets a real number rather than -1, unlike its device allowance: every
  # TAK user is a long-lived TLS session and a row in a Python process on the
  # control-plane tier, so this ceiling protects the cluster rather than the
  # invoice. Raise it deliberately for a tenant that needs more.
  HUB_PLAN_FREE_TAK_USERS: "4"
  HUB_PLAN_CREW_TAK_USERS: "12"
  HUB_PLAN_FLEET_TAK_USERS: "40"
  HUB_PLAN_CUSTOM_TAK_USERS: "100"

  # The hosted TAK front (MESHSAT-1037): one TLS listener for every tenant's
  # phones, tenant identified from the client certificate's issuer.
  #
  # ON, 2026-09-13, after MESHSAT-1076. It was switched on once before and taken
  # straight back off, which is worth keeping because it is how that defect was
  # found: with the front running, two Hub replicas fought over one shared
  # upstream-identity request -- whichever did not ask saw a certificate it had no
  # key for, deleted it and asked again -- so NO tenant entered the front's
  # directory and no phone could connect, while every probe stayed green. Each
  # replica now has its own request object and its own key.
  #
  # WHAT TO WATCH, and the number that would have caught that in one refresh:
  # `meshsat_hub_takhosted_directory_tenants` must equal the number of Ready
  # instances. The same pair is in the log line `takhosted: directory refreshed`
  # as `tenants` and `skipped`.
  #
  # The front presents ONE server certificate to every phone in every tenant --
  # ATAK sends no SNI on the CoT socket, so it must present a certificate before
  # it knows who is calling -- and every tenant's truststore carries that
  # certificate's chain. It is therefore supplied, never generated: a certificate
  # the Hub minted for itself would be refused by every phone already enrolled.
  #
  # This comment said "OFF until the certificate Secret exists" for four days
  # after the Secret started existing (2026-09-08), which is the kind of note that
  # stops somebody looking. The files are meshsat-net-tls, mounted by the
  # Deployment at the path below, and takfront.CertFile re-reads them when
  # cert-manager renews (without that, a renewal would have silently served an
  # expired certificate to every phone at once).
  #
  # Turning this on without the files is a startup error that logs and continues,
  # not a crash: TAK is one feature among many and must not take satellite
  # ingest, SMS and the dashboard down with it. The volume is optional for the
  # same reason.
  HUB_TAK_FRONT_ENABLED: "true"
  HUB_TAK_FRONT_ADDR: ":8089"
  HUB_TAK_FRONT_CERT_FILE: "/etc/meshsat/takfront/tls.crt"
  HUB_TAK_FRONT_KEY_FILE: "/etc/meshsat/takfront/tls.key"
  # Where the TakInstance and TakCertificateRequest objects live. The Hub runs in
  # meshsat-hub and reaches across, which is why its rights on them are a
  # separate Role in that namespace (k8s/tak/rbac-hub.yaml).
  HUB_TAK_NAMESPACE: "meshsat-tak"

  # Transactional email. nllei01smtp-dkim01 authorises by IP and signs with DKIM
  # for meshsat.net; the Hub's tunnel address 10.255.200.37 is in its mynetworks
  # AND in opendkim's trusted.hosts -- reaching the relay and being signed by it
  # are two separate permissions, and only the second is invisible from here.
  # Port 2525, not 25, which is the zeyple GPG hop Invoice Ninja also bypasses so
  # customer mail bounces normally. Receipts are NOT sent from here.
  HUB_SMTP_RELAY: "192.168.181.72:2525"
  HUB_MAIL_FROM: "billing@meshsat.net"
  HUB_MAIL_FROM_NAME: "MeshSat Hub"
  HUB_PUBLIC_URL: "https://hub.meshsat.net"

  # --- Stripe (MESHSAT-1023), replacing Ko-fi ---
  #
  # Commented out until the prices exist in Stripe. The three secrets
  # (HUB_STRIPE_SECRET_KEY, HUB_STRIPE_WEBHOOK_SECRET, HUB_STRIPE_PATH_SECRET)
  # live in the ExternalSecret and are commented out there for a different and
  # sharper reason -- see that file.
  #
  # A price that names anything but crew or fleet is REFUSED at load: custom and
  # beta are unlimited and operator-set, and a typo here must cost a log line
  # rather than an uncapped plan.
  #
  # Before switching this on, turn OFF the Stripe dashboard's
  # Settings > Tax > Integrations > "Use automatic tax". It is on with no NL
  # registration behind it, which would put EUR 0 VAT on transactions raised
  # from a VAT-registered business. Ko-fi traffic never touched it; this does.
  # Live prices, created 2026-09-10 on acct_1TKOcE6vVKg6ivl2 (Standard connected
  # account, charges enabled). Both are tax_behavior=inclusive: the customer pays
  # EUR 9.00 and Invoice Ninja derives the 21% out of it (7.44 + 1.56), which is
  # the same basis every receipt already uses.
  #
  # There are ZERO Stripe Tax registrations on this account, so Stripe would
  # compute no tax on anything -- which is exactly why every request this Hub
  # makes sends automatic_tax[enabled]=false rather than trusting a setting.
  HUB_STRIPE_PRICES: "price_1UEHEb4j5c6KcLizgcFWjeHp=crew,price_1UEHEb4j5c6KcLizBT2sirDL=fleet"
  HUB_STRIPE_TIMEOUT: "20s"
  # No donation price yet: a customer-chosen amount needs a price with
  # custom_unit_amount, and nobody has decided the floor. Unset means no
  # donation path, which is a supported state.
  HUB_STRIPE_DONATION_PRICE: "price_1UEHGT4j5c6KcLiz56KCKVPz"

  # --- customer receipts (MESHSAT-998) ---
  # A Ko-fi payment is recorded in the receipts outbox either way; these decide
  # whether a document is actually issued for it. HUB_INVOICENINJA_TOKEN is a
  # secret and lives in the ExternalSecret -- with it unset, payments are
  # recorded and no receipt goes out, which is recoverable: the outbox is
  # drained whenever the token appears.
  #
  # The token is COMPANY-SCOPED. It must be the MeshSat Hub company's token
  # (company 2), not the other company on that instance: the token is what
  # decides the brand, the VAT treatment and the number series a receipt is
  # issued under.
  HUB_INVOICENINJA_URL: "https://invoiceninja.nuclearlighters.net"
  # Dutch 21%, derived OUT of the price the customer paid rather than added to
  # it: that company has inclusive taxes on, and EUR 9.00 is 7.44 + 1.56 VAT.
  # The company default rate is a web-UI prefill the API does not apply, so
  # this goes on every invoice line explicitly.
  HUB_INVOICENINJA_TAX_NAME: "BTW 21"
  HUB_INVOICENINJA_TAX_RATE: "21"
  # The only currency that company invoices in. A payment in anything else is
  # parked for a person rather than converted at an invented rate.
  HUB_INVOICENINJA_CURRENCY: "EUR"
  # The FALLBACK country for a customer record, used only when the buyer's own
  # country is unknown. Since MESHSAT-1016 the buyer's country travels from
  # enrollment onto the tenant and onto the receipt, and a receipt with no
  # country is parked rather than issued -- so this is a backstop, not the
  # blanket "everyone is Dutch" it used to be.
  HUB_INVOICENINJA_COUNTRY_ID: "528"
  HUB_INVOICENINJA_TIMEOUT: "30s"
