# The Hub, two replicas on two workers (MESHSAT-711, plan phase 7): routing
# dispatch is single-writer through dispatch_claims, singletons run on the
# Lease holder (identity = pod name), the MQTT client id carries the pod name,
# and the audit archive goes to the S3 sink, so no pod owns a volume. Rolling
# updates keep one pod serving; the PDB keeps one through node drains.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  replicas: 2
  # Only two workers are eligible (dmz01, dmz02; dmz06 excluded, dmz03-05 are
  # tainted control-plane), so with the required anti-affinity a surge pod has
  # nowhere to go: roll by replacing one pod at a time instead.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub
    spec:
      serviceAccountName: meshsat-hub
      # Leader election (Lease) and the bridge CA Secret writer need the API.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["notrf01dmz06"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hub
      terminationGracePeriodSeconds: 30
      containers:
        - name: hub
          image: ghcr.io/meshsat/meshsat-hub
          ports:
            - name: http
              containerPort: 6070
            - name: reticulum
              containerPort: 4242
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # MESHSAT-980: the MQTT client id is suffixed with the pod name so
            # two replicas never share a broker session; the same name is the
            # leader election identity (MESHSAT-711).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: hub-config
            - secretRef:
                name: hub-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet: {path: /startupz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {memory: 256Mi, cpu: 200m}
            limits: {memory: 1Gi}
