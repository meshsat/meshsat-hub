# The Hub, two replicas across the three workers (MESHSAT-711): routing
# dispatch is single-writer through dispatch_claims, singletons run on the
# Lease holder (identity = pod name), the MQTT client id carries the pod name,
# and the audit archive goes to the S3 sink, so no pod owns a volume. Rolling
# updates keep one pod serving; the PDB keeps one through node drains.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  replicas: 2
  # Three eligible workers and two replicas, so a surge pod has a node to land
  # on and the roll keeps both replicas serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub
    spec:
      serviceAccountName: meshsat-hub
      # Leader election (Lease) and the bridge CA Secret writer need the API.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # Any worker. The dmz06 exclusion was about volumes and the Hub has
              # none since the audit archive moved to the S3 sink, so all three
              # workers are eligible and a lost replica has somewhere to land.
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hub
      priorityClassName: meshsat-hub-critical
      # The default is 300s, so a dead node keeps counting as a replica for five
      # minutes before a replacement is even created. Sixty seconds is long
      # enough to ride out a network blip and short enough to matter.
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 60}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 60}
      # Must outlast the departing leader's wait for its singletons, or the
      # kubelet SIGKILLs mid-work and the wait was decorative: preStop sleeps 5,
      # leader.DefaultStopWait is 45, and the receipt issuer can be 30 s inside
      # a billing call. 90 leaves room for the HTTP drain on top. A pod still
      # goes away as soon as it is done -- this is a ceiling, not a delay
      # (MESHSAT-989).
      terminationGracePeriodSeconds: 90
      containers:
        - name: hub
          image: ghcr.io/meshsat/meshsat-hub
          ports:
            - name: http
              containerPort: 6070
            - name: reticulum
              containerPort: 4242
            # The hosted TAK front (MESHSAT-1037): one TLS listener for every
            # tenant's phones. 8089 rather than a 6xxx port, matching the public
            # TAK SSL port so the edge configuration reads straight across --
            # the same protocol-standard exception reticulum's 4242 already is.
            - name: takfront
              containerPort: 8089
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # MESHSAT-980: the MQTT client id is suffixed with the pod name so
            # two replicas never share a broker session; the same name is the
            # leader election identity (MESHSAT-711).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: hub-config
            - secretRef:
                name: hub-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet: {path: /startupz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {memory: 256Mi, cpu: 200m}
            limits: {memory: 1Gi}
          volumeMounts:
            # HUB_CLOUDLOOP_MQTT_{CA,CERT,KEY} name files under this path.
            - name: cloudloop-certs
              mountPath: /certs/cloudloop
              readOnly: true
      volumes:
        - name: cloudloop-certs
          secret:
            secretName: hub-cloudloop-certs
            defaultMode: 0400
