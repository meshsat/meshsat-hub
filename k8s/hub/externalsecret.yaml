# Hub secrets from openbao ci-no/apps/meshsat-hub/hub (property names == env
# names), plus the connection strings TEMPLATED from the sibling secrets so
# they can never drift from the CNPG / NATS / Redis passwords.
# HUB_OIDC_CLIENT_ID/SECRET are written by the authentik bootstrap
# (k8s/scripts/authentik/bootstrap-meshsat.py); the placeholders seeded on
# 2026-09-08 keep this ES healthy until then. HUB_OIDC_AUDIENCE == client id.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-secrets
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hub-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        HUB_DATABASE_URL: "postgres://meshsat:{{ .meshsat_db_password }}@meshsat-hub-main-rw.meshsat-hub-db.svc:5432/meshsat_hub?sslmode=require"
        HUB_MQTT_BROKER_URL: "tcp://meshsat:{{ .NATS_MQTT_PASSWORD }}@nats:1883"
        # HUB_NATS_URL is NOT set: in cluster/kubernetes mode the Hub uses it as the
        # MQTT broker URL (see main.go, compose sets tcp://...:1883); the core-protocol
        # nats://...:4222 form made Paho fail with "unknown protocol" (rehearsal 2026-09-08).
        HUB_REDIS_URL: "redis://:{{ .REDIS_PASSWORD }}@redis:6379/0"
        HUB_OIDC_AUDIENCE: "{{ .HUB_OIDC_CLIENT_ID }}"
        HUB_OIDC_CLIENT_ID: "{{ .HUB_OIDC_CLIENT_ID }}"
        HUB_OIDC_CLIENT_SECRET: "{{ .HUB_OIDC_CLIENT_SECRET }}"
        HUB_JWT_SIGNING_KEY: "{{ .HUB_JWT_SIGNING_KEY }}"
        HUB_METRICS_TOKEN: "{{ .HUB_METRICS_TOKEN }}"
        # Audit archive to the NL object store (MR 22): same S3 credentials as the
        # CNPG barman backups (OpenBao ci-no/apps/meshsat-hub/cnpg), prefix hub-audit/.
        HUB_AUDIT_ARCHIVE_S3_ACCESS_KEY: "{{ .barman_access_key }}"
        HUB_AUDIT_ARCHIVE_S3_SECRET_KEY: "{{ .barman_secret_key }}"
        # HUB_AUTH_TOKEN is gone (MESHSAT-1209): the static platform-admin bearer
        # was retired on 2026-09-17 (HUB_LEGACY_TOKEN_ENABLED=false, every consumer
        # on a revocable API key, refusal proven on both replicas). The pods no
        # longer carry it at all; the OpenBao property was removed the same day.
        # Seals the Hub's OWN long-lived keys at rest (MESHSAT-1098): the bridge
        # CA key, the directory signing key, the credential master key and the
        # two Reticulum identity keys. They used to sit in system_config in
        # clear text, and barman ships that database to s3://cnpg-meshsat-hub
        # with no encryption declared on the data or the WAL -- so a backup on
        # its own was enough to mint a client certificate for any customer's
        # bridge and to open every tenant's carrier credentials.
        #
        # Same shape as the tak-operator's TAK_CA_WRAP_KEY, for the same reason,
        # written down one directory over: "This cluster stores Secrets
        # unencrypted in etcd, and Velero copies them to the object store."
        #
        # ⚠ THIS IS A SINGLE POINT OF FAILURE FOR ALL FIVE. Lose it and the Hub
        # refuses to start rather than regenerating them, which is deliberate --
        # regenerating would orphan every tenant's credentials and invalidate
        # the trust anchor every field bridge pinned. It must be backed up
        # somewhere that does not depend on this database.
        HUB_CONFIG_WRAP_KEY: "{{ .HUB_CONFIG_WRAP_KEY }}"
        HUB_ROCK7_USERNAME: "{{ .HUB_ROCK7_USERNAME }}"
        HUB_ROCK7_PASSWORD: "{{ .HUB_ROCK7_PASSWORD }}"
        HUB_CLOUDLOOP_ACCOUNT_ID: "{{ .HUB_CLOUDLOOP_ACCOUNT_ID }}"
        HUB_CLOUDLOOP_API_KEY: "{{ .HUB_CLOUDLOOP_API_KEY }}"
        HUB_CLOUDLOOP_WEBHOOK_TOKEN: "{{ .HUB_CLOUDLOOP_WEBHOOK_TOKEN }}"
        # The platform tenant's RockBLOCK webhook secret. Without it the
        # RockBLOCK handler has no credential to check and refuses every
        # request on the unsuffixed path (MESHSAT-975); the platform's own
        # tenant-addressed URL ends in this value.
        HUB_ROCKBLOCK_SECRET: "{{ .HUB_ROCKBLOCK_SECRET }}"
        # Lets the Hub approve a beta request itself instead of an operator
        # remembering a script (MESHSAT-978). A service account token.
        HUB_AUTHENTIK_TOKEN: "{{ .HUB_AUTHENTIK_TOKEN }}"
        HUB_EMAIL_WEBHOOK_SECRET: "{{ .HUB_EMAIL_WEBHOOK_SECRET }}"
        # Stripe (MESHSAT-1023). Present at ci-no/apps/meshsat-hub/hub since
        # 2026-09-10. Three secrets, and they are not interchangeable:
        #
        #   HUB_STRIPE_SECRET_KEY      calls the API; never in a URL
        #   HUB_STRIPE_WEBHOOK_SECRET  verifies a delivery; the only thing that
        #                              authenticates a caller, so never in a URL
        #   HUB_STRIPE_PATH_SECRET     forms the webhook path; identifies,
        #                              authenticates nothing. Ours, not Stripe's.
        #
        # dataFrom.extract renders a MISSING property as the literal string
        # "<no value>", which is not empty -- so never reference a key before
        # writing it. internal/config refuses that exact string as a second line
        # of defence.
        # The _ACCT2 properties are the DEDICATED MeshSat Hub Stripe account
        # (acct_1UEGj54j5c6KcLiz, 2026-09-11). The unsuffixed ones are the old
        # Ko-fi-era connected account (acct_1TKOcE6vVKg6ivl2), which still takes
        # the blog's money and is NOT ours to reuse. Both sets live at
        # ci-no/apps/meshsat-hub/hub; the suffix is what picks the account, so a
        # rollback is this template and nothing else.
        HUB_STRIPE_SECRET_KEY: "{{ .HUB_STRIPE_SECRET_KEY_ACCT2 }}"
        HUB_STRIPE_WEBHOOK_SECRET: "{{ .HUB_STRIPE_WEBHOOK_SECRET_ACCT2 }}"
        HUB_STRIPE_PATH_SECRET: "{{ .HUB_STRIPE_PATH_SECRET_ACCT2 }}"
        # The only Stripe value meant to be public: it is served to the browser
        # so Stripe.js can mount the embedded donation form, and on its own it
        # can neither create nor read anything. Here rather than in the ConfigMap
        # because it still names the account and belongs beside its siblings.
        HUB_STRIPE_PUBLISHABLE_KEY: "{{ .HUB_STRIPE_PUBLISHABLE_KEY_ACCT2 }}"
        # Not read by the Hub. The Secret half of the Reloader drill (MESHSAT-1150):
        # change the property in OpenBao, ESO rewrites hub-secrets, Reloader rolls.
        RELOADER_CANARY: "{{ .RELOADER_CANARY }}"
        # Customer receipts (MESHSAT-998). The Invoice Ninja API token of the
        # MeshSat Hub company (company 2) -- company-scoped, so the wrong one
        # would issue consumer receipts into the other company's B2B invoice
        # series. Present at ci-no/apps/meshsat-hub/hub since 2026-09-10.
        HUB_INVOICENINJA_TOKEN: "{{ .HUB_INVOICENINJA_TOKEN }}"
        # The Go field is CloudloopMQTTCACert and config.go reads
        # HUB_CLOUDLOOP_MQTT_CA_CERT, not HUB_CLOUDLOOP_MQTT_CA. This key carried
        # the shorter name from the day it was written, so CACertFile reached the
        # subscriber EMPTY and the pin to Cloudloop's own CA never applied: the
        # connection fell back to Go's system root pool. Harmless in practice --
        # the file is the Amazon root CA, which is in that pool anyway -- but it
        # is not what the manifest said was happening, and nothing compared the
        # keys a manifest supplies against the keys the code reads until
        # scripts/check-env-keys.sh. The OpenBao property keeps its own name.
        # The platform's own wg-easy admin password, PLAINTEXT: the Hub
        # authenticates to the UI API with it while wg-easy stores the bcrypt
        # hash of the same value, both from one OpenBao property (MESHSAT-1121).
        HUB_WG_PASSWORD: "{{ .wg_password }}"
        # The platform's own hawkBit admin account. Same arrangement as wg-easy:
        # the Hub uses the plaintext against the Management API, hawkBit stores
        # the bcrypt hash, both from one OpenBao property (MESHSAT-1121).
        HUB_HAWKBIT_USERNAME: "{{ .hawkbit_username }}"
        HUB_HAWKBIT_PASSWORD: "{{ .hawkbit_password }}"
        HUB_CLOUDLOOP_MQTT_CA_CERT: "{{ .HUB_CLOUDLOOP_MQTT_CA }}"
        HUB_CLOUDLOOP_MQTT_CERT: "{{ .HUB_CLOUDLOOP_MQTT_CERT }}"
        HUB_CLOUDLOOP_MQTT_KEY: "{{ .HUB_CLOUDLOOP_MQTT_KEY }}"
        HUB_SMS_ACCOUNT_SID: "{{ .HUB_SMS_ACCOUNT_SID }}"
        HUB_SMS_API_KEY_SID: "{{ .HUB_SMS_API_KEY_SID }}"
        HUB_SMS_AUTH_TOKEN: "{{ .HUB_SMS_AUTH_TOKEN }}"
        # Validates X-Twilio-Signature on the INBOUND webhook, and is a different
        # credential from the one above (MESHSAT-1168). HUB_SMS_AUTH_TOKEN holds
        # the API Key SECRET, because HUB_SMS_API_KEY_SID is set and sending uses
        # API key auth -- but Twilio signs what it delivers with the ACCOUNT auth
        # token whichever credential the application sends with. Reusing the
        # sending value here would reject every real delivery.
        HUB_SMS_INBOUND_AUTH_TOKEN: "{{ .HUB_SMS_INBOUND_AUTH_TOKEN }}"
        HUB_SMS_FROM_NUMBER: "{{ .HUB_SMS_FROM_NUMBER }}"
        # Which Cloudloop thing each modem is, and that it is IMT. Cloudloop's
        # GetThings returns no IMEIs, so without this seed the Hub learns a
        # modem only from its first uplink, in the memory of the one replica
        # that handled it, and forgets on every rollout: a downlink or a
        # satellite relay to that modem then fails on the other replica. It
        # was in the ConfigMap, in a public repository; device identities
        # belong here (MESHSAT-1283). Format: imei:thingId:imt|sbd, comma
        # separated. Add a modem in OpenBao, not in git.
        HUB_CLOUDLOOP_DEVICE_MAP: "{{ .HUB_CLOUDLOOP_DEVICE_MAP }}"
        # Which satellite modems may open the "*" lane to the kits
        # (internal/satchat), comma separated IMEIs. Every readable MO from one
        # of them becomes one SMS per kit, so it is an explicit list, and a
        # device identity, so it lives in the secret store and not in git.
        HUB_SATCHAT_DEVICES: "{{ .HUB_SATCHAT_DEVICES }}"
  dataFrom:
    - extract:
        key: ci-no/apps/meshsat-hub/hub
  data:
    # The wg-easy admin password, in PLAINTEXT: the Hub authenticates to the UI
    # API with it, while wg-easy itself stores the bcrypt hash of the same value
    # (k8s/wireguard/externalsecret.yaml). Both come from the one OpenBao
    # property so they cannot drift apart (MESHSAT-1121).
    - secretKey: wg_password
      remoteRef:
        key: ci-no/apps/meshsat-hub/wireguard
        property: WG_PASSWORD
    - secretKey: hawkbit_username
      remoteRef:
        key: ci-no/apps/meshsat-hub/hawkbit
        property: HAWKBIT_USERNAME
    - secretKey: hawkbit_password
      remoteRef:
        key: ci-no/apps/meshsat-hub/hawkbit
        property: HAWKBIT_PASSWORD
    - secretKey: meshsat_db_password
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: meshsat_password
    - secretKey: barman_access_key
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: barman_access_key
    - secretKey: barman_secret_key
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: barman_secret_key
    - secretKey: NATS_MQTT_PASSWORD
      remoteRef:
        key: ci-no/apps/meshsat-hub/nats
        property: NATS_MQTT_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ci-no/apps/meshsat-hub/redis
        property: REDIS_PASSWORD
