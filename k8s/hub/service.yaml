apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  selector:
    app.kubernetes.io/name: hub
  ports:
    - {name: http, port: 6070, targetPort: http}
    # The Tor hidden service's OWN listener (MESHSAT-1169). Same routes as 6070;
    # a separate port because that is the only thing an anonymous onion client
    # does not get to choose. tor forwards raw TCP, so on one shared port a
    # request off the onion is indistinguishable from one that really passed
    # ingress-nginx -- and its X-Forwarded-For was believed, because the tor pod
    # is inside HUB_TRUSTED_PROXIES like every other pod. Nothing but the tor pod
    # may reach this port; the NetworkPolicy is what enforces that.
    - {name: onion, port: 6079, targetPort: onion}
    - {name: reticulum, port: 4242, targetPort: reticulum}
    # The hosted TAK front (MESHSAT-1037). The edge relay forwards to this from
    # its own hostPort; phones terminate TLS here, not at the edge, because the
    # client certificate is what identifies the tenant and a passthrough proxy
    # cannot read it.
    - {name: takfront, port: 8089, targetPort: takfront}
---
# The Reticulum node runs on ONE replica, the leader (MESHSAT-1555): links,
# path tables and TCP sessions are stateful. A Service that balanced across
# both pods would refuse half of all connections, so this one selects on the
# label the leader puts on its own pod (internal/leader.PodLabeler, cleared
# at every start and on loss) and stunnel's connect target is this name.
# 4242 is the stunnel leg (bridge client certificates); 4244 is the public
# listener for stock clients (Sideband, CrossTalk, MeshChat, NomadNet),
# reached through the edge relay once rns.meshsat.net exists (P4).
apiVersion: v1
kind: Service
metadata:
  name: hub-rns
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  selector:
    app.kubernetes.io/name: hub
    meshsat.net/rns-leader: "true"
  ports:
    - {name: reticulum, port: 4242, targetPort: reticulum}
    - {name: rns-public, port: 4244, targetPort: rns-public}
---
# Selector-less Service with no endpoints: the /metrics path on the public
# Ingress points here so ingress-nginx answers 503 instead of proxying the
# scrape endpoint to the internet. Prometheus scrapes the `hub` Service
# in-cluster with the bearer token (k8s/monitoring).
apiVersion: v1
kind: Service
metadata:
  name: hub-metrics-deny
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  ports:
    - {name: http, port: 6070}
