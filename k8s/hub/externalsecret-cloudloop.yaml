# The Cloudloop MQTT feed is how Iridium MO reaches the Hub: an mTLS
# subscription to Cloudloop's AWS IoT broker, outbound, so it needs no inbound
# path at all. The client certificate, its key and the Amazon root CA live in
# openbao ci-no/apps/meshsat-hub/cloudloop and are mounted as files, because
# HUB_CLOUDLOOP_MQTT_{CA,CERT,KEY} are paths, not PEM content. They were on the
# DMZ host's disk in the compose era and nothing carried them into the cluster,
# so the subscriber failed to start on every pod since the cutover (MESHSAT-964).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-cloudloop-certs
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hub-cloudloop-certs
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.pem
      remoteRef:
        key: ci-no/apps/meshsat-hub/cloudloop
        property: ca
    - secretKey: client-cert.pem
      remoteRef:
        key: ci-no/apps/meshsat-hub/cloudloop
        property: cert
    - secretKey: client-key.pem
      remoteRef:
        key: ci-no/apps/meshsat-hub/cloudloop
        property: key
