# Audit JSONL archive (HUB_AUDIT_ARCHIVE_PATH) until the S3 sink lands
# (MESHSAT-864 MR 22). Node-local; the Deployment's nodeAffinity keeps it off dmz06.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-audit-archive
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-hostpath-retain
  resources:
    requests:
      storage: 2Gi
