apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wg-easy
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  serviceName: wg-easy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-easy
    spec:
      # Control-plane tier: the worker tier is ~90% committed on two of three
      # nodes, this one is at 6-7%. Same placement as the database and NATS.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy
          env:
            # WG_HOST is what goes into the peer configurations the Hub hands
            # out, so it must be an address a field device can actually reach.
            - name: WG_HOST
              valueFrom: {configMapKeyRef: {name: wg-easy-config, key: WG_HOST}}
            - name: PASSWORD_HASH
              valueFrom: {secretKeyRef: {name: wg-easy-secrets, key: PASSWORD_HASH}}
            - name: WG_DEFAULT_ADDRESS
              value: "10.44.0.x"
            - name: WG_DEFAULT_DNS
              value: ""
            - name: UI_TRAFFIC_STATS
              value: "true"
          ports:
            - {name: ui, containerPort: 51821, protocol: TCP}
            - {name: wireguard, containerPort: 51820, protocol: UDP}
          securityContext:
            # Still NOT SYS_MODULE, and still no /lib/modules hostPath -- that is
            # the right to load arbitrary kernel code and the wireguard and
            # iptable_nat modules are loaded on the nodes instead.
            #
            # runAsUser 0 and NET_RAW are here because the container failed
            # without them: `iptables v1.8.11 (legacy): can't initialize iptables
            # table 'nat': Permission denied (you must be root)`. wg-quick shells
            # out to iptables-legacy, which needs NET_RAW for the netfilter
            # socket as well as NET_ADMIN, and added capabilities are permitted
            # but NOT effective for a non-root uid under allowPrivilegeEscalation
            # false. Loading iptable_nat on the nodes did NOT fix it on its own;
            # the blocker was the capability set, not the module.
            runAsUser: 0
            capabilities:
              add: [NET_ADMIN, NET_RAW]
              drop: [ALL]
            privileged: false
            allowPrivilegeEscalation: true
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/wireguard}
          readinessProbe:
            tcpSocket: {port: 51821}
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: [ReadWriteOnce]
        # local-hostpath-RETAIN, the class every other stateful workload here
        # uses. Retain and not delete because what is on this volume cannot be
        # rebuilt: wg-easy holds the server key and the peer database, hawkBit
        # holds its H2. There is no CSI and no replicated block storage in this
        # cluster, so the volume IS the copy.
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 1Gi
