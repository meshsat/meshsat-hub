# wg-easy's admin password, as a bcrypt hash. The Hub authenticates to the UI
# API with the PLAINTEXT (HUB_WG_PASSWORD in hub-secrets); wg-easy stores the
# hash. Both come from the same OpenBao property, which is why they cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wg-easy-secrets
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: wg-easy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wg-easy-secrets
    template:
      engineVersion: v2
      data:
        PASSWORD_HASH: "{{ .WG_PASSWORD_HASH }}"
  dataFrom:
    - extract:
        key: ci-no/apps/meshsat-hub/wireguard
