# PodSecurity is AUDITED and WARNED at `restricted` here, and deliberately NOT
# enforced (MESHSAT-1171, raised from baseline to restricted in MESHSAT-1191).
#
# Raising the bar before raising enforcement is the whole point of the staging
# this comment already describes: `baseline` says nothing about a container
# that keeps the default capability set, allows setuid escalation, has a
# writable root filesystem or runs without a seccomp profile -- which is the
# state every workload here was in. `restricted` names all four, so the audit
# annotations now report the real gap rather than a flattering subset.
#
# The namespace had no pod-security labels at all, which meant nothing noticed
# what its pods were allowed to do -- including tor, an internet-facing daemon
# holding the onion's private key. Enforcing is the obvious next move and it is
# the wrong one to make blind: this namespace legitimately runs two workloads
# that `baseline` forbids. The edge relay is a hostNetwork DaemonSet, because
# Cilium's NodePort does not answer traffic arriving through the xfrm tunnels,
# and wg-easy needs CAP_NET_ADMIN to manage a WireGuard interface. Enforcing
# baseline would evict the path every customer's traffic arrives on.
#
# So: surface the violations first, read them, exempt those two deliberately,
# then enforce. Turning the profile on before the workloads have been checked
# against it is the mistake that broke four containers in MESHSAT-1035.
apiVersion: v1
kind: Namespace
metadata:
  name: meshsat-hub
  labels:
    app.kubernetes.io/part-of: meshsat-hub
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# The Hub's own CNPG cluster. It had NO pod-security labels at all, so nothing
# reported what the database pods were allowed to do -- while meshsat-tak-db,
# the same operator holding less important data, enforces baseline and audits
# restricted (MESHSAT-1191).
#
# Audit and warn only, no enforcement, for the reason written on meshsat-tak-db:
# CNPG's pods have not been checked against either profile on this cluster, and
# enforcing untested would block a pod recreation on the cluster that holds the
# gapless invoice series and every tenant's data. Read the annotations first.
apiVersion: v1
kind: Namespace
metadata:
  name: meshsat-hub-db
  labels:
    app.kubernetes.io/part-of: meshsat-hub
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# Hosted per-tenant TAK (MESHSAT-1035). One OpenTAKServer per customer lives
# here, created by the tak-operator rather than by a commit.
#
# This is the one namespace in the tree that ENFORCES PodSecurity `restricted`,
# and it is the one that needs it: every pod is third-party Python reachable from
# the internet, and the owner accepted that it shares a kernel with etcd. The
# profile costs nothing, because the pods are already non-root with all
# capabilities dropped and a RuntimeDefault seccomp profile — enforcing it just
# means a future edit cannot quietly regress that.
apiVersion: v1
kind: Namespace
metadata:
  name: meshsat-tak
  labels:
    app.kubernetes.io/part-of: meshsat-hub
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# The TAK databases, separate from the Hub's cluster so that an OpenTAKServer is
# never one SQL injection away from the Hub's own tables.
#
# `restricted` is AUDITED here but only `baseline` is enforced: CNPG's own pods
# have not been verified against the restricted profile on this cluster, and
# enforcing it untested would block cluster creation rather than harden anything.
# Tighten to enforce once a CNPG upgrade has been checked against it; the audit
# annotations will say whether it would have passed.
apiVersion: v1
kind: Namespace
metadata:
  name: meshsat-tak-db
  labels:
    app.kubernetes.io/part-of: meshsat-hub
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
