apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hawkbit
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hawkbit
spec:
  serviceName: hawkbit
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hawkbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hawkbit
    spec:
      # Control-plane tier. Not a preference here: hawkBit is a Spring Boot JVM
      # at ~1.5Gi, and the worker tier was at 90% memory on two of three nodes.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        fsGroup: 1000
      containers:
        - name: hawkbit
          # Pinned to the digest that was running when this was fixed. It was
          # an untagged `latest` before, which is how the H2 problem below can
          # arrive silently on any pod replacement: the image moves, the
          # bundled H2 moves with it, and nothing in this file changed.
          image: docker.io/hawkbit/hawkbit-update-server@sha256:9120fb1d7687b9ec8e9ee006b54b10a75f6f941788fbd23942e9808fe42a2e07
          env:
            # Postgres on the shared CNPG cluster (MESHSAT-1131), not the bundled
            # H2. H2 was one file on a node-local volume with no backup, and its
            # version was whatever the image carried -- which is how OTA broke on
            # day one (H2 2.x removed IDENTITY(); every REST call answered 500
            # while the pod sat 1/1 Running). The Hub's Postgres is backed up to
            # S3 nightly, survives a node, and does not change under a manifest.
            #
            # The image ships a `postgresql` Spring profile
            # (application-postgresql.properties) that sets spring.jpa.database
            # and the driver class. Activating it is the supported way to say
            # "this is Postgres"; setting those two by hand would be a copy of
            # upstream's file that drifts.
            - name: SPRING_PROFILES_ACTIVE
              value: "postgresql"
            # The -rw service: hawkBit writes. sslmode=require, as the Hub uses.
            # Database `hawkbit`, owned by role `hawkbit` -- neither the Hub's
            # role nor hawkBit's can read the other's tables (k8s/db/).
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://meshsat-hub-main-rw.meshsat-hub-db.svc:5432/hawkbit?sslmode=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "hawkbit"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: hawkbit-secrets, key: DB_PASSWORD}}
            # The volume that used to hold H2 now holds ARTIFACTS. hawkBit's
            # artifact store defaults to a path relative to the working dir,
            # i.e. the container's ephemeral layer -- an uploaded firmware image
            # would vanish on the next pod replacement. This keeps the existing
            # claim (volumeClaimTemplates are immutable anyway) and gives it a
            # job. The old data.mv.db beside it is dead and harmless; it has no
            # rollouts in it, because none ever succeeded on H2.
            - name: ORG_ECLIPSE_HAWKBIT_REPOSITORY_FILE_PATH
              value: "/var/lib/hawkbit/artifacts"
            # Heap capped well under the limit: a JVM that sizes its heap from
            # the cgroup limit and then needs metaspace and thread stacks on top
            # is how a container gets OOM-killed while "within" its limit.
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx1g"
            # hawkbit.security.user is a MAP keyed by username in this version,
            # not a scalar. The first attempt set hawkbit.security.user.name and
            # the container refused to start: "No converter found capable of
            # converting from type [java.lang.String] to type
            # [TenantAwareUserProperties$User]". The username is therefore part of
            # the PROPERTY PATH, which is why it is a literal here and not read
            # from the Secret -- an env var name cannot come from a Secret.
            - name: HAWKBIT_SECURITY_USER_MESHSATHUB_PASSWORD
              valueFrom: {secretKeyRef: {name: hawkbit-secrets, key: PASSWORD_HASH}}
            - name: HAWKBIT_SECURITY_USER_MESHSATHUB_ROLES
              value: "TENANT_ADMIN"
            - name: HAWKBIT_SECURITY_USER_MESHSATHUB_TENANT
              value: "DEFAULT"
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/hawkbit}
          startupProbe:
            # A Spring Boot cold start with an H2 schema creation is slow, and a
            # readiness probe alone would restart it mid-boot forever.
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # local-hostpath-RETAIN, the class every other stateful workload here
        # uses. Retain and not delete because what is on this volume cannot be
        # rebuilt: wg-easy holds the server key and the peer database, hawkBit
        # holds its H2. There is no CSI and no replicated block storage in this
        # cluster, so the volume IS the copy.
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 5Gi
