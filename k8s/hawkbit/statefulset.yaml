apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hawkbit
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hawkbit
spec:
  serviceName: hawkbit
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hawkbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hawkbit
    spec:
      # Control-plane tier. Not a preference here: hawkBit is a Spring Boot JVM
      # at ~1.5Gi, and the worker tier was at 90% memory on two of three nodes.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        fsGroup: 1000
      containers:
        - name: hawkbit
          image: docker.io/hawkbit/hawkbit-update-server
          env:
            # The bundled H2 on a node-local volume. Deliberate: this instance
            # serves the default tenant's own kit. A tenant running OTA at fleet
            # scale brings its own hawkBit, which is what the provider is for.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:h2:/var/lib/hawkbit/data;DB_CLOSE_DELAY=-1"
            - name: SPRING_DATASOURCE_USERNAME
              value: "sa"
            # Heap capped well under the limit: a JVM that sizes its heap from
            # the cgroup limit and then needs metaspace and thread stacks on top
            # is how a container gets OOM-killed while "within" its limit.
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx1g"
            - name: HAWKBIT_SECURITY_USER_NAME
              valueFrom: {secretKeyRef: {name: hawkbit-secrets, key: USERNAME}}
            - name: HAWKBIT_SECURITY_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: hawkbit-secrets, key: PASSWORD_HASH}}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/hawkbit}
          startupProbe:
            # A Spring Boot cold start with an H2 schema creation is slow, and a
            # readiness probe alone would restart it mid-boot forever.
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # local-hostpath-RETAIN, the class every other stateful workload here
        # uses. Retain and not delete because what is on this volume cannot be
        # rebuilt: wg-easy holds the server key and the peer database, hawkBit
        # holds its H2. There is no CSI and no replicated block storage in this
        # cluster, so the volume IS the copy.
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 5Gi
