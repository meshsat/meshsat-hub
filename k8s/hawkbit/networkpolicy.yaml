# hawkBit is the OTA update server: it decides what firmware a field device
# installs, which makes it one of the highest-consequence workloads here.
# Observed: hub -> :8080, plus the relay (device DDI calls and the web UI) and the
# httpGet probes. The postgresql flows Hubble showed are hawkBit's own OUTBOUND
# connection being answered on an ephemeral port; conntrack covers those and they
# need no rule.
# Built from flows Hubble actually observed (MESHSAT-1205), not from the
# architecture diagram. Traffic arriving through the hostNetwork edge relay is
# SNAT'd to the node's cilium_host address, so it presents as `reserved:host` /
# `reserved:remote-node` rather than as an ingress-nginx endpoint -- the same
# Cilium SNAT behaviour that once attributed every client to six internal
# addresses. That is why these rules say `fromEntities` and not `fromEndpoints`.
# The kubelet's probe comes from the same place, which is why the service port is
# opened to `host` even where nothing else needs it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hawkbit-confine
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hawkbit
    app.kubernetes.io/part-of: meshsat-hub
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hawkbit
  ingress:
    # The Hub itself.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hub
            io.kubernetes.pod.namespace: meshsat-hub
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    # The edge relay (hostNetwork, SNAT'd to cilium_host) and the kubelet probe.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
