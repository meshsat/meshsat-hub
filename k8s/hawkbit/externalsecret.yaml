# hawkBit's admin account. The Hub authenticates to the Management API with the
# username and PLAINTEXT password; hawkBit stores the bcrypt hash. Both come from
# the same OpenBao property so they cannot drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hawkbit-secrets
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hawkbit
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hawkbit-secrets
    template:
      engineVersion: v2
      data:
        USERNAME: "{{ .HAWKBIT_USERNAME }}"
        PASSWORD_HASH: "{{ .HAWKBIT_PASSWORD_HASH }}"
        # The database role's password (MESHSAT-1131). The SAME OpenBao property
        # feeds CNPG's db-role-hawkbit Secret in meshsat-hub-db, so the role and
        # the client cannot disagree about it.
        DB_PASSWORD: "{{ .HAWKBIT_DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: ci-no/apps/meshsat-hub/hawkbit
