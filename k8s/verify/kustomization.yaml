apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - externalsecret.yaml
  - state-configmap.yaml
  - cronjob.yaml

# The suites travel as a ConfigMap: the same files a person runs from the
# runner, mounted at /suites. No name-suffix hash: kustomize does not rewrite
# the reference inside a CronJob's pod template (the first manual Job sat in
# ContainerCreating on "configmap hub-verify-suites not found"), and a Job
# mounts whatever the ConfigMap holds when it starts, so a hash buys nothing.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: hub-verify-suites
    files:
      - suites/run.sh
      - suites/kubectl
      - suites/deployed-is-pinned.sh
      - suites/capabilities-suite.py
      - suites/position-dedup-suite.py
      - suites/integrations-replica-suite.py
      - suites/quota-suite.py
      - suites/notify-e2e.py
      - suites/journey-suite.py
      - suites/onion-e2e.sh
      - suites/status-page-suite.py
