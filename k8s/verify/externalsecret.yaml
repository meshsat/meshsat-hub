# The verify job's own secrets (MESHSAT-1153): the status page heartbeat it
# beats on PASS, and the operators' ntfy topic it pushes to on FAIL. OpenBao
# ci-no/apps/meshsat-hub/verify.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-verify-secrets
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub-verify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hub-verify-secrets
    template:
      engineVersion: v2
      data:
        VERIFY_HEARTBEAT_SECRET: "{{ .VERIFY_HEARTBEAT_SECRET }}"
        NTFY_URL: "{{ .NTFY_URL }}"
        NTFY_TOPIC: "{{ .NTFY_TOPIC }}"
        NTFY_TOKEN: "{{ .NTFY_TOKEN }}"
  dataFrom:
    - extract:
        key: ci-no/apps/meshsat-hub/verify
