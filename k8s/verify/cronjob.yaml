# Nightly production verification (MESHSAT-1153). See suites/run.sh for what
# runs and how it reports. 03:15 Amsterdam: after the 02:45 database backup
# and clear of the 02:30 race-detector pipeline.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-verify
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub-verify
spec:
  schedule: "15 3 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hub-verify
        spec:
          serviceAccountName: hub-verify
          restartPolicy: Never
          # Control-plane tier like the other jobs: the workers are committed.
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/meshsat/meshsat-hub-verify
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: hub-verify-secrets
                - configMapRef:
                    name: hub-verify-state
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: suites
                  mountPath: /suites
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: suites
              configMap:
                name: hub-verify-suites
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
