# What the nightly verification may touch (MESHSAT-1153). The suites read the
# Hub's and the database's state the way they do from the runner: exec into a
# Hub pod (printenv, wget against localhost), exec psql in the CNPG primary,
# read the Hub's logs, and for the .onion probe create and delete one throwaway
# pod. journey-suite talks to the identity provider over its REST API with the
# Hub's own token and needs no exec there. Nothing here may create a Secret,
# patch a Deployment or read another namespace's Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-verify
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub-verify
# The verify image is a private GHCR package like the Hub's; the same pull
# secret (platform/registry-externalsecret.yaml) is the only way to fetch it.
# The first manual Job sat in ImagePullBackOff without this.
imagePullSecrets:
  - name: registry-meshsat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-verify
  namespace: meshsat-hub
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    # notify-e2e reads HUB_APPRISE_URL from the Hub's ConfigMap (not a Secret);
    # nothing else, by name.
    resources: ["configmaps"]
    resourceNames: ["hub-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # position-dedup-suite publishes through the real broker with the Hub's own
  # MQTT credentials; this is the ONLY Secret the job may read.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["nats-secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-verify
  namespace: meshsat-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-verify
subjects:
  - kind: ServiceAccount
    name: hub-verify
    namespace: meshsat-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-verify
  namespace: meshsat-hub-db
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-verify
  namespace: meshsat-hub-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-verify
subjects:
  - kind: ServiceAccount
    name: hub-verify
    namespace: meshsat-hub
