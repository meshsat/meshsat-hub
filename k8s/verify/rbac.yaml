# What the nightly verification may touch (MESHSAT-1153). The suites read the
# Hub's and the database's state the way they do from the runner: exec into a
# Hub pod (printenv, wget against localhost), exec psql in the CNPG primary,
# read the Hub's logs, and for the .onion probe create and delete one throwaway
# pod. journey-suite also execs `ak shell` in the identity provider to
# approve and purge its own probe account. Nothing here may create a Secret,
# patch a Deployment or read another namespace's Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-verify
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub-verify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-verify
  namespace: meshsat-hub
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-verify
  namespace: meshsat-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-verify
subjects:
  - kind: ServiceAccount
    name: hub-verify
    namespace: meshsat-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-verify
  namespace: meshsat-hub-db
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-verify
  namespace: meshsat-hub-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-verify
subjects:
  - kind: ServiceAccount
    name: hub-verify
    namespace: meshsat-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-verify
  namespace: omoikane
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-verify
  namespace: omoikane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-verify
subjects:
  - kind: ServiceAccount
    name: hub-verify
    namespace: meshsat-hub
