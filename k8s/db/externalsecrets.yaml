# CNPG credentials, sourced from openbao ci-no/apps/meshsat-hub/cnpg.
# CNPG needs basic-auth Secrets (username + password) for initdb and managed roles.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-hub-db-credentials
  namespace: meshsat-hub-db
  labels:
    app.kubernetes.io/name: meshsat-hub-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-hub-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: meshsat
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: meshsat_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-role-meshsat
  namespace: meshsat-hub-db
  labels:
    app.kubernetes.io/name: meshsat-hub-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: db-role-meshsat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: meshsat
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: meshsat_password
---
# barman object store credentials (SeaweedFS S3 identity cnpg-meshsat-hub, bucket cnpg-meshsat-hub).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-barman-creds
  namespace: meshsat-hub-db
  labels:
    app.kubernetes.io/name: meshsat-hub-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cnpg-barman-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: barman_access_key
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: barman_secret_key
---
# hawkBit's database role (MESHSAT-1131). Same shape as db-role-meshsat: CNPG's
# managed role reads a basic-auth Secret in THIS namespace, and the hawkBit pod in
# meshsat-hub reads the same OpenBao property through its own ExternalSecret, so
# the two cannot drift. The property lives beside hawkBit's other secrets at
# ci-no/apps/meshsat-hub/hawkbit rather than under cnpg, because it is hawkBit's
# credential that happens to be honoured by Postgres, not the other way round.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-role-hawkbit
  namespace: meshsat-hub-db
  labels:
    app.kubernetes.io/name: meshsat-hub-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: db-role-hawkbit
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: hawkbit
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ci-no/apps/meshsat-hub/hawkbit
        property: HAWKBIT_DB_PASSWORD
