# The key that wraps every tenant's CA key at rest.
#
# This is the most consequential secret in the TAK feature: with it and a Secret
# dump you can impersonate any phone in any tenant; without it a Secret dump is
# ciphertext. It exists because this cluster stores Secrets unencrypted in etcd
# and Velero copies them to the object store, so "it is in a Secret" is not
# "it is protected".
#
# Written to ci-no/apps/meshsat-hub/tak before this manifest referenced it, in
# that order deliberately: External Secrets renders a missing property as the
# literal string `<no value>`, which is not empty and would sail past an
# `!= ""` guard. The operator's own ParseWrapKey refuses anything that is not 32
# bytes of hex, which is the second line of defence.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tak-operator-secrets
  namespace: meshsat-tak
  labels:
    app.kubernetes.io/name: tak-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tak-operator-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TAK_CA_WRAP_KEY
      remoteRef:
        key: ci-no/apps/meshsat-hub/tak
        property: ca_wrap_key
