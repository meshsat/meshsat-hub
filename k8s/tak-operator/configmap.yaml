# Non-secret configuration for the operator.
#
# The images live here rather than in the root kustomization's `images:` block,
# which is the documented exception: kustomize rewrites image fields on pod specs,
# and these are values the operator reads and puts into pod specs it writes at
# runtime. It also means bump_k8s_pin does not manage them — changing which
# OpenTAKServer customers run is a deliberate edit, not a side effect of a Hub
# build. `.gitlab-ci.yml` says the same thing beside the package:ots job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tak-operator-config
  namespace: meshsat-tak
  labels:
    app.kubernetes.io/name: tak-operator
data:
  # OpenTAKServer 1.7.13, built by package:ots from k8s/ots/Dockerfile and gated
  # by trivy:ots. Pinned by digest: a tag would let a rebuild change what
  # customers run without a commit.
  #
  # Moved 2026-09-12 (MESHSAT-1068). The previous digest c0428be3 carried 12
  # fixable CVEs -- 9 HIGH, 3 CRITICAL -- in perl-base and libsqlite3-0, which
  # arrive with python:3.13-slim-trixie and which the Dockerfile did not upgrade.
  # The rebuild scans clean: Total 0. This line is the reason the fix reaches a
  # tenant at all: package:ots pushed a new :1.7.13, and without changing the
  # digest here the operator would keep starting the vulnerable image. That is the
  # pin working as intended, not a defect -- but it means a CVE fix is two commits.
  # Moved again 2026-09-12 (MESHSAT-1057). Every instance was losing 134 seconds
  # of EVERY start to an un-timed GitHub fetch for marker icons that this
  # namespace's egress policy drops; the image now carries the archive and the
  # loader reads it from disk. Same two-commit shape as the CVE fix below, for the
  # same reason: the pin is what decides whether a fix reaches a tenant.
  #
  # ⚠ A REPIN IS NOT ENOUGH ON ITS OWN. The Deployment takes this ConfigMap
  # through `envFrom`, cmd/tak-operator/main.go reads TAK_OTS_IMAGE once at
  # startup into the Reconciler, and there is no reloader annotation -- so Argo
  # updating this file leaves the RUNNING operator creating instances from the
  # old image, silently. After this merges:
  #
  #     kubectl --context notrf01 -n meshsat-tak rollout restart deploy/tak-operator
  #
  # and check the new pod's startup line reports the digest below as ots_image.
  # This is the same trap that left the Hub running 121 minutes with the correct
  # Secret and the wrong Stripe key.
  TAK_OTS_IMAGE: "ghcr.io/meshsat/meshsat-hub-ots@sha256:8c68463c1bff7c0b1ba7426d492cd64a45a492fee698d2da1feaf6c59af7de4a"
  # In the pod because OpenTAKServer's socketio client connects to RabbitMQ as
  # `guest` with no credentials, and guest is loopback-only. Spike S5 settled
  # that it must run as the image's own uid 100: as root with capabilities
  # dropped its entrypoint fails chowning the data directory.
  # TODO pin by digest after the first pull, as k8s/NOTES.md says for stunnel.
  TAK_RABBITMQ_IMAGE: "docker.io/library/rabbitmq:4.1-alpine"
  # The instance's internal admin gateway. Same digest the basemap uses.
  TAK_NGINX_IMAGE: "docker.io/nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0"
  TAK_DB_NAMESPACE: "meshsat-tak-db"
  TAK_DB_CLUSTER: "meshsat-tak-main"
  # Every pass lists two small collections, so this is cheap. It is also the
  # worst-case delay before a customer who just turned TAK on sees an instance.
  TAK_RECONCILE_INTERVAL_SEC: "30"
  TAK_LOG_LEVEL: "info"
