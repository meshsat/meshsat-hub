# Redis x1: dedup + rate-limit state (HUB_MODE=kubernetes requires it). Small,
# AOF on, never on dmz06 (required nodeAffinity, LocalPV binds on first schedule).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["notrf01dmz06"]
      containers:
        - name: redis
          image: docker.io/library/redis
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
          envFrom:
            - secretRef:
                name: redis-secrets
          ports:
            - name: redis
              containerPort: 6379
          # REDISCLI_AUTH keeps the password out of the probe argv.
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli -p 6379 ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli -p 6379 ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 1Gi
