# KeyDB x2, multi-master: dedup and rate-limit state for both Hub replicas
# (HUB_MODE=kubernetes requires a shared store). It replaced a single Redis pod
# whose local volume pinned it to one machine, so losing that machine took the
# store with it (MESHSAT-711).
#
# Two replicas, not three: there is no quorum to satisfy, so two on two machines
# already survive any single loss, and the peer computation below is only
# correct for exactly two. Both accept writes, so the client Service can point
# at either; the Service is still called `redis` because that is the name the
# Hub dials, and nothing in the Hub changes.
#
# The pattern, the image digest and the flags are lifted from omoikane/keydb in
# this same cluster, which has been running them since 2026-08.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keydb
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: keydb
spec:
  serviceName: keydb-hs
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: keydb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keydb
    spec:
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      priorityClassName: meshsat-hub-critical
      # The control-plane tier, beside the database: the workers are 49, 90 and
      # 92 percent committed by other namespaces while these three sit near
      # zero, and a local volume binds permanently on first schedule, so
      # `preferred` would guarantee nothing.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: keydb
      containers:
        - name: keydb
          image: docker.io/eqalpha/keydb
          command:
            - sh
            - -c
            - |
              set -eu
              ORD="${HOSTNAME##*-}"
              PEER="$(( 1 - ORD ))"
              exec keydb-server \
                --port 6379 \
                --active-replica yes \
                --multi-master yes \
                --replicaof "keydb-${PEER}.keydb-hs.meshsat-hub.svc" 6379 \
                --requirepass "$REDIS_PASSWORD" \
                --masterauth "$REDIS_PASSWORD" \
                --appendonly yes \
                --maxmemory 256mb \
                --maxmemory-policy allkeys-lru
          envFrom:
            - secretRef:
                name: redis-secrets
          ports:
            - name: redis
              containerPort: 6379
          # REDISCLI_AUTH keeps the password out of the probe argv.
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" keydb-cli -p 6379 ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" keydb-cli -p 6379 ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: keydb
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 1Gi
