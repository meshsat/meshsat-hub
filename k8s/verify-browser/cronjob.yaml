# Nightly real-browser verification (MESHSAT-1224). 03:45 Amsterdam: after
# hub-verify at 03:15, which takes about two minutes, so a slow browser run
# cannot delay the suite that beats the status-page heartbeat.
#
# Why its own image and not the hub-verify one: Playwright does not support
# Alpine, and hub-verify is Alpine. Why not upstream's playwright/python
# unmodified: it ships the browsers but not the playwright package (see
# Dockerfile). The suite itself still travels as a ConfigMap, so changing a
# check is a ConfigMap change and not an image build. This image is outside the
# Kyverno `verify-meshsat-hub-image` match (ghcr.io/meshsat/meshsat-hub), so it
# needs no cosign signature -- but Kyverno DOES enforce the restricted profile
# here, hence runAsNonRoot, drop ALL and RuntimeDefault below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-browser-verify
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: hub-browser-verify
spec:
  schedule: "45 3 * * *"
  # Armed 2026-09-20 after a manual Job was seen to pass in-cluster (5/5 in 6 s,
  # image v1.58.0). It was shipped suspended because a nightly that pushes to
  # the operators' ntfy topic must not have its teething problems at 03:45 --
  # the very first run of this one did page.
  suspend: false
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hub-browser-verify
        spec:
          restartPolicy: Never
          # The image is in the private GHCR org, and this Job runs on the
          # `default` ServiceAccount (it needs no API access at all, unlike
          # hub-verify, whose SA carries pods/exec). default has no
          # imagePullSecrets, so the pull secret is named here.
          imagePullSecrets:
            - name: registry-meshsat
          # Control-plane tier like the other jobs: the workers are committed.
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            # pwuser, the unprivileged user the Playwright image ships with and
            # the owner of its browser cache.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: browser-verify
              image: ghcr.io/meshsat/meshsat-hub-browser-verify
              imagePullPolicy: IfNotPresent
              envFrom:
                # Reuses hub-verify's secret for NTFY_* only; nothing here
                # needs the admin key and nothing here authenticates.
                - secretRef:
                    name: hub-verify-secrets
              securityContext:
                allowPrivilegeEscalation: false
                # Chromium writes its profile and shared memory under $HOME,
                # which run.sh points at the tmp volume below.
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  # Under the namespace LimitRange max of 4Gi. Chromium with
                  # --disable-dev-shm-usage keeps its shared memory in /tmp,
                  # so the tmp volume carries it rather than a shm mount.
                  memory: 2Gi
              volumeMounts:
                - name: suites
                  mountPath: /suites
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: suites
              configMap:
                name: hub-browser-verify-suites
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
