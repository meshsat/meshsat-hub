apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob.yaml

# Same reasoning as k8s/verify: no name-suffix hash, because kustomize does
# not rewrite the reference inside a CronJob's pod template and a Job mounts
# whatever the ConfigMap holds when it starts.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: hub-browser-verify-suites
    files:
      - suites/run.sh
      - suites/browser-suite.py
      # Shipped beside the suite on purpose: the proof that the suite can fail
      # is part of the suite, and it is run from the runner, not by the Job.
      - suites/negative-proof.py
