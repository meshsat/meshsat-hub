# Credentials for meshsat-tak-main. CNPG needs basic-auth Secrets (username +
# password) for initdb and for managed roles.
#
# The barman credentials are the SAME object store identity the Hub's cluster
# uses, read from the existing `cnpg` path: this cluster writes to a `tak` prefix
# in that bucket rather than to a bucket of its own, because a new SeaweedFS
# identity cannot be provisioned from the repo. Keep the two ExternalSecrets
# separate anyway — one per namespace is how ESO works.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-tak-db-credentials
  namespace: meshsat-tak-db
  labels:
    app.kubernetes.io/name: meshsat-tak-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-tak-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: tak_admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg-tak
        property: tak_admin_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-role-tak-admin
  namespace: meshsat-tak-db
  labels:
    app.kubernetes.io/name: meshsat-tak-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: db-role-tak-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: tak_admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg-tak
        property: tak_admin_password
---
# barman object store credentials (SeaweedFS identity cnpg-meshsat-hub, bucket
# cnpg-meshsat-hub, prefix tak/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-barman-creds
  namespace: meshsat-tak-db
  labels:
    app.kubernetes.io/name: meshsat-tak-main
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cnpg-barman-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: barman_access_key
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: ci-no/apps/meshsat-hub/cnpg
        property: barman_secret_key
