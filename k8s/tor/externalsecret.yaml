# The hidden service identity key.
#
# The .onion address IS this key: lose it and the address changes, breaking every
# published reference to it. It used to live only on a node-local volume, which
# made one disk a single point of failure for a published identifier
# (MESHSAT-1121).
#
# Holding it here means the address is reproducible: a rebuilt cluster, a lost
# volume or a moved node all recover the SAME .onion, because the initContainer
# seeds it back. The volume is still `retain` -- this is the second copy, not a
# replacement for the first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tor-identity
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: tor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tor-identity
    template:
      engineVersion: v2
      data:
        # base64 in OpenBao because both are BINARY; the initContainer decodes.
        hs_ed25519_secret_key_b64: "{{ .HS_ED25519_SECRET_KEY_B64 }}"
        hs_ed25519_public_key_b64: "{{ .HS_ED25519_PUBLIC_KEY_B64 }}"
        hostname: "{{ .HOSTNAME }}"
  dataFrom:
    - extract:
        key: ci-no/apps/meshsat-hub/tor
