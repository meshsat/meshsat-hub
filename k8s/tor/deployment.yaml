apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tor
  namespace: meshsat-hub
  annotations:
    # Both of these read the identity ONCE, at pod start: tor from the volume
    # that seed-identity seeds, and onion-heartbeat from the tor-identity Secret
    # into its ONION env var. So rotating the key without rolling them leaves
    # the heartbeat probing an address that no longer exists and the status page
    # going DEGRADED for a change that actually succeeded -- which is exactly
    # what happened on the MESHSAT-1193 rotation and had to be fixed by hand.
    # Reloader turns a Secret change into an ordinary roll (MESHSAT-1193).
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: tor
spec:
  serviceName: tor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tor
    spec:
      # Control-plane tier, with the database, NATS and KeyDB. Tor is ~30Mi.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      # This pod holds the hidden service's private key, so it does not get the
      # namespace's default ServiceAccount token thrown in by default
      # (MESHSAT-1171). tor talks to the Tor network and to two ports; it has no
      # business holding a credential for the Kubernetes API.
      automountServiceAccountToken: false
      # NO fsGroup HERE, DELIBERATELY, and it is not an oversight to be tidied up.
      #
      # fsGroup: 100 was the obvious way to give uid 100 its volume, and it broke
      # tor. The kubelet's default fsGroupChangePolicy is Always: on EVERY pod
      # start it walks the volume, chgrps to the fsGroup and ORs in group bits --
      # 0700 becomes 2770, 0600 becomes 0660. tor's check_private_dir then
      # refuses to start at all:
      #
      #   [warn] Permissions on directory /var/lib/tor/hidden_service are too
      #          permissive.
      #   [err]  Reading config failed--see warnings above.
      #
      # It looked fine for as long as the pod was never restarted, because tor
      # itself creates the directory 0700 AFTER the kubelet has finished. The
      # first restart after that is when it dies, so this was latent from the
      # first deploy and would have gone off on any rollout, node drain or image
      # bump -- and it went off on a commit that had nothing to do with it.
      #
      # seed-identity runs as root and asserts ownership and modes below, which
      # is deterministic and needs no help from the kubelet.
      initContainers:
        # Seed the identity key if the volume does not already have one.
        #
        # Deliberately NOT an overwrite: the volume is authoritative while it
        # exists, and clobbering a live key on every restart would be a way to
        # lose one. This only restores after the volume is gone -- a rebuilt
        # cluster, a replaced node -- and then the SAME .onion comes back.
        #
        # tor refuses to start on a key it considers world-readable, so the mode
        # and ownership matter as much as the bytes: 0700 dir, 0600 files, uid
        # 100 which is `tor` in this image.
        - name: seed-identity
          image: docker.io/busybox
          command:
            - sh
            - -c
            - |
              set -eu
              d=/var/lib/tor/hidden_service
              if [ -s "$d/hs_ed25519_secret_key" ]; then
                echo "identity already present on the volume; leaving the key alone"
              else
                echo "no identity on the volume; restoring from the sealed backup"
                mkdir -p "$d"
                base64 -d < /seed/hs_ed25519_secret_key_b64 > "$d/hs_ed25519_secret_key"
                base64 -d < /seed/hs_ed25519_public_key_b64 > "$d/hs_ed25519_public_key"
                cp /seed/hostname "$d/hostname"
                echo "restored $(cat "$d/hostname")"
              fi
              # Permissions are asserted on EVERY start, restore or not. tor
              # refuses a key it considers too readable, and the thing that made
              # it too readable was the volume plumbing rather than the restore,
              # so fixing them only on the restore path fixes the wrong half.
              # 0700 dirs, 0600 files, uid 100 (`tor` in this image). The
              # provisioner hands out the volume root 0777, so that is included.
              chown -R 100:100 /var/lib/tor
              chmod 0700 /var/lib/tor
              find /var/lib/tor -type d -exec chmod 0700 {} \;
              find /var/lib/tor -type f -exec chmod 0600 {} \;
              ls -ldn "$d"
          # Capabilities dropped to the three this script actually needs, checked
          # against what it does rather than set to [ALL] and hoped (MESHSAT-1204).
          # It runs `chown -R 100:100` and `chmod` over /var/lib/tor, so:
          #   CHOWN        - the chown itself
          #   FOWNER       - chmod on files it does not own
          #   DAC_OVERRIDE - traverse and read the 0700 directory it created on a
          #                  PREVIOUS start, now owned by uid 100. Without it, uid 0
          #                  is checked like any other user and the `find` fails.
          # A plain drop: [ALL] here would work on a FRESH volume and then break on
          # the first restart, which is the worst possible failure shape for the
          # thing that holds the hidden service's identity -- and per the
          # crashlooping-pod rule it would have looked like an unrelated regression.
          # runAsUser 0 stays: it must assert ownership the kubelet will not.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: keys, mountPath: /var/lib/tor}
            - {name: identity, mountPath: /seed, readOnly: true}
      containers:
        - name: tor
          # Pinned by digest (MESHSAT-1171). This was an unpinned, untagged
          # upstream reference -- so the pod holding the onion's private key
          # would take whatever :latest resolved to on the next pull, from a
          # third party, with no review. The digest below is the image that has
          # been serving the onion; the heartbeat pod beside this one was
          # already digest-pinned, so this was an inconsistency rather than a
          # house style.
          image: docker.io/osminogin/tor-simple@sha256:6ad8d9f6880c0c0f0fc1fbe453c4ae0904d901924fb8a797f60d7d1475db1c89
          # No command or args override. The image already runs tor against
          # /etc/tor/torrc, which is where the ConfigMap is mounted, so there is
          # nothing to say. The first version passed args ["-f", "/etc/tor/torrc"]
          # and the container would not start at all: the image has no ENTRYPOINT,
          # so args REPLACED the command and "-f" became the executable
          # ("exec: \"-f\": executable file not found in $PATH").
          ports:
            - {name: or, containerPort: 9050, protocol: TCP}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # seccompProfile was the one restricted requirement this container still
            # missed; every capability was already gone (MESHSAT-1204).
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: keys, mountPath: /var/lib/tor}
            - {name: config, mountPath: /etc/tor/torrc, subPath: torrc, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: tor-config
        - name: identity
          secret:
            secretName: tor-identity
  volumeClaimTemplates:
    - metadata:
        name: keys
      spec:
        accessModes: [ReadWriteOnce]
        # retain: the .onion address IS this key. Losing it changes the address
        # and breaks every published reference to it.
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 1Gi
