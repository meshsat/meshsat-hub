apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tor
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: tor
spec:
  serviceName: tor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tor
    spec:
      # Control-plane tier, with the database, NATS and KeyDB. Tor is ~30Mi.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        # The image runs tor as uid 100; the key directory must belong to it or
        # tor refuses to start ("Private directory is not owned by this user").
        fsGroup: 100
      initContainers:
        # Seed the identity key if the volume does not already have one.
        #
        # Deliberately NOT an overwrite: the volume is authoritative while it
        # exists, and clobbering a live key on every restart would be a way to
        # lose one. This only restores after the volume is gone -- a rebuilt
        # cluster, a replaced node -- and then the SAME .onion comes back.
        #
        # tor refuses to start on a key it considers world-readable, so the mode
        # and ownership matter as much as the bytes: 0700 dir, 0600 files, uid
        # 100 which is `tor` in this image.
        - name: seed-identity
          image: docker.io/busybox
          command:
            - sh
            - -c
            - |
              set -eu
              d=/var/lib/tor/hidden_service
              if [ -s "$d/hs_ed25519_secret_key" ]; then
                echo "identity already present on the volume; leaving it alone"
                exit 0
              fi
              echo "no identity on the volume; restoring from the sealed backup"
              mkdir -p "$d"
              base64 -d < /seed/hs_ed25519_secret_key_b64 > "$d/hs_ed25519_secret_key"
              base64 -d < /seed/hs_ed25519_public_key_b64 > "$d/hs_ed25519_public_key"
              cp /seed/hostname "$d/hostname"
              chmod 0700 "$d"; chmod 0600 "$d"/hs_ed25519_* "$d/hostname"
              chown -R 100:100 "$d"
              echo "restored $(cat "$d/hostname")"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: keys, mountPath: /var/lib/tor}
            - {name: identity, mountPath: /seed, readOnly: true}
      containers:
        - name: tor
          image: docker.io/osminogin/tor-simple
          # No command or args override. The image already runs tor against
          # /etc/tor/torrc, which is where the ConfigMap is mounted, so there is
          # nothing to say. The first version passed args ["-f", "/etc/tor/torrc"]
          # and the container would not start at all: the image has no ENTRYPOINT,
          # so args REPLACED the command and "-f" became the executable
          # ("exec: \"-f\": executable file not found in $PATH").
          ports:
            - {name: or, containerPort: 9050, protocol: TCP}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: keys, mountPath: /var/lib/tor}
            - {name: config, mountPath: /etc/tor/torrc, subPath: torrc, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: tor-config
        - name: identity
          secret:
            secretName: tor-identity
  volumeClaimTemplates:
    - metadata:
        name: keys
      spec:
        accessModes: [ReadWriteOnce]
        # retain: the .onion address IS this key. Losing it changes the address
        # and breaks every published reference to it.
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 1Gi
