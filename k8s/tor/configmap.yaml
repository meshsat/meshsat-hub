apiVersion: v1
kind: ConfigMap
metadata:
  name: tor-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: tor
data:
  torrc: |
    # Hidden service for the Hub. v3 addresses are the only kind tor still
    # creates; the version line is explicit so a future default cannot move it.
    HiddenServiceDir /var/lib/tor/hidden_service
    HiddenServiceVersion 3
    # The Hub's API, and the MQTT broker for bridges that reach the Hub over Tor
    # instead of paying for satellite airtime.
    #
    # 6079, not 6070: the Hub serves the same routes on a second listener that
    # exists only for this, so it can tell an onion request from one that came
    # through the edge (MESHSAT-1169). tor forwards raw TCP, so everything else
    # about the request -- including X-Forwarded-For -- is written by the
    # anonymous client, while the peer address is the tor pod, which the Hub
    # trusts as a proxy because the trusted list names the pod network. On the
    # shared port those two facts together let a Tor client choose its own
    # rate-limit key, and choose a real person's. The port is the one thing the
    # client does not choose, so the port is what carries the meaning; a marker
    # header would only move the question to who else can reach the port.
    HiddenServicePort 80 hub:6079
    # MQTT goes through stunnel, not straight at the broker (MESHSAT-1170). The
    # broker's own 1883 has no tls block -- no server certificate, no client
    # certificate, the password in a plaintext CONNECT -- while the websocket
    # listener serving the same clients at the edge requires TLS and verifies a
    # client certificate against the bridge CA. stunnel gives the onion the same
    # two factors, because nats-server cannot offer a second MQTT listener while
    # keeping the plaintext one for the Hub's own in-cluster connection.
    HiddenServicePort 1883 stunnel:1883
    # No SOCKS port: this instance exists to PUBLISH a service, not to give
    # anything in the cluster an outbound anonymising proxy.
    SocksPort 0
    Log notice stdout
