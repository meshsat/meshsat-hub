# The .onion as a row on status.meshsat.net (MESHSAT-1134).
#
# Nothing cheaper than a fetch THROUGH the Tor network is honest here: pod
# Running, the hostname file, "Bootstrapped 100%" and /api/tor/onion were all
# green through the fsGroup outage (see deployment.yaml). So every ten minutes
# this Job starts a throwaway Tor client, fetches the Hub's /healthz over the
# hidden service, and only then beats a Kener HEARTBEAT monitor. Silence for
# 25 min shows DEGRADED on the page, 45 min DOWN.
#
# One container, deliberately: a tor sidecar never exits, so a two-container
# Job would never complete. The image ships tor, sh and curl (checked
# 2026-09-14) and runs as uid 100; torrc and DataDirectory live in a /tmp emptyDir.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: onion-heartbeat
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: tor
    app.kubernetes.io/component: onion-heartbeat
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        metadata:
          labels:
            app.kubernetes.io/name: onion-heartbeat
        spec:
          restartPolicy: Never
          # Control-plane tier, beside tor-0 (see deployment.yaml for why).
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: probe
              # osminogin/tor-simple, pinned (tor 0.4.9.12)
              image: docker.io/osminogin/tor-simple@sha256:6ad8d9f6880c0c0f0fc1fbe453c4ae0904d901924fb8a797f60d7d1475db1c89
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # Not the image's torrc: it logs to /var/log/tor, which does not exist
                  # on a read-only root, so tor exited before bootstrapping (and --quiet
                  # hid it). tor also refuses -f /dev/null ("Unable to open configuration
                  # file"), so the three lines it needs are written to the writable /tmp.
                  # tor refuses a DataDirectory it does not own, and an emptyDir mounts
                  # root-owned; a subdirectory made here is owned by uid 100.
                  mkdir -p /tmp/tor && chmod 700 /tmp/tor
                  printf 'SocksPort 127.0.0.1:9050\nDataDirectory /tmp/tor\nLog notice stderr\n' > /tmp/torrc
                  tor -f /tmp/torrc &
                  code=000
                  # Bootstrap plus descriptor fetch is 20-90 s on a good day; keep trying
                  # inside the Job's own deadline rather than trusting one attempt.
                  for i in $(seq 1 40); do
                    sleep 5
                    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 \
                      --socks5-hostname 127.0.0.1:9050 "http://${ONION}/healthz" 2>/dev/null) || code=000
                    [ "$code" = "200" ] && break
                  done
                  if [ "$code" = "200" ]; then
                    curl -fsS --max-time 20 -o /dev/null "https://status.meshsat.net/ext/heartbeat/tor-onion/${HEARTBEAT_SECRET}" && echo "onion reachable, heartbeat sent"
                  else
                    echo "onion NOT reachable through Tor (last HTTP $code); no heartbeat" >&2
                    exit 1
                  fi
              env:
                - name: ONION
                  valueFrom: {secretKeyRef: {name: tor-identity, key: hostname}}
                - name: HEARTBEAT_SECRET
                  valueFrom: {secretKeyRef: {name: tor-identity, key: onion_heartbeat_secret}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: tmp, emptyDir: {}}
