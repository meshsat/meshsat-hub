apiVersion: apps/v1
kind: Deployment
metadata:
  name: stunnel
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: stunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stunnel
    spec:
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: stunnel
          image: ghcr.io/meshsat/meshsat-hub-stunnel
          ports:
            - name: reticulum
              containerPort: 4243
          readinessProbe:
            tcpSocket: {port: reticulum}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: reticulum}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {memory: 16Mi, cpu: 20m}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/stunnel/stunnel.conf, subPath: stunnel.conf, readOnly: true}
            - {name: tls, mountPath: /etc/stunnel/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/stunnel/bridge-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: stunnel-config}
        - name: tls
          secret: {secretName: meshsat-net-tls, defaultMode: 0440}
        - name: bridge-ca
          secret: {secretName: meshsat-bridge-ca}
        - name: tmp
          emptyDir: {}
