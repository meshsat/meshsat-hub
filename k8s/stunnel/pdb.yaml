kind: PodDisruptionBudget
metadata:
  name: stunnel
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: stunnel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stunnel
