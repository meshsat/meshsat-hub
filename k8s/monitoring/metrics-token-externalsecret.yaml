# The Hub guards /metrics with HUB_METRICS_TOKEN (MR 14). Prometheus needs the
# same value from a Secret in its own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-hub-metrics-token
  namespace: monitoring
  labels:
    app.kubernetes.io/name: meshsat-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-hub-metrics-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: ci-no/apps/meshsat-hub/hub
        property: HUB_METRICS_TOKEN
