apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MeshSat Hub on notrf01cl01k8s (MESHSAT-864 / MESHSAT-930).
# Synced by the single Argo CD Application `meshsat-hub` (NO infra repo
# k8s/argocd-apps/meshsat-hub/). Image tags/digests are pinned ONLY here, in the
# images: block below; the CI job bump_k8s_pin rewrites the Hub digest on every
# main pipeline (k8s/scripts/bump-pin.py).

labels:
  - pairs:
      app.kubernetes.io/part-of: meshsat-hub
      environment: production
    includeSelectors: false

resources:
  - namespaces.yaml
  - platform/
  - db/
  - nats/
  - redis/
  - stunnel/
  - hub/
  - monitoring/

images:
  # --- the Hub itself (CI-built, private GHCR; pull secret registry-meshsat) ---
  - name: ghcr.io/meshsat/meshsat-hub
    digest: sha256:a1914d2f4c19d3df2a44058465dd8cdce77079ef20eba546d4b05d47d2072914  # main 4790250e (2026-09-08)
  # stunnel for the Reticulum leg, built by the package:stunnel CI job from k8s/stunnel/Dockerfile.
  - name: ghcr.io/meshsat/meshsat-hub-stunnel
    newTag: "3.21"
  # --- upstream pins (resolved 2026-09-08) ---
  - name: docker.io/library/nats
    digest: sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3  # 2.14.6-alpine (MESHSAT-973: reload no longer panics on a user without a permissions block)
  - name: docker.io/natsio/nats-server-config-reloader
    digest: sha256:bca7e221ec6f1221ecd74e2c13b075c913a5bcd998e87a4da4d747033440ee93  # 0.18.2
  - name: docker.io/natsio/prometheus-nats-exporter
    digest: sha256:26c826662ac8424597cc9bdf89ea5b606eb66e3c11db9b1215c27d2076bbb01b  # 0.17.3
  - name: docker.io/library/redis
    digest: sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf  # 7.4-alpine
  - name: docker.io/library/haproxy
    digest: sha256:475863a372c92c3dab3d59eafbbf8019dceebcd0c456594551b160ecdba4bdb9  # 3.1-alpine
