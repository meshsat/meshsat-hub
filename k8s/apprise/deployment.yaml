apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: apprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apprise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apprise
    spec:
      # Control-plane tier, with the rest of the supporting services.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: apprise
          image: docker.io/caronc/apprise
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          env:
            # Stateless mode: the Hub passes the target URLs on every request
            # rather than Apprise storing configurations of its own. That keeps
            # whose-targets-are-these a question with one answer -- the Hub's
            # per-tenant NotificationPref rows -- instead of two.
            - name: APPRISE_STATELESS_URLS
              value: ""
            # THE reason this kept being OOMKilled, and why raising the memory
            # limit did not help. gunicorn sizes its worker pool from the CPU
            # count it can see, which in a container is the NODE's -- so it
            # booted 70+ workers, each importing Apprise's whole 90-backend
            # plugin set, and exhausted any limit it was given.
            #
            # Two workers is ample: this relay handles an alert now and then, not
            # a request stream. WEB_CONCURRENCY is gunicorn's own variable, so it
            # holds regardless of what the image wraps around it.
            - name: WEB_CONCURRENCY
              value: "2"
            - name: APPRISE_WORKER_COUNT
              value: "2"
          # Sized for the TWO workers pinned above. The earlier 256Mi and 512Mi
          # limits both OOMKilled, but memory was never the problem: an unbounded
          # worker pool was, and no limit survives 70 copies of the plugin set.
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          # No capability drop. The image creates its own runtime user at
          # startup (linuxserver-style PUID/PGID) and with drop: [ALL] the
          # useradd fails -- "failure while writing changes to /etc/shadow" --
          # and it aborts before serving anything.
          #
          # Accepted rather than fought: this is a stateless relay with no
          # volume, no ingress and no credentials of its own, reachable only
          # in-cluster. The hardening would have bought very little and cost a
          # service that does not start.
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /status, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
