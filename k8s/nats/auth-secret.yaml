# Bootstrap content of the NATS users file. The Hub rewrites `data` with one
# user per bridge (internal/bridge/natsauth.go); the Argo Application ignores
# /data on this Secret so the two do not fight. Only the shared Hub user is
# here, and its password is a reference nats-server resolves from the pod env,
# so this file carries no secret value.
apiVersion: v1
kind: Secret
metadata:
  name: meshsat-nats-auth
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
type: Opaque
stringData:
  users.conf: |
    # bootstrap: rendered by meshsat-hub after its first start
    authorization {
      users = [
        { user: meshsat, password: $NATS_MQTT_PASSWORD, permissions: { publish: { allow: [">"] }, subscribe: { allow: [">"] } } }
      ]
    }
