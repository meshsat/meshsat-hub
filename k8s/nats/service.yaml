# In-cluster endpoints (Hub -> nats:1883, exporter scrape) and the websocket
# Service the edge relay targets.
# Headless: the StatefulSet's governing Service, so nats-N.nats resolves for the
# cluster routes and nats.meshsat-hub.svc gives the Hub the pod addresses (the
# NATS client fails over between them). clusterIP is immutable, hence Replace.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: mqtt, port: 1883, targetPort: mqtt}
    - {name: monitor, port: 8222, targetPort: monitor}
    - {name: metrics, port: 7777, targetPort: metrics}
    - {name: cluster, port: 6222, targetPort: cluster}
---
apiVersion: v1
kind: Service
metadata:
  name: nats-ws
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - {name: websocket, port: 9443, targetPort: websocket}
    # monitor: the edge relay's health check target (GET /healthz), see platform/edge-relay.yaml
    - {name: monitor, port: 8222, targetPort: monitor}
