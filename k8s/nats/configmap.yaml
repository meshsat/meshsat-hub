# NATS server config, descended from the compose-era nats-mtls.conf (removed in MR 23)
# minus the leafnode block (single site now). Bridges connect over wss://mqtt-hub.meshsat.net:443
# -> edge -> edge-relay :9443 -> this websocket listener (TLS termination + bridge
# client certificate verification against the Hub bridge CA). The Hub connects
# over plain MQTT :1883 in-cluster. $NATS_MQTT_PASSWORD and $POD_NAME come from the pod env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http_port: 8222
    # One name per pod (downward API): a JetStream cluster needs distinct servers.
    server_name: $POD_NAME
    pid_file: /var/run/nats/nats.pid

    jetstream {
      store_dir: /data/jetstream
      max_mem: 256MB
      max_file: 1GB
    }

    # Three-node JetStream cluster (MESHSAT-711 phase 7). Routes resolve through
    # the headless `nats-headless` Service; a pod keeps retrying its peers while
    # they start. Clients are not told the pod addresses: the Hub uses the Service,
    # bridges come in through the edge relay.
    cluster {
      name: meshsat
      listen: 0.0.0.0:6222
      no_advertise: true
      connect_retries: 120
      routes: [
        nats-route://nats-0.nats-headless.meshsat-hub.svc.cluster.local:6222
        nats-route://nats-1.nats-headless.meshsat-hub.svc.cluster.local:6222
        nats-route://nats-2.nats-headless.meshsat-hub.svc.cluster.local:6222
      ]
    }

    # Users and permissions live in the Secret meshsat-nats-auth (users.conf),
    # rendered by the Hub: the shared `meshsat` user for the Hub itself (password
    # from the pod environment) and one user per bridge with its bcrypt hash and
    # permissions confined to its subtree (MESHSAT-864 MR 21). The reloader
    # SIGHUPs nats-server when the file changes. no_auth_user is deliberately unset.
    include "auth/users.conf"

    mqtt {
      listen: 0.0.0.0:1883
      ack_wait: "30s"
      max_ack_pending: 100
      # Session, retained and QoS streams replicated on all three servers so a
      # bridge session survives the loss of the server it was created on.
      stream_replicas: 3
    }

    websocket {
      port: 9443
      tls {
        cert_file: /etc/nats/tls/tls.crt
        key_file: /etc/nats/tls/tls.key
        ca_file: /etc/nats/bridge-ca/ca.crt
        verify: true
        timeout: 5
      }
    }
