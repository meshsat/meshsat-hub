# NATS server config, descended from the compose-era nats-mtls.conf (removed in MR 23)
# minus the leafnode block (single site now). Bridges connect over wss://mqtt-hub.meshsat.net:443
# -> edge -> edge-relay :9443 -> this websocket listener (TLS termination + bridge
# client certificate verification against the Hub bridge CA). The Hub connects
# over plain MQTT :1883 in-cluster. $NATS_MQTT_PASSWORD and $POD_NAME come from the pod env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http_port: 8222
    # One name per pod (downward API): a JetStream cluster needs distinct servers.
    server_name: $POD_NAME
    pid_file: /var/run/nats/nats.pid

    jetstream {
      store_dir: /data/jetstream
      max_mem: 256MB
      max_file: 1GB
    }

    # Three-node JetStream cluster (MESHSAT-711 phase 7). Routes resolve through
    # the headless `nats-headless` Service; a pod keeps retrying its peers while
    # they start. Clients are not told the pod addresses: the Hub uses the Service,
    # bridges come in through the edge relay.
    cluster {
      name: meshsat
      listen: 0.0.0.0:6222
      no_advertise: true
      connect_retries: 120
      # Routes authenticate (posture V12, MESHSAT-1194). Second attempt, after
      # the first split the cluster on 2026-09-18 and was reproduced offline:
      # nats-server 2.14 applies this block to INBOUND routes only; an outbound
      # route carries whatever userinfo its URL has, and a bare URL carries
      # none. So the route list lives in routes.conf, rendered by the
      # ExternalSecret with route:<password>@ in each URL, and is included
      # here. The password never enters this ConfigMap. Rollback is deleting
      # this block and inlining bare URLs; the reloader applies it in ~20 s.
      authorization {
        user: route
        password: $NATS_ROUTE_PASSWORD
        timeout: 2
      }
      # Routes also speak TLS, with the certificate cert-manager issues from the
      # cluster's internal CA (Certificate nats-routes, secret nats-routes-tls;
      # ClusterIssuer meshsat-internal-ca). verify: true makes a peer present a
      # certificate from that CA as well as the credential above. Reproduced
      # offline before this second attempt: three members rolled plain -> TLS
      # one at a time re-form all routes within a second of the last restart
      # and re-elect the meta leader within six; while a member is on the other
      # side of the roll it is isolated (no route can be mixed), which is the
      # ~20 s per member the kits' outboxes cover. cert-manager rotates the
      # leaf; the reloader watches the three files.
      tls {
        cert_file: /etc/nats/routes-tls/tls.crt
        key_file: /etc/nats/routes-tls/tls.key
        ca_file: /etc/nats/routes-tls/ca.crt
        verify: true
        timeout: 5
      }
      include "routes/routes.conf"
    }

    # Users and permissions live in the Secret meshsat-nats-auth (users.conf),
    # rendered by the Hub: the shared `meshsat` user for the Hub itself (password
    # from the pod environment) and one user per bridge with its bcrypt hash and
    # permissions confined to its subtree (MESHSAT-864 MR 21). The reloader
    # SIGHUPs nats-server when the file changes. no_auth_user is deliberately unset.
    include "auth/users.conf"

    mqtt {
      listen: 0.0.0.0:1883
      ack_wait: "30s"
      max_ack_pending: 100
      # Session, retained and QoS streams replicated on all three servers so a
      # bridge session survives the loss of the server it was created on.
      stream_replicas: 3
    }

    websocket {
      port: 9443
      tls {
        cert_file: /etc/nats/tls/tls.crt
        key_file: /etc/nats/tls/tls.key
        ca_file: /etc/nats/bridge-ca/ca.crt
        verify: true
        timeout: 5
      }
    }
