# The Hub bridge CA certificate, mounted by NATS (websocket client verification)
# and stunnel (Reticulum leg). Seeded ONCE from ci-no/apps/meshsat-hub/nats
# bridge_ca_crt (captured from system_config.bridge_ca_cert on the DMZ hub) and
# then owned at runtime by the Hub, which patches ca.crt whenever its CA changes
# (internal/bridge/casecret.go, HUB_BRIDGE_CA_SECRET_NAME). refreshInterval 0 =
# ESO creates the Secret and never refreshes it, so the two cannot fight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-bridge-ca
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-bridge-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: ci-no/apps/meshsat-hub/nats
        property: bridge_ca_crt
