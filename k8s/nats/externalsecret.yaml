apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-secrets
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nats-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        NATS_MQTT_PASSWORD: "{{ .NATS_MQTT_PASSWORD }}"
        NATS_ROUTE_PASSWORD: "{{ .NATS_ROUTE_PASSWORD }}"
        # The route list WITH the credential, included by the server config
        # inside its cluster block (MESHSAT-1194). nats-server 2.14 applies
        # cluster.authorization to inbound routes only; its outbound routes
        # carry whatever userinfo the URL has -- and a bare URL carries none,
        # which is how the cluster split on 2026-09-18. Rendered here so the
        # password never sits in the ConfigMap.
        routes.conf: |
          routes: [
            nats-route://route:{{ .NATS_ROUTE_PASSWORD }}@nats-0.nats-headless.meshsat-hub.svc.cluster.local:6222
            nats-route://route:{{ .NATS_ROUTE_PASSWORD }}@nats-1.nats-headless.meshsat-hub.svc.cluster.local:6222
            nats-route://route:{{ .NATS_ROUTE_PASSWORD }}@nats-2.nats-headless.meshsat-hub.svc.cluster.local:6222
          ]
  data:
    - secretKey: NATS_MQTT_PASSWORD
      remoteRef:
        key: ci-no/apps/meshsat-hub/nats
        property: NATS_MQTT_PASSWORD
    # Route (cluster) port credential, MESHSAT-1204 / posture V12: without it
    # any pod that can reach :6222 could join the JetStream cluster as a peer.
    - secretKey: NATS_ROUTE_PASSWORD
      remoteRef:
        key: ci-no/apps/meshsat-hub/nats
        property: NATS_ROUTE_PASSWORD
