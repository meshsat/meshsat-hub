# NATS x3 (MQTT broker + JetStream cluster, MESHSAT-711 phase 7) with the config
# reloader (SIGHUP when the TLS certificate or the bridge CA rotates) and the
# Prometheus exporter. Spread over the two eligible workers (preferred
# podAntiAffinity, so two pods share a node); volumes must never land on dmz06 (LocalPV binds permanently on first schedule):
# required nodeAffinity, not preferred. Pods start in parallel so the cluster
# can form (a pod is not Ready until JetStream has a meta leader).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
spec:
  # serviceName is immutable: the switch from `nats` was a one-time
  # `kubectl delete sts nats --cascade=orphan` followed by an Argo sync that
  # recreated the StatefulSet and adopted nats-0 (see NOTES.md).
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      shareProcessNamespace: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["notrf01dmz06"]
        # Only dmz01 and dmz02 are eligible (dmz06 excluded, dmz03-05 tainted
        # control-plane), so three pods spread over two nodes: preferred, not
        # required, or the third pod would never schedule.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nats
      containers:
        - name: nats
          image: docker.io/library/nats
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-secrets
                  key: NATS_MQTT_PASSWORD
          ports:
            - name: client
              containerPort: 4222
            - name: mqtt
              containerPort: 1883
            - name: websocket
              containerPort: 9443
            - name: monitor
              containerPort: 8222
            - name: cluster
              containerPort: 6222
          readinessProbe:
            # js-enabled-only: Ready once this server's JetStream is up and the
            # meta group has a leader, so a route-only server is never endpointed.
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/nats/bridge-ca, readOnly: true}
            - {name: auth, mountPath: /etc/nats/auth, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
            - {name: data, mountPath: /data}
        - name: reloader
          image: docker.io/natsio/nats-server-config-reloader
          args:
            - -pid
            - /var/run/nats/nats.pid
            - -config
            - /etc/nats/nats.conf
            - -config
            - /etc/nats/tls/tls.crt
            - -config
            - /etc/nats/tls/tls.key
            - -config
            - /etc/nats/bridge-ca/ca.crt
            - -config
            - /etc/nats/auth/users.conf
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/nats/bridge-ca, readOnly: true}
            - {name: auth, mountPath: /etc/nats/auth, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
        - name: exporter
          image: docker.io/natsio/prometheus-nats-exporter
          args: ["-connz", "-varz", "-jsz=all", "-port", "7777", "http://localhost:8222"]
          ports:
            - name: metrics
              containerPort: 7777
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: nats-config}
        - name: tls
          secret: {secretName: meshsat-net-tls}
        - name: bridge-ca
          secret: {secretName: meshsat-bridge-ca}
        - name: auth
          secret: {secretName: meshsat-nats-auth}
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 2Gi
