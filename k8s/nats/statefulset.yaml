# NATS x3 (MQTT broker + JetStream cluster, MESHSAT-711) with the config
# reloader (SIGHUP when the TLS certificate or the bridge CA rotates) and the
# Prometheus exporter. One member per control-plane node, beside the database:
# the workers are 49, 90 and 92 percent committed by other namespaces while
# these three sit near zero, and a local volume binds permanently on first
# schedule, so anti-affinity here has to be required rather than preferred or a
# single machine could hold two of the three and take the Raft group below
# quorum when it dies. Pods start in parallel so the cluster can form.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
spec:
  # serviceName is immutable, and this change also moves the pods to a different
  # tier, so the old volume cannot follow them. The cutover is scale to zero,
  # delete the StatefulSet, drop the claim, recreate (see NOTES.md). Adopting
  # the old pod with --cascade=orphan would strand it Pending on a volume it
  # cannot reach, and would briefly put two independent brokers behind one
  # Service.
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      shareProcessNamespace: true
      priorityClassName: meshsat-hub-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
      containers:
        - name: nats
          image: docker.io/library/nats
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-secrets
                  key: NATS_MQTT_PASSWORD
          ports:
            - name: client
              containerPort: 4222
            - name: mqtt
              containerPort: 1883
            - name: websocket
              containerPort: 9443
            - name: monitor
              containerPort: 8222
            - name: cluster
              containerPort: 6222
          readinessProbe:
            # js-server-only: JetStream is up AND this server is current with
            # the meta leader, without the per-stream sweep, so a member that
            # cannot see the group is not endpointed. js-enabled-only would only
            # say that JetStream is switched on, which is not the same claim.
            httpGet: {path: "/healthz?js-server-only=true", port: monitor}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # Deliberately the weakest check. A liveness probe that depends on
            # cluster state would fail on all three members during a quorum
            # blip, kubelet would restart all three, and the group could never
            # re-form.
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/nats/bridge-ca, readOnly: true}
            - {name: auth, mountPath: /etc/nats/auth, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
            - {name: data, mountPath: /data}
        - name: reloader
          image: docker.io/natsio/nats-server-config-reloader
          args:
            - -pid
            - /var/run/nats/nats.pid
            - -config
            - /etc/nats/nats.conf
            - -config
            - /etc/nats/tls/tls.crt
            - -config
            - /etc/nats/tls/tls.key
            - -config
            - /etc/nats/bridge-ca/ca.crt
            - -config
            - /etc/nats/auth/users.conf
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/nats/bridge-ca, readOnly: true}
            - {name: auth, mountPath: /etc/nats/auth, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
        - name: exporter
          image: docker.io/natsio/prometheus-nats-exporter
          args: ["-connz", "-varz", "-jsz=all", "-port", "7777", "http://localhost:8222"]
          ports:
            - name: metrics
              containerPort: 7777
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: nats-config}
        - name: tls
          secret: {secretName: meshsat-net-tls}
        - name: bridge-ca
          secret: {secretName: meshsat-bridge-ca}
        - name: auth
          secret: {secretName: meshsat-nats-auth}
        - name: pid
          emptyDir: {}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 2Gi
