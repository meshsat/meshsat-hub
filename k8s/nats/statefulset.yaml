# NATS x1 (MQTT broker + JetStream) with the config reloader (SIGHUP when the
# TLS certificate or the bridge CA rotates) and the Prometheus exporter.
# Volume must never land on dmz06 (LocalPV binds permanently on first schedule):
# required nodeAffinity, not preferred.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      serviceAccountName: meshsat-hub
      automountServiceAccountToken: false
      shareProcessNamespace: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["notrf01dmz06"]
      containers:
        - name: nats
          image: docker.io/library/nats
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: NATS_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-secrets
                  key: NATS_MQTT_PASSWORD
          ports:
            - name: client
              containerPort: 4222
            - name: mqtt
              containerPort: 1883
            - name: websocket
              containerPort: 9443
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/nats/bridge-ca, readOnly: true}
            - {name: auth, mountPath: /etc/nats/auth, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
            - {name: data, mountPath: /data}
        - name: reloader
          image: docker.io/natsio/nats-server-config-reloader
          args:
            - -pid
            - /var/run/nats/nats.pid
            - -config
            - /etc/nats/nats.conf
            - -config
            - /etc/nats/tls/tls.crt
            - -config
            - /etc/nats/tls/tls.key
            - -config
            - /etc/nats/bridge-ca/ca.crt
            - -config
            - /etc/nats/auth/users.conf
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: bridge-ca, mountPath: /etc/nats/bridge-ca, readOnly: true}
            - {name: auth, mountPath: /etc/nats/auth, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
        - name: exporter
          image: docker.io/natsio/prometheus-nats-exporter
          args: ["-connz", "-varz", "-jsz=all", "-port", "7777", "http://localhost:8222"]
          ports:
            - name: metrics
              containerPort: 7777
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: nats-config}
        - name: tls
          secret: {secretName: meshsat-net-tls}
        - name: bridge-ca
          secret: {secretName: meshsat-bridge-ca}
        - name: auth
          secret: {secretName: meshsat-nats-auth}
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-hostpath-retain
        resources:
          requests:
            storage: 2Gi
