# basemap serves the deep Europe archive to the dashboard through ingress: the
# Ingress routes /basemap/local.pmtiles (Exact) to this Service, so the caller
# is an ingress-nginx controller pod, a normal Cilium endpoint and not the
# hostNetwork edge relay. The first version of this policy was built from flows
# Hubble observed (MESHSAT-1205) in a window where nobody zoomed a map past
# zoom 11, so that flow was never seen; it admitted only host/remote-node, and
# with default-deny-ingress every deep-zoom request hung until ingress-nginx
# gave up with a 504 -- a slow map with no streets or names (MESHSAT-1229).
# The kubelet's probe comes from the node, which is why `host` stays.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: basemap-confine
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: basemap
    app.kubernetes.io/part-of: meshsat-hub
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: basemap
  ingress:
    # The kubelet probe, and anything the hostNetwork edge relay SNATs.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    # The browser's range requests, proxied by ingress-nginx.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ingress-nginx
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    # A cold replica's init container copies the 38 GB archive from a peer
    # through the Service (PEER_URL); without this it falls back to the public
    # planet build, which rate limits a second pull to about a day.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: basemap
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
