# One of the two keeps the deep map available through drains and evictions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: basemap
  namespace: meshsat-hub
  labels:
    app.kubernetes.io/name: basemap
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: basemap
