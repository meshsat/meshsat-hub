# GHCR pull secret for the tenant namespace (ghcr.io/meshsat/meshsat-hub-ots is
# private). ghcr_auth = base64(user:token), the same value the Hub's namespaces
# use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-meshsat
  namespace: meshsat-tak
  labels:
    app.kubernetes.io/name: registry-meshsat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: registry-meshsat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ .ghcr_auth }}"}}}
  data:
    - secretKey: ghcr_auth
      remoteRef:
        key: ci-no/apps/meshsat-hub/registry
        property: ghcr_auth
