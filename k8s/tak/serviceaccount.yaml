# The identity every per-tenant OpenTAKServer pod runs as. It exists only to
# carry the GHCR pull secret: the OTS image is private, and the pods must be able
# to do nothing else at all.
#
# automountServiceAccountToken is false on the ServiceAccount itself as well as
# on the pods the operator renders, so a token cannot reach a container by
# somebody forgetting the pod-level field. An OpenTAKServer is third-party Python
# on a public port; it has no business holding an API credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshsat-tak
  namespace: meshsat-tak
  labels:
    app.kubernetes.io/name: meshsat-tak
automountServiceAccountToken: false
imagePullSecrets:
  - name: registry-meshsat
