# gitleaks configuration -- the CI secret gate (job `gitleaks`).
#
# Extends the default ruleset. The allowlist below is by PATH and every entry is
# a place that holds test fixtures by design; nothing in it is a credential. A
# real secret anywhere else fails the pipeline. Add to this list only with a
# reason on the line, and never a non-test path.
[extend]
useDefault = true

[allowlist]
description = "test fixtures, not credentials"
paths = [
  # Go unit tests: fake API keys ("secret-key-123456"), key prefixes and the
  # zero-filled PEM shapes the sealed-config tests are built from.
  '''internal/.*_test\.go$''',
  # The store conformance harness shared by the sqlite and postgres tests.
  '''internal/store/storetest/.*\.go$''',
  # The Reticulum golden-vector generators and the Python interop peer
  # (MESHSAT-1555): upstream RNS/LXMF scripts whose import lines name key
  # classes (X25519PrivateKey) and whose fixtures are throwaway identities.
  '''internal/rnswire/testdata/.*\.py$''',
  '''internal/interop/testdata/.*\.py$''',
]

# Secrets allow-listed by VALUE, each one a string that is not a credential.
regexes = [
  # The CI cache key of the Reticulum interop venv, named after its pins
  # ("rns-venv-1.5.5-lxmf-1.2.0" in .gitlab-ci.yml at f439bbd; since moved
  # into the cache path). gitleaks reads "key: <that>" as a generic API key,
  # and the git scan sees the commit for 25 commits (MESHSAT-1555).
  '''rns-venv-[0-9.]+-lxmf-[0-9.]+''',
]
