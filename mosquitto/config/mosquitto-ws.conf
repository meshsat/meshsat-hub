# Mosquitto WebSocket bridge — accepts WSS clients and forwards to NATS MQTT.
# This container does NOT run a standalone broker. It bridges all messages
# bidirectionally to the NATS MQTT adapter on port 1883.

# WebSocket listener (nginx proxies /mqtt → here)
listener 9001
protocol websockets
allow_anonymous true

# No local TCP listener — NATS is the authoritative MQTT broker
# listener 1883 is intentionally omitted

# Bridge to NATS MQTT adapter
connection nats-bridge
address nats:1883
topic # both 0
cleansession true
start_type automatic
try_private false
bridge_protocol_version mqttv311

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

max_packet_size 1048576
max_keepalive 60
